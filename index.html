   <h3>Your save code</h3><div class="row" style="margin:8px 0"><button class="btn primary" data-a="codemake">${st.saveCode?'Make a fresh code':'Create save code'}</button>${st.saveCode?'<button class="btn" data-a="codecopy">Copy code</button>':''}</div>
   ${st.saveCode?`<textarea id="codeout" readonly spellcheck="false">${st.saveCode}</textarea><p class="muted" style="font-size:12.5px;margin-top:6px">${CR.fmt(st.saveCode.length)} characters. Made ${new Date(st.saveCodeAt).toLocaleTimeString()}. Anything you do after this isn’t in the code, so make a fresh one before you switch devices.</p>`:''}
   <h3 style="margin-top:18px">Load a save code</h3><textarea id="codein" spellcheck="false" placeholder="Paste a code that starts with CR2."></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" data-a="codeload">Load save</button>${CR.hasPreImportBackup()?'<button class="btn ghost" data-a="codeundo">Go back to the save from before the last load</button>':''}</div>
   <p class="muted" style="font-size:12.5px;margin-top:8px">Loading replaces the game in this browser. The current one is kept, so you can go back once.</p>
   <div class="row" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn danger" data-a="reset">Erase progress</button></div></section></div>`; };

// ---------- modals ----------
function modal(html,cls=''){ const m=$('#modal'); m.innerHTML=`<div class="dlg ${cls}" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Close">✕</button>${html}</div>`; m.classList.add('on'); m.querySelector('.x').focus(); }
function closeModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML=''; }
function confirmDlg(title,body,okLabel,okCls='primary'){ return new Promise(res=>{ modal(`<h2 style="margin-bottom:10px">${title}</h2><div class="muted" style="margin-bottom:20px">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cno">Cancel</button><button class="btn ${okCls}" id="cyes">${okLabel}</button></div>`,'sm'); $('#cno').onclick=()=>{closeModal();res(false)}; $('#cyes').onclick=()=>{closeModal();res(true)}; $('#cno').focus(); }); }
function inspect(defId,u){ const d=CR.byId[defId], rr=R(d.rarity), x=u!=null?CR.inst(u):null, own=S.inv.filter(i=>i.d===d.id).length, src=CR.sourcesOf(d.id), known=S.discovered[d.id];
  modal(`<div class="inspect" style="--rc:${rr.color}"><div><canvas id="inspcv"></canvas><p class="muted" style="font-size:12.5px;text-align:center;margin-top:6px">Drag to rotate</p></div><div>
   <span class="rtag" style="--rc:${rr.color}">${rr.sym} ${rr.name}</span><h1 style="margin:4px 0 8px">${esc(x?CR.instName(x):d.name)}${x&&x.g?` <span class="gradestars g${x.g}">${CR.GRADES[x.g].stars}</span>`:''}</h1><p>${esc(d.desc)}</p><p class="lore">${esc(d.lore)}</p>
   <dl class="kv">${x&&x.vr?`<dt>Variant</dt><dd><span class="vtext v-${x.vr}">${CR.VARIANT_BY[x.vr].sym} ${CR.VARIANT_BY[x.vr].name}</span> <span class="muted" style="font-size:13px">${CR.VARIANT_BY[x.vr].mult}× value, ${CR.VARIANT_BY[x.vr].perk}× perk. ${x.mut?`Mutated during a merge.`:`Found in 1 of ${CR.fmt(Math.round(1/CR.VARIANT_BY[x.vr].p))} relics.`}</span></dd>`:''}<dt>Sell value</dt><dd>${cr(x?CR.instValue(x):d.value)}${x&&x.g?` <span class="muted" style="font-size:13px">(${CR.GRADES[x.g].name}: ${CR.MERGE_N**x.g}× base)</span>`:''}</dd>${CR.PERKS[d.id]?`<dt>Museum perk</dt><dd class="perkdd">${perkText(d.id,x?x.g:0)}${x&&x.g?` <span class="muted" style="font-size:13px">(${CR.GRADES[x.g].mult}× from ${CR.GRADES[x.g].name})</span>`:''}<br><span class="muted" style="font-size:13px">${CR.perks().src.includes(d.id)?'Active now: one is on display.':'Active while one is on display in your museum.'} Merging copies makes it up to 3× stronger.</span></dd>`:''}${x?`<dt>Income</dt><dd><span class="tab" style="color:var(--gold,#edc46a)">+${CR.fmtRate(CR.instYield(x.u))}/s</span> <span class="muted" style="font-size:13px">${CR.fmt(Math.floor(CR.instYield(x.u)*3600))} per hour${CR.isDisplayed(x.u)?', tripled on display':CR.instYield(x.u)===0?'. Only the first '+CR.YIELD_COPIES+' copies of a relic earn':''}</span></dd>`:''}<dt>Collection</dt><dd>${esc(CR.colById[d.collection].name)}</dd><dt>Origin</dt><dd>${esc(CR.colById[d.collection].region)}</dd><dt>You own</dt><dd>${own}${x&&stackOf(x).length>1&&stackOf(x).length!==own?` <span class="muted">(${stackOf(x).length} of this exact one)</span>`:''} ${known?`· first registered ${new Date(known).toLocaleDateString()}`:'· not yet registered'}</dd>${x?`<dt>This copy</dt><dd>#${x.u} · from ${esc(x.src.startsWith('voy:')?'a voyage to '+(CR.SECTOR_BY[x.src.slice(4)]?.name||'deep space'):x.src.startsWith('exp:')?'an expedition':CR.caseById[x.src]?.name||x.src)} · ${new Date(x.t).toLocaleString()}</dd>`:''}<dt>Found in</dt><dd>${src.length?src.map(s=>`${esc(s.c.name)} <span class="muted">(${CR.pct(s.p)})</span>`).join('<br>'):'Expeditions only'}</dd></dl>
   ${x?`<div class="row">${CR.sellable(x)?`<button class="btn gold" data-a="sell-one" data-v="${x.u}">Sell ${stackOf(x).length>1?'one ':''}for ${CR.fmt(CR.instValue(x))}</button>`:''}${(()=>{ const g=stackOf(x), sel=g.filter(CR.sellable), k=sel.length===g.length?sel.length-1:sel.length; return g.length>1&&k>0?`<button class="btn gold ghost" data-a="sell-spares" data-v="${x.u}" title="Keeps one copy">Sell ${k} spare${k>1?'s':''} for ${CR.fmt(k*CR.instValue(x))}</button>`:''; })()}<button class="btn" data-a="lock" data-v="${x.u}">${x.lk?'Unlock':'Lock'}</button>${!CR.isDisplayed(x.u)?`<button class="btn ghost" data-a="to-museum" data-v="${x.u}">Display in museum</button>`:'<span class="muted" style="font-size:13px">On display in your museum</span>'}</div>`:own?`<button class="btn" data-a="find-inv" data-v="${d.id}">Show my copies</button>`:''}
  </div></div>`); itemCanvas($('#inspcv'),d.id,{drag:true,variant:x&&x.vr}); }

async function trySell(uids){
  const insts=uids.map(CR.inst).filter(Boolean); const warnI=CR.RIDX[S.settings.warnFrom];
  const rare=insts.filter(x=>CR.RIDX[CR.byId[x.d].rarity]>=warnI); const total=insts.reduce((s,x)=>s+CR.instValue(x),0);
  const lastCopies=insts.filter(x=>S.inv.filter(i=>i.d===x.d).length===insts.filter(i=>i.d===x.d).length);
  if(rare.length||insts.length>1){
    const ok=await confirmDlg(insts.length>1?`Sell ${insts.length} items?`:`Sell ${esc(CR.byId[insts[0].d].name)}?`,`You will receive ${cr(total)}.${rare.length?`<br><br><span style="color:#ff9ac0">Includes ${rare.length} item${rare.length>1?'s':''} of ${R(S.settings.warnFrom).name} rarity or higher: ${rare.slice(0,4).map(x=>esc(CR.byId[x.d].name)).join(', ')}${rare.length>4?'…':''}.</span>`:''}${lastCopies.length?`<br><br>${lastCopies.length} of these ${lastCopies.length>1?'are your last copies':'is your last copy'}. Selling won’t unregister ${lastCopies.length>1?'them':'it'} from your collections.`:''}`,'Sell','gold');
    if(!ok) return null; }
  const r=CR.sell(uids); if(r.error){ toast(r.error,'bad'); CR.sfx.error(); return null; }
  CR.sfx.coin(); toast(`Sold ${r.count} item${r.count>1?'s':''} for ${CR.fmt(r.total)} Credits`,'good'); return r; }

async function doOpen(id,n){
  const c=CR.caseById[id];
  if(!c.free&&(n>1||c.cost*n>S.settings.confirmOver)){ if(!await confirmDlg(`Open ${n>1?n+' × ':''}${esc(c.name)}?`,`This costs ${cr(c.cost*n)}. You have ${cr(S.credits)}.`,'Open')) return; }
  const pre=S.credits;
  const res=CR.openCase(id,n); if(res.error){ toast(res.error,'bad'); CR.sfx.error(); return; }
  // The result is already recorded. Hide anything that would spoil it (feed, rewards, toasts) until the reveal.
  CR.revealing=true; chrome(); $('#credval').textContent=CR.fmt(pre-(c.cost||0)*n);
  const unveil=()=>{ CR.revealing=false; chrome(); CR.flushToasts(); };
  if(CR.saveError) toast(CR.saveError,'bad');
  if(res.results.length===1){ const r=res.results[0]; const {stage,ri,rc}=await CR.playOpening(c,r); unveil();
    const big=ri>=4; const el=document.createElement('div'); el.className='reveal enter'+(big?' big':''); el.style.setProperty('--rc',rc);
    el.innerHTML=`<div class="glowbg"></div>${ri>=2?'<div class="rays"></div>':''}<canvas id="revcv"></canvas>${r.inst.vr?`<div class="vbanner v-${r.inst.vr}">${CR.VARIANT_BY[r.inst.vr].sym} ${CR.VARIANT_BY[r.inst.vr].name.toUpperCase()} VARIANT ${CR.VARIANT_BY[r.inst.vr].sym}</div>`:''}<div class="rt2">${R(r.def.rarity).sym} ${R(r.def.rarity).name.toUpperCase()}</div><div class="rn">${esc(CR.instName(r.inst))}</div><p class="rdesc">${esc(r.def.desc)}</p><div class="rv">${cr(CR.instValue(r.inst))}</div>${r.first?`<div class="firstreg">New registration added to your catalog. Discovery bonus +${CR.fmt(r.bonus||0)} Credits</div>`:''}${bonusHTML(res.bonus)}
     <div class="acts"><button class="btn primary" id="rkeep">Keep</button><button class="btn" id="rsell">Sell for ${CR.fmt(CR.instValue(r.inst))}</button><button class="btn ghost" id="rinsp">Inspect</button>${CR.canOpen(c,1).ok?`<button class="btn ghost" id="ragain">Open again${c.free?'':' · '+CR.fmt(c.cost)}</button>`:''}</div>`;
    stage.appendChild(el); itemCanvas($('#revcv'),r.def.id,{speed:0.8,variant:r.inst.vr}); $('#rkeep').focus();
    const done=()=>{CR.closeStage(); render();};
    $('#rkeep').onclick=done; $('#rsell').onclick=async()=>{ const s=await trySell([r.inst.u]); if(s) done(); };
    $('#rinsp').onclick=()=>{ done(); inspect(r.def.id,r.inst.u); };
    const ag=$('#ragain'); if(ag) ag.onclick=()=>{ CR.closeStage(); doOpen(id,1); };
  } else {
    const {stage}=await CR.playBatch(c,res.results); unveil(); const tot=res.results.reduce((s,r)=>s+r.def.value,0);
    const bar=document.createElement('div'); bar.className='acts reveal'; bar.style.cssText='flex-direction:row;gap:10px;margin-top:22px;max-width:none';
    const spare=res.results.filter(r=>!r.first&&!r.inst.vr&&CR.RIDX[r.def.rarity]<CR.RIDX[S.settings.warnFrom]);
    const bon=res.results.reduce((s,r)=>s+(r.bonus||0),0); bar.innerHTML=`${bonusHTML(res.bonus)}<div style="width:100%;margin-bottom:10px;font-family:var(--display);font-size:18px">Total value ${cr(tot)}${bon?` <span style="color:var(--cyan);font-size:15px">plus ${CR.fmt(bon)} in discovery bonuses</span>`:''}</div><button class="btn primary" id="bkeep">Keep all</button>${spare.length?`<button class="btn" id="bsell">Sell repeats below ${R(S.settings.warnFrom).name} · ${CR.fmt(spare.reduce((s,r)=>s+r.def.value,0))}</button>`:''}${CR.canOpen(c,n).ok?`<button class="btn ghost" id="bagain">Open ×${n} again</button>`:''}`;
    bar.style.flexWrap='wrap'; stage.appendChild(bar); $('#bkeep').focus();
    $('#bkeep').onclick=()=>{CR.closeStage();render();};
    const bs=$('#bsell'); if(bs) bs.onclick=async()=>{ const s=await trySell(spare.map(r=>r.inst.u)); if(s){CR.closeStage();render();} };
    const ba=$('#bagain'); if(ba) ba.onclick=()=>{CR.closeStage();doOpen(id,n);};
  }
}

function perkText(id,g=0){ const p=CR.PERKS[id], m=CR.GRADES[g||0].mult; return Object.entries(p).sort((a,b)=>CR.PERK_ORDER.indexOf(a[0])-CR.PERK_ORDER.indexOf(b[0])).map(([k,v])=>CR.perkLabel(k,Math.round(v*m*10)/10)).join(', '); }
function perkLine(id,u){ if(!CR.PERKS[id]) return ''; const x=CR.inst(u), g=(x&&x.g)||0;
  const shown=S.museum.slice(0,CR.museumSlots()).map(v=>v!=null&&CR.inst(v)).filter(y=>y&&y.d===id);
  const best=shown.reduce((a,y)=>(y.g||0)>(a.g||0)?y:a,shown[0]); const counts=best&&best.u===u;
  return `<div class="perkchip${counts?' on':''}">${perkText(id,g)}${counts?'':' (a better copy counts instead)'}</div>`; }
function perkPanel(){ const p=CR.perks(), keys=CR.PERK_ORDER;
  const have={}; for(const x of S.inv){ if(!CR.PERKS[x.d]||p.src.includes(x.d)) continue; if(!have[x.d]||(x.g||0)>(have[x.d].g||0)) have[x.d]=x; }
  const idle=Object.values(have).sort((a,b)=>CR.RIDX[CR.byId[b.d].rarity]-CR.RIDX[CR.byId[a.d].rarity]||(b.g||0)-(a.g||0)).slice(0,8);
  return `<section class="panel perkpanel"><div class="spread"><h2>Active perks</h2><span class="muted" style="font-size:13px">${p.src.length} relic${p.src.length===1?'':'s'} contributing</span></div>
   <div class="perkgrid">${keys.filter(k=>p[k]).map(k=>{const T=CR.PERK_TYPES[k], v=p[k], capped=p.raw[k]>T.cap; return `<div class="perk${v?' on':''}"><div class="spread"><b>${T.name}</b><span class="tab">${v?`${T.sign}${v}%`:'None'}</span></div><div class="bar"><i style="width:${isFinite(T.max)?Math.min(100,v/T.max*100):Math.min(100,v)}%"></i></div><p class="muted">${T.desc}</p><p class="muted" style="font-size:12px">Museum ${T.sign}${Math.round(p.ore[k]*10)/10}%${capped?` (museum limit ${T.cap}% reached)`:''}${p.up[k]?`, upgrades ${T.sign}${p.up[k]}%`:''}${p.mods&&p.mods[k]?`, modules ${T.sign}${p.mods[k]}%`:''}. ${isFinite(T.max)?`Limit ${T.sign}${T.max}%.`:'No limit.'}</p></div>`;}).join('')}</div>
   ${keys.some(k=>p[k])?'':'<p class="muted" style="margin-top:10px">No perks active yet. Put an ore or any Rare-or-better relic on a pedestal.</p>'}${keys.some(k=>!p[k])?`<p class="muted" style="font-size:13px;margin-top:12px">Not active yet: ${keys.filter(k=>!p[k]).map(k=>`<span title="${esc(CR.PERK_TYPES[k].desc)}" style="text-decoration:underline dotted">${CR.PERK_TYPES[k].name}</span>`).join(', ')}.</p>`:''}
   ${idle.length?`<p class="muted" style="font-size:13px;margin-top:12px">Your strongest relics not on display: ${idle.map(x=>`${esc(CR.instName(x))} (${perkText(x.d,x.g)})`).join('; ')}.</p>`:''}
  </section>`; }
function picker(slot){ const opts=S.inv.filter(x=>!CR.isDisplayed(x.u)).sort((a,b)=>(b.g||0)-(a.g||0));
  const seen=new Set(); const uniq=opts.filter(x=>seen.has(x.d)?false:seen.add(x.d)).sort((a,b)=>(CR.PERKS[b.d]?1:0)-(CR.PERKS[a.d]?1:0)||CR.RIDX[CR.byId[b.d].rarity]-CR.RIDX[CR.byId[a.d].rarity]||(b.g||0)-(a.g||0));
  modal(`<h2 style="margin-bottom:6px">Choose a relic to display</h2><p class="muted" style="margin-bottom:14px;font-size:13.5px">Your best copy of each relic, strongest perks first. Each relic counts once, so a second copy on another pedestal adds nothing.</p>${uniq.length?`<div class="tiles">${uniq.map(x=>{const d=CR.byId[x.d],rr=R(d.rarity);return `<button class="tile r${CR.RIDX[d.rarity]}" style="--rc:${rr.color}" data-a="pick" data-v="${x.u}" data-slot="${slot}">${x.g?`<div class="badges"><span></span><span class="badge grade g${x.g}">${CR.GRADES[x.g].stars}</span></div>`:''}<img src="${CR.thumbX(x)}" alt=""><div class="nm">${esc(CR.instName(x))}</div><div class="meta"><span class="rtag" style="--rc:${rr.color}">${rr.sym} ${rr.name}</span></div>${CR.PERKS[d.id]?`<div class="perkchip">${perkText(d.id,x.g)}${CR.perks().src.includes(d.id)?' (already active)':''}</div>`:''}</button>`;}).join('')}</div>`:'<div class="empty">Everything you own is already on display.</div>'}`); }

// ---------- toasts ----------
const tq=[]; CR.flushToasts=()=>{ while(tq.length) toast(...tq.shift()); };
function toast(msg,kind=''){ if(CR.revealing&&kind!=='bad'){ tq.push([msg,kind]); return; } const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg; const tc=$('#toasts'); tc.appendChild(t); while(tc.children.length>3) tc.firstElementChild.remove(); setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400);},3200); }
CR.toast=toast;

   case 'shiprenameok': { CR.renameShip(+v,$('#shipname').value.trim()); closeModal(); render(); break; }
   case 'partcombine': { const [sl,ti]=v.split(':'); const r=CR.combineParts(sl,+ti); if(r.error) toast(r.error,'bad'); else { CR.sfx.sparkle(5); toast(`Made a ${CR.partName(r.part)}.`,'good'); } render(); break; }
   case 'autostart': { const c=CR.caseById[v], a=autoCfg(); if(!c.free){ const max=+a.max||0; if(!(await confirmDlg(`Auto-open ${esc(c.name)}?`,`Up to ${max?CR.fmt(max)+' openings':'no limit on openings'}, ${cr(c.cost)} each${max?`, at most ${cr(c.cost*max)} in total`:''}. It keeps at least ${cr(+a.keep||0)} and stops on the rules you picked. You can stop it any time.`,'Start'))) break; } autoStart(v); break; }

   case 'inspect-def': inspect(v); break;

   case 'sel-dupes': { const keep=new Set(); const L=S.inv.slice().sort((a,b)=>(CR.sellable(a)?1:0)-(CR.sellable(b)?1:0)||a.t-b.t); // keep a non-sellable (locked/displayed) copy first, else the oldest
     L.forEach(x=>{ if(x.vr||x.g) return; if(!keep.has(x.d)){keep.add(x.d);return;} if(CR.sellable(x)&&CR.RIDX[CR.byId[x.d].rarity]<CR.RIDX[S.settings.warnFrom]) st.inv.sel.add(x.u); }); render(); break; }

   case 'merge': { const [d,g,t,vr]=v.split(':'); const r=CR.merge(d,+g,+t,vr||''); if(r.error){ CR.sfx.error(); toast(r.error,'bad'); } else { CR.sfx.reveal(CR.RIDX[CR.byId[d].rarity]); const plain=r.made.filter(x=>!r.mutations.some(m=>m.inst===x)); if(plain.length) toast(`Made ${plain.length>1?plain.length+' × ':''}${CR.instName(plain[0])}`,'good'); render(); if(r.mutations.length) mutationReveal(r.mutations); else break; } render(); break; }
   case 'mergeall': { const groups=CR.mergeGroups().filter(g=>g.items.length>=CR.MERGE_N); const n=groups.reduce((a,g)=>a+Math.floor(g.items.length/CR.MERGE_N),0);
     if(!(await confirmDlg('Merge everything?',`This makes ${n} merge${n===1?'':'s'} across ${groups.length} relics, using ${n*CR.MERGE_N} copies. Locked copies and copies on display are left alone.`,`Merge ${n}`))) break;

// A side-view ship drawn from its parts: hull shape, engine glow, thruster fins, scanner dish and cargo pods all follow the parts' tiers.
CR.drawShip=function(x,W,H,sh,t=0,flying=false){ const st=CR.shipStats(sh), P=sh.parts, col=s=>CR.PART_TIER_COLORS[P[s].tier]; x.clearRect(0,0,W,H);
  const cx=W*0.52, cy=H*0.52+(flying?Math.sin(t*2)*H*0.02:0), L=W*(0.5+P.hull.tier*0.05), h=H*(0.2+P.hull.tier*0.01);
  if(flying) for(let i=0;i<26;i++){ const y=((i*37)%100)/100*H, sp=0.4+((i*13)%10)/10, xx=W-((t*W*0.9*sp+i*71)%(W*1.4)); x.strokeStyle=`rgba(200,220,255,${0.15+sp*0.3})`; x.lineWidth=1; x.beginPath(); x.moveTo(xx,y); x.lineTo(xx+20+sp*40,y); x.stroke(); }
  // engine flame
  const fl=L*(0.18+P.engine.tier*0.05)*(flying?1+0.15*Math.sin(t*20):0.55+0.1*Math.sin(t*6)), ex=cx-L/2;
  const fg=x.createLinearGradient(ex,0,ex-fl,0); fg.addColorStop(0,'#ffffff'); fg.addColorStop(0.25,col('engine')); fg.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=fg; x.beginPath(); x.moveTo(ex,cy-h*0.32); x.quadraticCurveTo(ex-fl*0.6,cy-h*0.1,ex-fl,cy); x.quadraticCurveTo(ex-fl*0.6,cy+h*0.1,ex,cy+h*0.32); x.fill();
  // thruster fins
  const fins=1+Math.min(2,Math.floor(P.thrusters.tier/2)); x.fillStyle=CR.rgba(col('thrusters'),0.9); for(let i=0;i<fins;i++){ const fx=cx-L*0.42+i*L*0.08; for(const sd of [-1,1]){ x.beginPath(); x.moveTo(fx,cy+sd*h*0.35); x.lineTo(fx-L*0.12,cy+sd*h*(1.05+P.thrusters.tier*0.06)); x.lineTo(fx+L*0.12,cy+sd*h*0.35); x.closePath(); x.fill(); } }
  // cargo pods underneath
  for(let i=0;i<st.cargo;i++){ const px=cx-L*0.25+i*(L*0.5/Math.max(1,st.cargo-1||1)); x.fillStyle='#2a3348'; x.strokeStyle=CR.rgba(col('cargo'),0.9); x.lineWidth=1.5; x.beginPath(); x.roundRect(px-L*0.04,cy+h*0.42,L*0.08,h*0.32,3); x.fill(); x.stroke(); }
  // hull
  const g=x.createLinearGradient(0,cy-h,0,cy+h); g.addColorStop(0,'#dfe6f2'); g.addColorStop(0.45,'#8a95ad'); g.addColorStop(1,'#3a4358'); x.fillStyle=g;
  x.beginPath(); x.moveTo(cx-L/2,cy-h*0.42); x.lineTo(cx+L*0.18,cy-h*0.5); x.quadraticCurveTo(cx+L*0.5,cy-h*0.2,cx+L*0.56,cy); x.quadraticCurveTo(cx+L*0.5,cy+h*0.22,cx+L*0.18,cy+h*0.48); x.lineTo(cx-L/2,cy+h*0.42); x.closePath(); x.fill();
  x.strokeStyle=CR.rgba(col('hull'),0.95); x.lineWidth=2; x.stroke();
  x.strokeStyle=CR.rgba(col('hull'),0.6); x.lineWidth=1; for(let i=1;i<4;i++){ const lx=cx-L/2+i*L*0.17; x.beginPath(); x.moveTo(lx,cy-h*0.45); x.lineTo(lx,cy+h*0.45); x.stroke(); }
  x.fillStyle=CR.rgba(col('hull'),0.85); x.fillRect(cx-L*0.45,cy-h*0.06,L*0.6,h*0.12);
  // cockpit
  const cg=x.createLinearGradient(cx+L*0.25,cy-h*0.35,cx+L*0.45,cy); cg.addColorStop(0,'#bfe9ff'); cg.addColorStop(1,'#1a3a6a'); x.fillStyle=cg; x.beginPath(); x.moveTo(cx+L*0.22,cy-h*0.38); x.quadraticCurveTo(cx+L*0.44,cy-h*0.3,cx+L*0.48,cy-h*0.05); x.lineTo(cx+L*0.24,cy-h*0.05); x.closePath(); x.fill();
  // scanner dish on top
  const sx=cx+L*0.02, sy=cy-h*0.5; x.strokeStyle='#9aa6bf'; x.lineWidth=2; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx,sy-h*0.35); x.stroke();
  x.save(); x.translate(sx,sy-h*0.4); x.rotate(Math.sin(t*1.5)*0.5); x.fillStyle=CR.rgba(col('scanner'),0.95); x.beginPath(); x.ellipse(0,0,h*(0.28+P.scanner.tier*0.03),h*0.12,0,0,Math.PI); x.fill(); x.restore();
  if(P.scanner.tier>=2){ const pu=(t*0.8)%1; x.strokeStyle=CR.rgba(col('scanner'),0.6*(1-pu)); x.beginPath(); x.arc(sx,sy-h*0.45,h*(0.3+pu*0.8),Math.PI*1.1,Math.PI*1.9); x.stroke(); }
  // engine glow
  const eg=x.createRadialGradient(ex,cy,0,ex,cy,h*0.6); eg.addColorStop(0,CR.rgba(col('engine'),0.8)); eg.addColorStop(1,CR.rgba(col('engine'),0)); x.fillStyle=eg; x.beginPath(); x.arc(ex,cy,h*0.6,0,7); x.fill(); };

function autoPanel(c){ const a=autoCfg(), run=AUTO.on&&AUTO.crate===c.id; const rsel=(k,v,none)=>`<select data-auto="${k}">${none?`<option value="" ${!v?'selected':''}>${none}</option>`:''}${CR.RARITIES.slice(1).map(r=>`<option value="${r.id}" ${v===r.id?'selected':''}>${r.name}${k==='stopRar'?' or rarer':''}</option>`).join('')}</select>`;
  return `<details class="autopanel" ${run||st.autoOpen?'open':''}><summary><b>⟳ Auto-open</b> <span class="muted">Keeps opening this crate for you${c.free?' whenever the free drop is ready':''}, until a rule says stop.</span></summary>
   <div class="autogrid">
    ${c.free?'':`<label>Openings<select data-auto="max">${[10,50,100,250,500,1000,0].map(n=>`<option value="${n}" ${+a.max===n?'selected':''}>${n||'No limit'}</option>`).join('')}</select></label>
    <label>Always keep at least<input type="number" min="0" step="1000" data-auto="keep" value="${a.keep}"></label>`}
    <label>Stop when I find${rsel('stopRar',a.stopRar,'Never stop for rarity')}</label>
    <label>Auto-sell repeats below${rsel('sellBelow',a.sellBelow,'Don’t sell')}</label>
    <label class="ck"><input type="checkbox" data-auto="stopVar" ${a.stopVar?'checked':''}> Stop on any variant</label>
    <label class="ck"><input type="checkbox" data-auto="stopNew" ${a.stopNew?'checked':''}> Stop on a new registration</label>
    <label class="ck"><input type="checkbox" data-auto="stopBonus" ${a.stopBonus?'checked':''}> Stop on a module or ship part</label>
    <label>Speed<select data-auto="speed"><option value="normal" ${a.speed==='normal'?'selected':''}>Normal</option><option value="fast" ${a.speed==='fast'?'selected':''}>Fast</option></select></label>
   </div>
   <p class="muted" style="font-size:12.5px;margin:8px 0 10px">Auto-selling only sells copies you already have another one of, never variants, merged, locked or displayed relics. It stops by itself when you run out of Credits, leave the game, or the crate becomes unavailable.</p>
   ${run?`<button class="btn danger" data-a="autostop">Stop auto-opening</button>`:`<button class="btn primary" data-a="autostart" data-v="${c.id}" ${AUTO.on?'disabled':''}>${AUTO.on?'Already auto-opening another crate':'Start auto-opening'}</button>`}</details>`; }
function autoHud(){ let h=document.getElementById('autohud'); if(!AUTO.on){ if(h) h.remove(); return; } if(!h){ h=document.createElement('div'); h.id='autohud'; document.body.appendChild(h); }
  const c=CR.caseById[AUTO.crate]; h.innerHTML=`<span class="spin">⟳</span><span><b>Auto-opening ${esc(c.name)}</b><small>${CR.fmt(AUTO.opened)}${AUTO.max?' / '+CR.fmt(AUTO.max):''} opened · spent ${CR.fmt(AUTO.spent)}${AUTO.sold?` · sold ${CR.fmt(AUTO.sold)}`:''}${AUTO.best?` · best: ${esc(AUTO.best)}`:''}${AUTO.bonus?` · ${AUTO.bonus} bonus drop${AUTO.bonus>1?'s':''}`:''}</small></span><button class="btn sm" data-a="autogo">View</button><button class="btn sm danger" data-a="autostop">Stop</button>`; }
function autoStop(reason){ if(!AUTO.on) return; AUTO.on=false; clearTimeout(AUTO.timer); autoHud(); const c=CR.caseById[AUTO.crate];
  toast(`Auto-open stopped${reason?': '+reason:''}. Opened ${CR.fmt(AUTO.opened)} × ${c.name}, spent ${CR.fmt(AUTO.spent)}${AUTO.sold?`, sold repeats for ${CR.fmt(AUTO.sold)}`:''}.`,reason&&/found|got/i.test(reason)?'good':''); render(); }
function autoStart(id){ const c=CR.caseById[id], a=autoCfg(); if(AUTO.on) return;
  Object.assign(AUTO,{on:true,crate:id,opened:0,spent:0,sold:0,best:'',bestRi:-1,bonus:0,max:c.free?0:+a.max||0}); autoHud(); render(); autoTick(); }
function autoTick(){ if(!AUTO.on) return; const a=autoCfg(), c=CR.caseById[AUTO.crate];
  const next=()=>{ AUTO.timer=setTimeout(autoTick,a.speed==='fast'?220:650); };
  if(c.free){ const w=CR.freeReadyIn(); if(w>0){ autoHud(); AUTO.timer=setTimeout(autoTick,Math.min(w+50,5000)); return; } }
  else { if(AUTO.max&&AUTO.opened>=AUTO.max) return autoStop(`reached ${CR.fmt(AUTO.max)} openings`); if(S.credits-c.cost<(+a.keep||0)) return autoStop(S.credits<c.cost?'out of Credits':`keeping ${CR.fmt(+a.keep)} Credits in reserve`); }
  const ch=CR.canOpen(c,1); if(!ch.ok) return autoStop(ch.why.replace(/\.$/,''));
  const r=CR.openCase(c.id,1); if(r.error) return autoStop(r.error.replace(/\.$/,'')); AUTO.opened++; AUTO.spent+=c.cost||0; CR.sfx.tick(1.2);
  let stop=null;
  for(const x of r.results){ const ri=CR.RIDX[x.def.rarity];
    if(ri>AUTO.bestRi){ AUTO.bestRi=ri; AUTO.best=CR.instName(x.inst); }
    if(a.stopRar&&ri>=CR.RIDX[a.stopRar]) stop=stop||`found ${/^[AEIOU]/.test(x.def.name)?'an':'a'} ${R(x.def.rarity).name} ${CR.instName(x.inst)}`;
    if(a.stopVar&&x.inst.vr) stop=stop||`found a ${CR.VARIANT_BY[x.inst.vr].name} variant`;
    if(a.stopNew&&x.first) stop=stop||`registered ${CR.instName(x.inst)}`;
    if(!stop&&a.sellBelow&&ri<CR.RIDX[a.sellBelow]&&!x.first&&!x.inst.vr&&!x.inst.g&&!x.inst.lk&&!CR.isDisplayed(x.inst.u)&&S.inv.filter(y=>y.d===x.def.id).length>1){ const s=CR.sell([x.inst.u]); if(s&&!s.error) AUTO.sold+=s.total||0; }
    else if(ri>=4||x.inst.vr) toast(`Auto-open: ${CR.instName(x.inst)} (${R(x.def.rarity).name})`,'good'); }
  if(r.bonus&&r.bonus.length){ AUTO.bonus+=r.bonus.length; for(const b of r.bonus) toast(b.kind==='module'?`Module found: ${b.m.name}, +${b.v}${b.m.unit==='h'?' h':'%'} ${b.m.stat.toLowerCase()}`:`Ship part found: ${CR.partName(b.p)}`,'good'); if(a.stopBonus) stop=stop||'got a bonus drop'; }
  chrome(); autoHud(); if(stop) return autoStop(stop); next(); }
addEventListener('beforeunload',()=>{ AUTO.on=false; });

function awayModal(r){ if(document.querySelector('.awaydlg')) return; CR.sfx&&CR.sfx.coin&&CR.sfx.coin(); modal(`<div class="awaydlg" style="text-align:center"><div class="k" style="letter-spacing:.2em;font-size:12px;color:var(--cyan);text-transform:uppercase">While you were away</div><h2 style="margin:8px 0 4px">Your relics earned</h2><div class="awayamt tab">${COIN}${CR.fmt(r.amount)}</div>
  <p class="muted" style="font-size:14px;margin-top:8px">You were gone ${CR.fmtTime(r.away*1000)}.${r.capped?` Relics earn for up to ${CR.offlineHours()} hours while the game is closed${CR.upLevel('nightshift')<5?'. Night Shift Archivists in Upgrades extends that':''}.`:''}</p><button class="btn gold" data-a="close" style="margin-top:14px">Collect</button></div>`); }
CR.boot=function(){ S=CR.load(); CR.applyTheme(); CR.reduced=S.settings.reduced; document.body.classList.toggle('reduced',!!S.settings.reduced); shell(); CR.sky($('#sky')); go('dashboard'); if(CR.loadError) toast(CR.loadError,'bad'); if(CR.offlineReport) setTimeout(()=>awayModal(CR.offlineReport),400); if(CR.migrationGrant) setTimeout(()=>toast(`Season 2 is here. ${CR.fmt(CR.migrationGrant)} Credits added to get your refinery started.`,'good'),800);
  let started=false; const startAudio=()=>{ if(started) return; started=true; if(S.settings.music) CR.ambient(true); }; addEventListener('pointerdown',startAudio,{once:false});
  let lastReady=CR.voyagesReady?CR.voyagesReady():0;
  setInterval(()=>{ if(CR.trimMuseum&&CR.trimMuseum()&&st.view==='museum') render(); const vr=CR.voyagesReady?CR.voyagesReady():0; if(vr!==lastReady){ if(vr>lastReady) toast(vr>1?`${vr} ships are back with cargo.`:'A ship is back with cargo. Unload it in the Hangar.','good'); lastReady=vr; if(st.view==='hangar') render(); } const yr=CR.settleYield(); if(yr&&yr.amount>0) awayModal(yr); chrome(); document.querySelectorAll('[data-yrate]').forEach(el=>el.textContent='+'+CR.fmtRate(CR.yieldRate())); document.querySelectorAll('[data-count]').forEach(el=>{ el.textContent=CR.fmtTime(Math.max(0,+el.dataset.count-Date.now())); }); document.querySelectorAll('[data-refpend]').forEach(el=>{ const p=CR.refPending(); el.textContent=CR.fmt(Math.floor(p)); const b=document.querySelector('[data-refbar]'); if(b) b.style.width=(p/CR.refCap()*100)+'%'; }); document.querySelectorAll('[data-exp]').forEach(el=>{ const x=S.exps.find(e=>e.k==+el.dataset.exp); if(!x) return; el.style.width=Math.min(100,(Date.now()-x.start)/(x.end-x.start)*100)+'%'; const l=document.querySelector(`[data-expl="${x.k}"]`); const left=x.end-Date.now(); if(l) l.textContent=left>0?CR.fmtTime(left):'Returned'; if(left<=0&&!el.dataset.done){ el.dataset.done=1; if(st.view==='expeditions') render(); } }); },1000);
  addEventListener('beforeunload',()=>CR.save()); };
})(window);

CR.boot();</script></body></html>
