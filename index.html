<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cosmic Relics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>:root{
 color-scheme:dark;
 --void:#060A1A; --deep:#0B1230; --panel:#0F173A; --panel2:#141E48; --line:#22305F; --line2:#2E3F78;
 --ink:#E3E8F7; --dim:#97A2C4; --faint:#5F6B92;
 --cyan:#62E6F2; --violet:#8C6DFF; --magenta:#E04BB4; --gold:#EDC46A;
 --r-sm:6px; --r:10px; --r-lg:16px;
 --ease:cubic-bezier(.2,.7,.2,1);
 --display:'Chakra Petch',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--void);color:var(--ink);font:15px/1.5 var(--body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--dim)}

/* Shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:236px 1fr 288px;height:100%}
#side{background:linear-gradient(180deg,rgba(11,18,48,.92),rgba(6,10,26,.92));border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;letter-spacing:.14em}
.brand .mark span{display:block;font-size:11px;letter-spacing:.42em;color:var(--cyan);margin-top:6px;font-weight:500}
nav{flex:1;overflow:auto;padding:12px 10px}
.navgroup{margin:10px 0 4px;padding:0 10px;font-size:12px;color:var(--faint)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-sm);background:none;color:var(--dim);text-align:left;font-size:14.5px;transition:background .15s,color .15s}
.navbtn svg{width:18px;height:18px;flex:none;opacity:.8}
.navbtn:hover{background:rgba(98,230,242,.06);color:var(--ink)}
.navbtn[aria-current="page"]{background:linear-gradient(90deg,rgba(98,230,242,.14),rgba(98,230,242,0));color:var(--ink);box-shadow:inset 2px 0 0 var(--cyan)}
.navbtn .pip{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--magenta);color:#fff;font-size:11px;line-height:18px;text-align:center}
.pcard{margin:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,23,58,.7)}
.pcard .lv{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display)}
.pcard .lv b{font-size:20px}
.bar{height:6px;border-radius:3px;background:#1a2550;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:3px;transition:width .5s var(--ease)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(6,10,26,.65);backdrop-filter:blur(8px);position:sticky;top:0;z-index:3}
#top h1{font-size:20px;flex:1}
.credits{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border:1px solid rgba(237,196,106,.35);border-radius:999px;background:rgba(237,196,106,.07);font-family:var(--display);font-size:17px;font-weight:600}
.credits .coin{width:20px;height:20px}
.credits.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:scale(1.08);box-shadow:0 0 24px rgba(237,196,106,.35)}}
.freepill{white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel)}
.freepill.ready{border-color:var(--cyan);color:var(--cyan)}
#view{flex:1;overflow:auto;padding:26px;min-height:0}
#view>*{max-width:1240px;margin-inline:auto}

#rail{border-left:1px solid var(--line);background:rgba(6,10,26,.8);display:flex;flex-direction:column;min-height:0}
#rail header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
#feed{flex:1;overflow:auto;padding:8px}
.feeditem{display:flex;gap:10px;align-items:center;padding:8px;border-radius:var(--r-sm);border-left:3px solid var(--rc);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 12%,transparent),transparent 70%);margin-bottom:6px;animation:slidein .35s var(--ease)}
.feeditem img{width:44px;height:44px}
.feeditem .n{font-size:13.5px;line-height:1.25}
.feeditem .s{font-size:12px;color:var(--dim)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}}
.empty{padding:28px 18px;text-align:center;color:var(--dim);font-size:14px}

/* Components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel2);font-weight:500;font-size:14.5px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--cyan);background:#182457}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn.primary{background:linear-gradient(180deg,#2bc6d6,#1a8ea8);border-color:#5ff0ff;color:#04121c;font-weight:600}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#45dbe9,#20a0bb)}
.btn.gold{background:linear-gradient(180deg,#f2cf7c,#c99a3b);border-color:#ffe2a0;color:#211503;font-weight:600}
.btn.danger{border-color:#7a2a4a;color:#ff9ac0}
.btn.danger:hover:not(:disabled){border-color:#ff6aa0;background:#2a1030}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:14px 26px;font-size:16px;font-family:var(--display);letter-spacing:.04em}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(20,30,72,.75),rgba(13,20,52,.75));padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.rtag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--rc)}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px;color:var(--dim)}
.chip[aria-pressed="true"]{border-color:var(--rc,var(--cyan));color:var(--ink);background:color-mix(in srgb,var(--rc,var(--cyan)) 16%,transparent)}
input[type=search],input[type=number],select{background:var(--deep);border:1px solid var(--line2);color:var(--ink);border-radius:var(--r-sm);padding:9px 12px;font:inherit;font-size:14px}
input[type=range]{accent-color:var(--cyan)}
.coinI{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:3px}

/* Item tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(120% 90% at 50% 20%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 60%),var(--panel);padding:12px 12px 11px;text-align:left;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--rc) 60%,var(--line))}
.tile.r4:hover,.tile.r5:hover,.tile.r6:hover,.tile.r7:hover,.tile.r8:hover,.tile.r9:hover,.tile.r10:hover,.tile.r11:hover{box-shadow:0 0 26px color-mix(in srgb,var(--rc) 35%,transparent)}
.tile.r8::after{background:linear-gradient(90deg,#ff7af0,#ffd36a,#7af7ff,#a07aff,#ff7af0);background-size:200%;animation:prism 3s linear infinite}
@keyframes prism{to{background-position:200%}}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.tile .nm{font-size:13.5px;font-weight:500;line-height:1.25;margin-top:6px;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:12.5px}
.tile .val{color:var(--gold)}
.tile .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;justify-content:space-between;pointer-events:none}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(6,10,26,.8);border:1px solid var(--line2)}
.badge.new{border-color:var(--cyan);color:var(--cyan)}
.tile.sel{outline:2px solid var(--cyan);outline-offset:-2px}
.tile.dim{opacity:.4}
.tile .check{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--dim);background:rgba(6,10,26,.8)}
.tile.sel .check{background:var(--cyan);border-color:var(--cyan)}
.tile.sel .check::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #04121c;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tile.ghosted img{filter:brightness(0) drop-shadow(0 0 1px color-mix(in srgb,var(--rc) 70%,transparent));opacity:.7}

/* Crates */
.crates{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.crate{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:radial-gradient(90% 70% at 50% 30%,color-mix(in srgb,var(--t1) 40%,transparent),transparent 70%),var(--panel);text-align:center;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.crate:hover:not(.locked){transform:translateY(-3px);border-color:var(--t2);box-shadow:0 10px 40px -10px color-mix(in srgb,var(--t2) 50%,transparent)}
.crate canvas{width:100%;aspect-ratio:1.15;display:block}
.crate .cn{font-family:var(--display);font-size:17px;font-weight:600;margin-top:6px}
.crate .cp{margin-top:6px;font-family:var(--display);font-size:16px;color:var(--gold)}
.crate .rg{font-size:12.5px;color:var(--dim)}
.crate.locked{opacity:.55}
.crate .lock{position:absolute;top:12px;right:12px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);background:rgba(6,10,26,.85)}

.crate-hero{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:26px;align-items:center}
.crate-hero canvas{width:100%;aspect-ratio:1.15}
.oddsbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:#1a2550}
.oddsbar i{display:block;height:100%}
.oddleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.odds-tiles .tile .pct{font-family:var(--display);font-size:14px;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid rgba(34,48,95,.5)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* Dashboard */
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line);padding:30px;min-height:220px;background:radial-gradient(60% 120% at 85% 40%,rgba(140,109,255,.35),transparent 60%),radial-gradient(40% 80% at 70% 80%,rgba(98,230,242,.18),transparent 60%),var(--deep)}
.hero canvas{position:absolute;right:-50px;top:50%;transform:translateY(-50%);width:260px;height:260px;pointer-events:none;opacity:.9}
.hero .copy{position:relative;max-width:min(380px,calc(100% - 170px))}
@media (max-width:860px){.hero .copy{max-width:100%}.hero canvas{opacity:.25}}
.hero h2{font-size:30px;line-height:1.1;margin-bottom:10px}
.post{padding:16px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:4px}
.post h3{margin-bottom:4px}
.post .d{font-size:12.5px;color:var(--faint);margin-bottom:6px}
.post p{color:var(--dim);font-size:14.5px;max-width:68ch}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px;border-radius:var(--r);background:rgba(6,10,26,.5);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:600}
.stat span{font-size:12.5px;color:var(--dim)}
.objective{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.objective:first-of-type{border-top:0}
.objective .bar{flex:1;margin:0}

/* Stage (opening) */
#stage{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(80% 80% at 50% 50%,#101a3e,#03050e);overflow:hidden}
#stage.on{display:flex}
#stage .skip{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5}
#stage .title{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--display);font-size:15px;color:var(--dim);letter-spacing:.2em}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.reelwin{position:relative;width:min(1000px,94vw);height:190px;overflow:hidden;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:rgba(6,10,26,.6);-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.reelwin.v{width:240px;height:min(560px,70vh);border:0;border-left:1px solid var(--line2);border-right:1px solid var(--line2);-webkit-mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.strip{position:absolute;left:0;top:0;display:flex;will-change:transform}
.reelwin.v .strip{flex-direction:column}
.rt{flex:none;width:150px;height:190px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(34,48,95,.6);background:linear-gradient(0deg,color-mix(in srgb,var(--rc) 28%,transparent),transparent 45%);position:relative}
.reelwin.v .rt{width:240px;height:150px;border-right:0;border-bottom:1px solid rgba(34,48,95,.6)}
.rt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.rt img{width:110px;height:110px}
.reelwin.v .rt img{width:96px;height:96px}
.rt .n{font-size:12px;text-align:center;line-height:1.2;color:var(--dim);margin-top:4px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marker{position:absolute;z-index:2;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.reelwin:not(.v) .marker{left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px)}
.reelwin.v .marker{top:50%;left:0;right:0;height:2px;transform:translateY(-1px)}
.reelwin.heat{border-color:#ff8a3a;box-shadow:0 0 60px -10px rgba(255,120,40,.6)}
.reelwin.heat .marker{background:#ffb36a;box-shadow:0 0 16px #ff8a3a}
.reelwin.prism{border-color:transparent;box-shadow:0 0 80px -10px rgba(255,138,240,.5),0 0 80px -20px rgba(122,247,255,.5)}
.reelwin.prism .marker{background:#fff;box-shadow:0 0 18px #fff}
.doors{position:absolute;inset:0;z-index:3;display:flex;pointer-events:none}
.door{flex:1;background:repeating-linear-gradient(90deg,#1b2650 0 18px,#152043 18px 20px),#1a254d;border:1px solid #3a4f8f;transition:transform .9s cubic-bezier(.6,0,.2,1)}
.door.l{border-right:2px solid var(--cyan)} .door.r{border-left:2px solid var(--cyan)}
.doors.open .door.l{transform:translateX(-102%)} .doors.open .door.r{transform:translateX(102%)}
.dial{position:relative;width:min(520px,86vw);aspect-ratio:1}
.dial .ring{position:absolute;inset:0;border-radius:50%;border:1px solid #6a5426;background:radial-gradient(circle,transparent 55%,rgba(237,196,106,.07) 56%,transparent 72%)}
.dial .glyphs{position:absolute;inset:6%;border-radius:50%;border:1px dashed rgba(237,196,106,.35)}
.dial .spin{position:absolute;inset:0}
.dial .slot{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 35%,transparent),rgba(6,10,26,.9) 70%);border:1.5px solid var(--rc);display:grid;place-items:center}
.dial .slot img{width:62px;height:62px}
.dial .ptr{position:absolute;left:50%;top:-6px;width:0;height:0;border:12px solid transparent;border-top:18px solid var(--gold);transform:translateX(-50%);filter:drop-shadow(0 0 8px var(--gold));z-index:2}
.dial .hub{position:absolute;inset:34%;border-radius:50%;border:1px solid #6a5426;display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.3em;text-align:center;background:radial-gradient(circle,rgba(237,196,106,.12),transparent 70%)}
.scan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(760px,92vw)}
.scan .card{aspect-ratio:.8;border-radius:var(--r);border:1px solid rgba(98,230,242,.35);background:linear-gradient(180deg,rgba(98,230,242,.08),rgba(98,230,242,.02));display:grid;place-items:center;transition:all .12s;position:relative;overflow:hidden}
.scan .card img{width:70%;filter:saturate(.3) brightness(.7)}
.scan .card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(98,230,242,.06) 0 2px,transparent 2px 5px)}
.scan .card.hot{border-color:var(--cyan);box-shadow:0 0 30px rgba(98,230,242,.5);transform:scale(1.05)}
.scan .card.hot img{filter:none}
.scan .card.out{opacity:.12;transform:scale(.94)}
.scan .card.win{border-color:#fff;box-shadow:0 0 50px rgba(255,255,255,.5);transform:scale(1.1)}

/* Reveal */
.reveal{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px;max-width:560px}
.reveal .glowbg{position:absolute;left:50%;top:150px;width:520px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 45%,transparent),transparent 62%);z-index:-1;pointer-events:none}
.reveal .rays{position:absolute;left:50%;top:150px;width:760px;height:760px;transform:translate(-50%,-50%);background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 32%,transparent) 0 6deg,transparent 6deg 22deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 18s linear infinite;z-index:-1;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.reveal canvas{width:300px;height:300px}
.reveal .rn{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;margin-top:4px}
.reveal .rt2{font-family:var(--display);letter-spacing:.3em;font-size:14px;color:var(--rc);margin-top:8px}
.reveal .rdesc{color:var(--dim);margin-top:10px;max-width:46ch}
.reveal .rv{margin-top:10px;font-family:var(--display);font-size:18px;color:var(--gold)}
.reveal .firstreg{margin-top:8px;font-size:13.5px;color:var(--cyan)}
.reveal .acts{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reveal.enter{animation:pop .7s var(--ease)}
.reveal.enter.big{animation:pop 1.1s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.flash{position:absolute;inset:0;z-index:6;pointer-events:none;background:var(--fc,#fff);animation:flash 1s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.shock{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--rc);z-index:3;pointer-events:none;animation:shock 1.3s cubic-bezier(.1,.6,.3,1) forwards}
@keyframes shock{to{transform:scale(40);opacity:0;border-width:1px}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(6px,-4px)}40%{transform:translate(-5px,3px)}60%{transform:translate(3px,4px)}80%{transform:translate(-2px,-2px)}}
#stage.prismbg{background:conic-gradient(from var(--a,0deg) at 50% 45%,#2a0a3a,#0a2a3a,#3a2a0a,#0a0a3a,#2a0a3a);animation:hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.batch{display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:12px;justify-content:center;width:min(860px,94vw)}
.batch .tile{animation:pop .45s var(--ease) both}
.batch .tile.spin img{animation:flick .1s steps(1) infinite}

/* Modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,5,14,.75);backdrop-filter:blur(6px);padding:20px}
#modal.on{display:flex}
.dlg{width:min(860px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line2);border-radius:var(--r-lg);background:linear-gradient(180deg,#121b44,#0b1230);padding:24px;position:relative;animation:pop .25s var(--ease)}
.dlg.sm{width:min(460px,100%)}
.dlg .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel)}
.inspect{display:grid;grid-template-columns:340px 1fr;gap:24px}
.inspect canvas{width:100%;aspect-ratio:1;border-radius:var(--r);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 22%,transparent),transparent 65%);cursor:grab;touch-action:none}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:14px 0}
dl.kv dt{color:var(--dim)} dl.kv dd{margin:0}
.lore{border-left:2px solid var(--rc);padding:2px 0 2px 12px;color:var(--dim);font-style:italic;margin-top:12px}

/* Museum */
.museum{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.ped{border-radius:var(--r-lg);padding:14px 14px 0;background:linear-gradient(180deg,rgba(98,230,242,.04),transparent 60%);border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.ped canvas{width:100%;aspect-ratio:1}
.ped .base{height:26px;margin:0 -14px;background:linear-gradient(180deg,#26346a,#121a3e);border-top:1px solid #4a5ea0}
.ped .plaque{font-size:13px;padding:6px 0 10px;min-height:44px}
.ped.emptyp{display:grid;place-items:center;min-height:250px;border-style:dashed}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r);background:#16214d;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;animation:slideup .3s var(--ease)}
.toast.good{border-color:var(--cyan)} .toast.bad{border-color:#ff6aa0}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}}

.mobnav{display:none}
@media (max-width:1240px){#app{grid-template-columns:220px 1fr}#rail{display:none}}
@media (max-width:860px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 #side{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
 .brand,.pcard,.navgroup{display:none}
 nav{display:flex;gap:4px;padding:8px;overflow-x:auto}
 .navbtn{white-space:nowrap;width:auto}
 #view{padding:16px}
 #top{padding:12px 16px}
 .dash,.crate-hero,.inspect{grid-template-columns:1fr}
 .batch{grid-template-columns:repeat(3,1fr)}
 .scan{grid-template-columns:repeat(3,1fr)}
 .statline{grid-template-columns:1fr 1fr}
}
.reduced *,.reduced *::before,.reduced *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media (max-width:560px){#top{gap:8px;flex-wrap:wrap}#top h1{font-size:17px;flex-basis:100%}.freepill{font-size:12px;padding:6px 10px}.credits{font-size:15px;margin-left:auto}}
.perkpanel{margin-bottom:20px}
.perkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.perk{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(6,10,26,.45);opacity:.7}
.perk.on{opacity:1;border-color:color-mix(in srgb,var(--cyan) 45%,var(--line));background:linear-gradient(180deg,rgba(98,230,242,.08),rgba(6,10,26,.45))}
.perk b{font-family:var(--display);font-weight:600}
.perk .tab{font-family:var(--display);color:var(--cyan)}
.perk p{font-size:13px;margin-top:6px}
.perkchip{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;border:1px solid rgba(98,230,242,.4);color:var(--cyan);font-size:12px;line-height:1.5}
.perkchip.on{background:rgba(98,230,242,.12)}
.tile .perkchip{margin-top:8px}
.perknote{margin-top:10px;font-size:13px;color:var(--dim);border-left:2px solid var(--cyan);padding-left:10px}
.perknote b{color:var(--cyan);font-weight:600}
.perkhint{color:var(--cyan);font-size:12.5px}
.perkdd{color:var(--cyan)}
.plaque .perkchip{display:table;margin:6px auto 0}
.refnum{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.refnum .tab{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1.1}
.refcard{margin-bottom:18px;border-color:rgba(237,196,106,.35);background:radial-gradient(70% 120% at 100% 0%,rgba(237,196,106,.12),transparent 60%),linear-gradient(180deg,rgba(20,30,72,.75),rgba(13,20,52,.75))}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.upcard{display:flex;flex-direction:column}
.upcard>.btn,.upcard>span:last-child{align-self:flex-start}
.upcard.maxed{border-color:rgba(98,230,242,.35)}
.lvpips{display:flex;gap:3px}
.lvpips i{width:10px;height:10px;border-radius:2px;background:#1a2550;border:1px solid var(--line2)}
.lvpips i.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px rgba(98,230,242,.5)}
.lvtext{font-size:12.5px;color:var(--dim)}

.tile.r9::after{background:linear-gradient(90deg,#ff3d1a,#ffb04a,#ff3d1a);background-size:200%;animation:prism 2s linear infinite}
.tile.r9{box-shadow:0 0 18px rgba(255,106,61,.25)}
.tile.r10::after{background:linear-gradient(90deg,#6a4aff,#e8e0ff,#6a4aff);background-size:200%;animation:prism 4s linear infinite}
.tile.r10{box-shadow:0 0 22px rgba(185,167,255,.3)}
.tile.r11{background:radial-gradient(120% 90% at 50% 20%,#1a1a24,#000 70%);border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 30px rgba(255,255,255,.35)}
.tile.r11::after{height:4px;background:linear-gradient(90deg,#fff,#000,#fff);background-size:200%;animation:prism 1.5s linear infinite}
#stage.voidbg{background:radial-gradient(60% 60% at 50% 40%,#151020,#000 75%)}
@media (prefers-reduced-motion:reduce){.tile.r9::after,.tile.r10::after,.tile.r11::after{animation:none}}
.tile .meta{flex-wrap:wrap;row-gap:2px}.tile .meta .pct,.tile .meta .val{white-space:nowrap}
.badge.grade{color:#ffe08a;border-color:rgba(255,224,138,.5);letter-spacing:-1px}
.badge.grade.g3{color:#fff;background:linear-gradient(90deg,rgba(255,122,240,.35),rgba(122,247,255,.35))}
.gradestars{color:#ffe08a;font-size:.8em;letter-spacing:-1px}
.gradestars.g3{background:linear-gradient(90deg,#ff7af0,#ffd36a,#7af7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mergegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.mergecard{display:flex;gap:14px;align-items:flex-start;border-left:3px solid var(--rc)}
.mergecard img{flex:none;border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 25%,transparent),transparent 70%)}
.mergecard .mc{flex:1;min-width:0}
.mergeflow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}
.mergeflow .arrow{color:var(--cyan)}
@media (max-width:560px){.mergegrid{grid-template-columns:1fr}}

.reqline{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.35}
.crate.locked .reqline{color:#ffb0c8}

/* ===================== Refinement layer ===================== */
:root{
 --void:#05081A; --deep:#0A1030; --panel:#0C1436; --panel2:#111A42;
 --line:rgba(150,170,255,.10); --line2:rgba(150,170,255,.18);
 --ink:#E6EAF7; --dim:#97A1C2; --faint:#626D92;
 --cyan:#6FE3F0; --violet:#8E76FF; --gold:#E9C677;
 --r-sm:8px; --r:12px; --r-lg:16px;
 --surface:linear-gradient(180deg,rgba(18,26,64,.72),rgba(10,16,42,.72));
 --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -26px rgba(0,0,0,.9);
 --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{font:14.5px/1.55 var(--body);font-feature-settings:'cv11','ss01','tnum';-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.45))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.018em}
h1{font-size:26px} h2{font-size:17px} h3{font-size:14.5px}
::selection{background:rgba(111,227,240,.3)}
*{scrollbar-width:thin;scrollbar-color:rgba(150,170,255,.18) transparent}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:rgba(150,170,255,.16);border-radius:10px;border:3px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}

/* Shell */
#side{background:rgba(6,9,26,.82);backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 20px;border-bottom:1px solid var(--line)}
.brand .emblem{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 10px rgba(111,227,240,.25))}
.brand .mark{font-family:var(--display);font-weight:650;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.brand .mark span{display:block;margin-top:4px;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.navgroup{margin:18px 0 6px;padding:0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.navgroup:first-child{margin-top:4px}
.navbtn{padding:8px 12px;font-size:13.5px;font-weight:500;border-radius:8px;color:var(--dim);position:relative}
.navbtn svg{width:17px;height:17px;opacity:.7}
.navbtn:hover{background:rgba(255,255,255,.035);color:var(--ink)}
.navbtn[aria-current="page"]{background:rgba(111,227,240,.08);color:var(--ink);box-shadow:none}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.navbtn[aria-current="page"] svg{opacity:1;color:var(--cyan)}
.navbtn .pip{background:rgba(224,75,180,.18);color:#ff9ad6;border:1px solid rgba(224,75,180,.4);font-weight:600;font-size:10.5px;line-height:16px;height:18px}
.pcard{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
.pcard .lv{font-family:var(--display)} .pcard .lv span{font-size:12px;color:var(--dim)} .pcard .lv b{font-size:18px;font-weight:650}
.bar{height:4px;border-radius:4px;background:rgba(150,170,255,.10)}
.bar>i{border-radius:4px;background:linear-gradient(90deg,#7f6bff,#6fe3f0);box-shadow:0 0 12px rgba(111,227,240,.35)}
#top{padding:16px 28px;background:rgba(5,8,26,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top h1{font-size:18px;font-weight:600;letter-spacing:-.015em}
.credits{border:1px solid rgba(233,198,119,.28);background:linear-gradient(180deg,rgba(233,198,119,.10),rgba(233,198,119,.03));border-radius:10px;padding:7px 14px;font-weight:600;font-size:15px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.freepill{border-radius:10px;font-size:12.5px;font-weight:500;padding:7px 12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--dim)}
.freepill.ready{border-color:rgba(111,227,240,.45);color:var(--cyan);background:rgba(111,227,240,.07);box-shadow:0 0 18px -6px rgba(111,227,240,.6)}
#view{padding:26px 28px 40px}
#rail{background:rgba(6,9,26,.78);backdrop-filter:blur(14px);border-left:1px solid var(--line)}
#rail header{padding:22px 18px 14px;border-bottom:1px solid var(--line)}
#rail header h3{font-size:13px;font-weight:600}
#feed{padding:10px}
.feeditem{border-left:0;background:none;border-radius:10px;padding:7px 8px;margin-bottom:2px;transition:background .15s}
.feeditem:hover{background:rgba(255,255,255,.035)}
.feeditem img{width:40px;height:40px;border-radius:9px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px var(--line)}
.feeditem .n{font-size:13px;font-weight:500}
.feeditem .s{font-size:11.5px}
.feeditem .s::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rc);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--rc)}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 22px}
.muted{color:var(--dim)}
.btn{border-radius:9px;font-weight:550;font-size:13.5px;letter-spacing:-.005em;padding:9px 16px;border:1px solid var(--line2);background:rgba(255,255,255,.035);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:rgba(150,170,255,.3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#86ecf6,#45c6dc);color:#04131c;border-color:rgba(160,245,255,.6);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 8px 22px -10px rgba(111,227,240,.7)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#9ff2fa,#55d2e6)}
.btn.gold{background:linear-gradient(180deg,#f3d79a,#d3a94e);color:#241806;border-color:rgba(255,230,170,.6);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 22px -12px rgba(233,198,119,.8)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.lg{padding:12px 20px;font-size:14.5px;border-radius:10px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45}
.chip{border-radius:999px;font-size:12px;font-weight:500;padding:5px 11px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--dim)}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip[aria-pressed="true"]{background:rgba(111,227,240,.1);border-color:rgba(111,227,240,.45);color:var(--ink)}
input[type=search],input[type=number],select{background:rgba(5,8,26,.6);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
input[type=search]:focus,input[type=number]:focus,select:focus{border-color:rgba(111,227,240,.55);outline:none;box-shadow:0 0 0 3px rgba(111,227,240,.12)}
.rtag{font-size:11.5px;font-weight:600;letter-spacing:.01em}
.badge{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 6px;background:rgba(5,8,26,.75);border:1px solid var(--line2);backdrop-filter:blur(6px)}
.badge.new{color:var(--cyan);border-color:rgba(111,227,240,.5)}

/* Item tiles */
.tiles{gap:12px}
.tile{border-radius:14px;padding:10px 10px 11px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8));box-shadow:var(--shadow);transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.tile img{border-radius:10px;background:radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--rc) 20%,transparent),transparent 70%),rgba(255,255,255,.015);box-shadow:inset 0 0 0 1px rgba(150,170,255,.06)}
.tile::after{left:14px;right:14px;height:2px;border-radius:2px 2px 0 0;opacity:.9}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--rc) 45%,var(--line))}
.tile .nm{font-size:13px;font-weight:550;letter-spacing:-.01em;margin-top:9px}
.tile .meta{font-size:12px;margin-top:6px;padding-top:7px;border-top:1px solid var(--line)}
.tile .val{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:550}
.tile .badges{top:16px;left:16px;right:16px}

/* Crates */
.crate{border-radius:16px;border:1px solid var(--line);background:radial-gradient(80% 60% at 50% 35%,color-mix(in srgb,var(--t1) 28%,transparent),transparent 70%),linear-gradient(180deg,rgba(18,26,64,.72),rgba(9,14,38,.82));box-shadow:var(--shadow)}
.crate:hover:not(.locked){border-color:color-mix(in srgb,var(--t2) 40%,var(--line));transform:translateY(-3px)}
.crate .cn{font-weight:600;font-size:15px;letter-spacing:-.015em}
.crate .rg{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.crate .cp{font-weight:600;color:var(--gold)}
.crate .lock{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;background:rgba(5,8,26,.8);border:1px solid var(--line2)}
.crate-hero{border-radius:20px}
.oddsbar{height:8px;border-radius:8px;gap:2px;background:transparent}
.oddsbar i{border-radius:2px}
.oddleg{font-size:12.5px}

/* Dashboard */
.hero{border-radius:20px;border:1px solid var(--line);padding:34px 34px 32px;min-height:236px;background:radial-gradient(60% 120% at 92% 50%,rgba(142,118,255,.22),transparent 62%),radial-gradient(40% 70% at 75% 95%,rgba(111,227,240,.10),transparent 60%),linear-gradient(180deg,rgba(18,26,64,.78),rgba(9,14,38,.86));box-shadow:var(--shadow)}
.hero canvas{right:26px;width:220px;height:220px;opacity:1}
.hero .copy{max-width:calc(100% - 250px)}
.hero h2{font-size:28px;letter-spacing:-.025em;font-weight:650}
@media (max-width:760px){.hero canvas{opacity:.22;right:-30px}.hero .copy{max-width:100%}}
.statline{gap:10px}
.stat{border-radius:12px;background:rgba(5,8,26,.45);border:1px solid var(--line);padding:14px 16px}
.stat b{font-size:22px;font-weight:650;letter-spacing:-.02em}
.stat span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:2px;white-space:nowrap}
.post{padding:16px 0}
.post .d{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);opacity:.8}
.post h3{font-size:14.5px;margin:4px 0 4px}
.post p{font-size:13.5px;color:var(--dim)}
.objective{padding:12px 0;border-color:var(--line)}
.refnum .tab{font-size:24px;font-weight:650;letter-spacing:-.02em}
.refnum{align-items:flex-end;text-align:right}

/* Tables, lists, dialogs */
table.t th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500}
table.t td{border-color:var(--line)}
dl.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-top:2px}
.dlg{border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,#111a44,#0a1030);box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06) inset}
#modal.on{background:rgba(2,4,14,.72);backdrop-filter:blur(6px)}
.inspect canvas{border-radius:16px;background:radial-gradient(60% 60% at 50% 45%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),rgba(255,255,255,.02);box-shadow:inset 0 0 0 1px var(--line)}
.lore{border-left:2px solid color-mix(in srgb,var(--rc) 60%,transparent);font-size:13.5px;color:var(--dim)}
.toast{border-radius:12px;border:1px solid var(--line2);background:rgba(12,18,48,.92);backdrop-filter:blur(10px);font-size:13px;font-weight:500;box-shadow:0 20px 40px -20px rgba(0,0,0,.9)}
.toast.good{border-color:rgba(111,227,240,.45)}
.perk,.upcard,.mergecard,.ped{border-radius:14px}

/* ===== Opening cinematics ===== */
#stage{perspective:1000px}
#stage .fx.warp{position:absolute;inset:0;width:100%;height:100%}
#stage.punch{animation:punch .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes punch{30%{transform:scale(1.035)}}
.intro{position:relative;z-index:2;will-change:transform,filter}
.reelwin{box-shadow:0 0 0 1px rgba(150,170,255,.15),0 30px 80px -20px rgba(0,0,0,.9),0 0 calc(var(--speed,0)*60px) rgba(111,227,240,.35)}
.reelwin .strip{filter:blur(calc(var(--speed,0)*3px))}
.reelwin .marker{box-shadow:0 0 calc(10px + var(--speed,0)*30px) var(--cyan)}
.rt.win{position:relative;z-index:2;animation:winpulse .9s cubic-bezier(.2,1.5,.4,1) forwards}
.rt.win::before{content:"";position:absolute;inset:-6px;border-radius:14px;border:2px solid var(--rc);box-shadow:0 0 30px var(--rc),inset 0 0 20px var(--rc);animation:ring 1s ease-out}
@keyframes winpulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.1)}}
@keyframes ring{from{opacity:0;transform:scale(1.4)}}
.reelwin.landed .rt:not(.win){opacity:.35;filter:grayscale(.6);transition:opacity .4s,filter .4s}
.blackout{position:absolute;inset:0;z-index:3;background:#000;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
#stage.bars::before,#stage.bars::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:7;pointer-events:none;animation:barsin .6s cubic-bezier(.2,.8,.2,1) both}
#stage.bars::before{top:0;transform-origin:top} #stage.bars::after{bottom:0;transform-origin:bottom}
@keyframes barsin{from{transform:scaleY(0)}}
.reveal canvas{animation:itemin 1s cubic-bezier(.2,1.5,.35,1) both}
@keyframes itemin{0%{opacity:0;transform:scale(.2) rotate(-25deg);filter:brightness(4) blur(6px)}60%{filter:brightness(1.6) blur(0)}100%{opacity:1;transform:none;filter:none}}
.reveal .rt2{animation:tracking .9s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes tracking{from{opacity:0;letter-spacing:1.2em;filter:blur(4px)}}
.reveal .rn{animation:riseup .7s .4s cubic-bezier(.2,.8,.2,1) both;text-shadow:0 0 30px color-mix(in srgb,var(--rc) 60%,transparent)}
.reveal .rdesc,.reveal .rv,.reveal .firstreg{animation:riseup .6s .6s both}
.reveal .acts{animation:riseup .6s .85s both}
@keyframes riseup{from{opacity:0;transform:translateY(14px)}}
#stage.rv4 .reveal .rn,#stage.rv5 .reveal .rn{font-size:36px}
#stage.rv6 .reveal .rn,#stage.rv7 .reveal .rn,#stage.rv8 .reveal .rn{font-size:40px;background:linear-gradient(90deg,#fff,var(--rc),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:riseup .7s .4s both,prism 3s linear infinite}
#stage.rv9 .reveal .rn,#stage.rv10 .reveal .rn,#stage.rv11 .reveal .rn{font-size:46px;background:linear-gradient(90deg,#ff7af0,#ffd36a,#7af7ff,#a07aff,#ff7af0);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:riseup .8s .5s both,prism 2s linear infinite}
#stage.rv6 .reveal canvas,#stage.rv7 .reveal canvas,#stage.rv8 .reveal canvas,#stage.rv9 .reveal canvas,#stage.rv10 .reveal canvas,#stage.rv11 .reveal canvas{animation:itemin 1.4s cubic-bezier(.2,1.5,.35,1) both,hover 4s 1.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-10px)}}
.batch .tile.lockin{animation:lockin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes lockin{0%{transform:scale(.85) rotateY(90deg)}100%{transform:none}}
.batch .tile.rarehit{box-shadow:0 0 0 2px var(--rc),0 0 40px var(--rc);z-index:2}
.reduced #stage *{animation:none!important}
@media (prefers-reduced-motion:reduce){#stage *{animation-duration:.01ms!important}}
body:has(#stage.on) #toasts{top:calc(70px + env(safe-area-inset-top,0px));bottom:auto}
#stage.bars::before,#stage.bars::after{height:4.5vh}
#stage.rv6 .reveal,#stage.rv7 .reveal,#stage.rv8 .reveal,#stage.rv9 .reveal,#stage.rv10 .reveal,#stage.rv11 .reveal{padding-top:5vh}
#stage .reveal .rdesc,#stage .reveal .rv,#stage .reveal .firstreg,#stage .reveal .rt2{text-shadow:0 1px 2px #000,0 0 16px rgba(0,0,0,.9)}
#stage .reveal .rn{filter:drop-shadow(0 2px 10px rgba(0,0,0,.8))}

/* ===== Ascension ===== */

 background:radial-gradient(70% 140% at 85% -10%,rgba(255,226,160,.30),transparent 60%),radial-gradient(60% 100% at 10% 120%,rgba(160,130,255,.25),transparent 60%),linear-gradient(180deg,#1a1640,#0b0f2e);box-shadow:0 30px 80px -40px rgba(255,210,120,.45),var(--shadow)}

.ascgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.ascgrid{grid-template-columns:1fr}}
.dustcalc{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}

@keyframes ascin{0%,40%{opacity:0;transform:translateY(30px) scale(.9);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}

.ascstats b .dust{font-size:22px;color:#ffe7a8}.ascstats b .dust svg{width:18px;height:18px}

.setbonus{font-size:12.5px;color:var(--cyan)}

/* ===== Fusion ===== */
.chamber{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(190,160,255,.3);padding:30px 28px 26px;background:radial-gradient(60% 90% at 50% 70%,rgba(160,110,255,.22),transparent 70%),linear-gradient(180deg,#141038,#0a0d2a);box-shadow:var(--shadow);text-align:center}
.chglow{position:absolute;left:50%;top:62%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(rgba(200,170,255,.10) 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);animation:spin 40s linear infinite;pointer-events:none}
.chcopy{position:relative;max-width:620px;margin:0 auto}
.chcopy .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#cbb8ff}
.chcopy h1{font-size:32px;margin:6px 0}
.chcopy p{color:#c4bfe6;font-size:14px}
.fslots{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.fplus{font-size:22px;color:#cbb8ff;opacity:.6}
.fslot{width:150px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;border-radius:16px;border:1px solid color-mix(in srgb,var(--rc,#cbb8ff) 45%,var(--line));background:radial-gradient(80% 60% at 50% 35%,color-mix(in srgb,var(--rc,#cbb8ff) 20%,transparent),transparent 70%),rgba(5,6,24,.5);font-size:12.5px}
.fslot img{width:92px;height:92px}
.fslot b{font-weight:550;line-height:1.25}
.fslot.empty{border-style:dashed;cursor:pointer;color:#cbb8ff}
.fslot.empty span{font-size:30px;font-weight:300;line-height:1}
.fslot.empty small{color:var(--dim)}
.btn.fusebtn{min-width:200px;justify-content:center;background:linear-gradient(180deg,#e2d4ff,#9a7aff);color:#120a30;border-color:rgba(230,220,255,.8);font-weight:650;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 14px 40px -12px rgba(160,120,255,.9)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
@media (max-width:560px){.recipes{grid-template-columns:1fr}}
.recipe{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.recipe>img{width:70px;height:70px;flex:none;border-radius:12px;background:rgba(255,255,255,.02);box-shadow:inset 0 0 0 1px var(--line)}
.recipe.known{border-color:color-mix(in srgb,var(--rc) 40%,var(--line))}
.recipe b{font-weight:600;font-size:14px}
.recipe .hint{font-size:13px;color:#c4bfe6;font-style:italic;margin:6px 0 8px}
.recipe .ins{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.recipe .in{padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.recipe .in.have{border-color:rgba(111,227,240,.5);color:var(--ink)}
.recipe .in b{color:var(--cyan);font-size:11.5px}
.recipe .plus{color:var(--faint)}

/* ===== Themes ===== */
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.themecard{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(5,8,26,.4)}
.themecard .sw{display:block;height:54px;border-radius:9px;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.themecard b{font-size:13.5px} .themecard small{font-size:12px;color:var(--dim)}
.themecard.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.themecard.locked{opacity:.55}
.themecard .setok{position:absolute;top:16px;right:16px}

/* palettes */
:root[data-skin="aurora"]{--void:#020d0b;--deep:#05161a;--cyan:#5af0b0;--violet:#3ad0ff;--line:rgba(120,255,200,.10);--line2:rgba(120,255,200,.18);--surface:linear-gradient(180deg,rgba(10,40,40,.72),rgba(4,18,22,.75))}
:root[data-skin="solar"]{--void:#120604;--deep:#1e0a08;--cyan:#ffb05a;--violet:#ff6a7a;--gold:#ffd27a;--line:rgba(255,170,120,.11);--line2:rgba(255,170,120,.2);--surface:linear-gradient(180deg,rgba(50,20,16,.72),rgba(22,8,8,.78))}
:root[data-skin="rose"]{--void:#10051a;--deep:#1a0826;--cyan:#ff8ad8;--violet:#b07aff;--line:rgba(255,140,220,.11);--line2:rgba(255,140,220,.2);--surface:linear-gradient(180deg,rgba(44,14,56,.72),rgba(20,6,30,.78))}
:root[data-skin="void"]{--void:#000;--deep:#050506;--cyan:#e8ecf5;--violet:#8a90a0;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--surface:linear-gradient(180deg,rgba(20,20,24,.75),rgba(6,6,8,.82))}
:root[data-skin="celestial"]{--void:#0e0b18;--deep:#16112a;--cyan:#ffe2a0;--violet:#d8c8ff;--line:rgba(255,226,160,.12);--line2:rgba(255,226,160,.22);--surface:linear-gradient(180deg,rgba(40,32,64,.72),rgba(18,14,32,.8))}
:root[data-skin="prismatic"]{--void:#080416;--deep:#100828;--cyan:#7af7ff;--violet:#ff7ad8;--line:rgba(200,160,255,.12);--line2:rgba(200,160,255,.2)}
:root[data-skin] body{background:var(--void)}
:root[data-skin]:not([data-skin="midnight"]) .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 75%,#fff),var(--cyan));border-color:color-mix(in srgb,var(--cyan) 70%,#fff);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 8px 22px -10px var(--cyan);color:#0a0a12}
:root[data-skin]:not([data-skin="midnight"]) .bar>i{background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px color-mix(in srgb,var(--cyan) 50%,transparent)}
:root[data-skin]:not([data-skin="midnight"]) .navbtn[aria-current="page"]{background:color-mix(in srgb,var(--cyan) 10%,transparent)}
:root[data-skin]:not([data-skin="midnight"]) .navbtn[aria-current="page"]::before{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
:root[data-skin]:not([data-skin="midnight"]) .freepill.ready{border-color:color-mix(in srgb,var(--cyan) 50%,transparent);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
:root[data-skin="prismatic"] .brand .mark{background:linear-gradient(90deg,#ff7a7a,#ffd27a,#7aff9a,#7ad8ff,#c07aff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:prism 4s linear infinite}
:root[data-skin="prismatic"] #side{border-image:linear-gradient(180deg,#ff7ad8,#7af7ff) 1}

/* ===== Variant markers ===== */
.tile.var{border-width:2px}
.tile.var.v-shiny{border-color:#ffe68a;box-shadow:0 0 22px -4px rgba(255,220,120,.75),var(--shadow);background:radial-gradient(120% 90% at 50% 20%,rgba(255,220,120,.22),transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.tile.var.v-anomalous{border-color:#ff5ad8;box-shadow:0 0 22px -4px rgba(255,90,216,.75),var(--shadow);background:radial-gradient(120% 90% at 50% 20%,rgba(255,90,216,.22),transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.tile.var.v-prismatic{border-color:transparent;background:linear-gradient(rgba(12,16,44,.95),rgba(9,14,38,.95)) padding-box,linear-gradient(90deg,#ff7a7a,#ffd27a,#7aff9a,#7ad8ff,#c07aff,#ff7ad8) border-box;box-shadow:0 0 28px -4px rgba(255,255,255,.6),var(--shadow)}
.vribbon{position:absolute;top:12px;right:-30px;z-index:3;width:120px;transform:rotate(38deg);text-align:center;font:700 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 0;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.vribbon.v-shiny{color:#2a1a00;background:linear-gradient(90deg,#ffe68a,#fff6cf,#ffe68a)}
.vribbon.v-anomalous{color:#fff;background:linear-gradient(90deg,#ff3ad0,#3a2aff)}
.vribbon.v-prismatic{color:#111;background:linear-gradient(90deg,#ff7a7a,#ffd27a,#7aff9a,#7ad8ff,#c07aff,#ff7ad8);background-size:200%;animation:prism 2s linear infinite}
.tile.var .badges{right:56px}
.chip.varchip[aria-pressed="true"]{border-color:#ffe68a;background:rgba(255,230,138,.12)}
.vartrack{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:0 0 14px;padding:10px 14px;border:1px solid rgba(255,230,138,.22);border-radius:12px;background:rgba(255,230,138,.04);font-size:12.5px}
.vt-k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#ffe68a}
.vt-note{flex-basis:100%}
@media (prefers-reduced-motion:reduce){.vribbon.v-prismatic{animation:none}}

/* ===== Extended variant ladder ===== */
.vtext.v-glinting{color:#c8dcff;text-shadow:0 0 8px #c8dcff99}
.vribbon.v-glinting,.badge.vbadge.v-glinting{color:#1a2440;background:linear-gradient(90deg,#c8dcff,#ffffff,#c8dcff);background-size:200%}
.vbanner.v-glinting{color:#1a2440;background:linear-gradient(90deg,#c8dcff,#ffffff,#c8dcff);background-size:200%;box-shadow:0 0 30px #c8dcff99}
.tile.var.v-glinting{border-color:#c8dcff;box-shadow:0 0 22px -4px #c8dcffbb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#c8dcff38,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-frosted{color:#9ae8ff;text-shadow:0 0 8px #9ae8ff99}
.vribbon.v-frosted,.badge.vbadge.v-frosted{color:#062030;background:linear-gradient(90deg,#9ae8ff,#e8faff,#9ae8ff);background-size:200%}
.vbanner.v-frosted{color:#062030;background:linear-gradient(90deg,#9ae8ff,#e8faff,#9ae8ff);background-size:200%;box-shadow:0 0 30px #9ae8ff99}
.tile.var.v-frosted{border-color:#9ae8ff;box-shadow:0 0 22px -4px #9ae8ffbb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#9ae8ff38,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-molten{color:#ff7a2a;text-shadow:0 0 8px #ff7a2a99}
.vribbon.v-molten,.badge.vbadge.v-molten{color:#fff;background:linear-gradient(90deg,#ff3a10,#ffa040,#ff3a10);background-size:200%}
.vbanner.v-molten{color:#fff;background:linear-gradient(90deg,#ff3a10,#ffa040,#ff3a10);background-size:200%;box-shadow:0 0 30px #ff7a2a99}
.tile.var.v-molten{border-color:#ff7a2a;box-shadow:0 0 22px -4px #ff7a2abb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#ff7a2a38,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-spectral{color:#a8fff0;text-shadow:0 0 8px #a8fff099}
.vribbon.v-spectral,.badge.vbadge.v-spectral{color:#06201c;background:linear-gradient(90deg,#a8fff0,#ffffff,#a8fff0);background-size:200%}
.vbanner.v-spectral{color:#06201c;background:linear-gradient(90deg,#a8fff0,#ffffff,#a8fff0);background-size:200%;box-shadow:0 0 30px #a8fff099}
.tile.var.v-spectral{border-color:#a8fff0;box-shadow:0 0 22px -4px #a8fff0bb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#a8fff038,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-voidtouched{color:#b07aff;text-shadow:0 0 8px #b07aff99}
.vribbon.v-voidtouched,.badge.vbadge.v-voidtouched{color:#fff;background:linear-gradient(90deg,#1a0030,#7a2aff,#1a0030);background-size:200%}
.vbanner.v-voidtouched{color:#fff;background:linear-gradient(90deg,#1a0030,#7a2aff,#1a0030);background-size:200%;box-shadow:0 0 30px #b07aff99}
.tile.var.v-voidtouched{border-color:#b07aff;box-shadow:0 0 22px -4px #b07affbb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#b07aff38,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-starborn{color:#ffe08a;text-shadow:0 0 8px #ffe08a99}
.vribbon.v-starborn,.badge.vbadge.v-starborn{color:#2a1a00;background:linear-gradient(90deg,#fff0b0,#ffc84a,#fff0b0);background-size:200%}
.vbanner.v-starborn{color:#2a1a00;background:linear-gradient(90deg,#fff0b0,#ffc84a,#fff0b0);background-size:200%;box-shadow:0 0 30px #ffe08a99}
.tile.var.v-starborn{border-color:#ffe08a;box-shadow:0 0 22px -4px #ffe08abb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#ffe08a38,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-divine{color:#fffbe8;text-shadow:0 0 8px #fffbe899}
.vribbon.v-divine,.badge.vbadge.v-divine{color:#3a2a00;background:linear-gradient(90deg,#fff6d0,#ffd0f0,#d0f0ff,#fff6d0);background-size:200%}
.vbanner.v-divine{color:#3a2a00;background:linear-gradient(90deg,#fff6d0,#ffd0f0,#d0f0ff,#fff6d0);background-size:200%;box-shadow:0 0 30px #fffbe899}
.tile.var.v-divine{border-color:#fffbe8;box-shadow:0 0 22px -4px #fffbe8bb,var(--shadow);background:radial-gradient(120% 90% at 50% 20%,#fffbe838,transparent 60%),linear-gradient(180deg,rgba(18,26,64,.7),rgba(9,14,38,.8))}
.vtext.v-divine{background:linear-gradient(90deg,#fff6d0,#ffd0f0,#d0f0ff,#fff6d0);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:prism 3s linear infinite}
.vribbon.v-divine,.vbanner.v-divine,.vribbon.v-voidtouched,.vbanner.v-voidtouched,.vribbon.v-starborn,.vbanner.v-starborn{animation:prism 2.5s linear infinite}
.vbanner.v-divine,.vbanner.v-starborn,.vbanner.v-voidtouched{font-size:13px;padding:8px 18px}
.vartrack .vt-i{white-space:nowrap}
.vt-list{display:flex;flex-wrap:wrap;gap:4px 14px;flex-basis:100%}
.vt-i b{font-weight:650}

/* ===== Stacked duplicates ===== */
.tiles{padding:0 6px 6px 0}
.tile.stack{box-shadow:5px 5px 0 -1px rgba(14,20,52,.95),5px 5px 0 0 color-mix(in srgb,var(--rc) 35%,var(--line)),var(--shadow)}
.tile.stack3{box-shadow:5px 5px 0 -1px rgba(14,20,52,.95),5px 5px 0 0 color-mix(in srgb,var(--rc) 35%,var(--line)),10px 10px 0 -2px rgba(10,15,42,.95),10px 10px 0 -1px color-mix(in srgb,var(--rc) 22%,var(--line)),var(--shadow)}
.tile .stackcount{position:absolute;right:16px;top:42%;z-index:2;font:700 13px/1 var(--font,inherit);padding:5px 8px;border-radius:999px;background:rgba(6,10,26,.88);border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);font-variant-numeric:tabular-nums;pointer-events:none}
.tile .val small{font-size:11px;color:var(--dim);font-weight:500}
.tile .stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(6,10,26,.6);font-size:12.5px}
.tile .stepper b{font-variant-numeric:tabular-nums}
.tile .stp{display:grid;place-items:center;width:26px;height:24px;border-radius:6px;background:rgba(255,255,255,.07);cursor:pointer;font-size:16px;line-height:1}
.tile .stp:hover{background:color-mix(in srgb,var(--cyan) 30%,transparent)}

/* ===== Relic income ===== */
.credits .yrate{font-size:12px;font-weight:600;color:#7fe0a0;padding-left:10px;margin-left:2px;border-left:1px solid rgba(237,196,106,.25);font-family:var(--body,inherit)}
.incard .topearn{display:grid;gap:6px}
.incard .tearn{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(80% 120% at 0 50%,color-mix(in srgb,var(--rc) 16%,transparent),transparent 70%);text-align:left;width:100%}
.incard .tearn:hover{border-color:color-mix(in srgb,var(--rc) 50%,var(--line))}
.incard .tearn img{width:34px;height:34px}
.incard .tearn .nm{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incard .tearn .rate{font-size:13px;color:#7fe0a0}
.awayamt{font-family:var(--display,inherit);font-size:40px;font-weight:700;color:#edc46a;display:flex;gap:10px;align-items:center;justify-content:center}
.awayamt .coinI{width:30px;height:30px}
@media (max-width:560px){.credits .yrate{font-size:11px;padding-left:6px}}

/* ===== Museum: equip best ===== */
.equipbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.equipbar .eqtext{flex:1 1 320px}.equipbar .eqtext p{font-size:13.5px;margin-top:4px;max-width:62ch}
.equipbar .eqctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:rgba(6,10,26,.5)}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--dim,#9aa)}
.seg button.on{background:color-mix(in srgb,var(--cyan) 22%,transparent);color:#fff}
.equipbar .seg button{background:transparent;border:0;box-shadow:none;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--dim,#9aa6c0);cursor:pointer}
.equipbar .seg button:hover{color:#fff;background:rgba(255,255,255,.05)}
.equipbar .seg button.on{background:color-mix(in srgb,var(--cyan) 22%,transparent);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 45%,transparent)}

/* ===== Event schedule ===== */
.evsched{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.evslot{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(140deg,color-mix(in srgb,var(--t1) 70%,transparent),rgba(8,12,30,.85) 70%)}
.evslot.live{border-color:color-mix(in srgb,var(--t2) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--t2) 35%,transparent),0 0 24px color-mix(in srgb,var(--t2) 22%,transparent)}
.evslot .when{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.evslot .nm{font-weight:600;margin:4px 0 3px;font-size:14.5px}
.evslot .bn{font-size:12.5px;color:var(--dim,#9aa6c0);line-height:1.35}
.evbanner .evnext{font-size:13px;opacity:.8;margin-top:6px}

/* ===== Merge mutations ===== */
.badge.mutb{background:linear-gradient(90deg,rgba(120,255,180,.22),rgba(160,120,255,.22));border-color:rgba(160,255,200,.45);color:#d8ffe8}
.mergecard .mutline{font-size:12.5px;margin-top:6px;color:#b8ffd2}
.mutinfo{margin-bottom:18px;padding:12px 16px}.mutinfo summary{cursor:pointer;list-style:none;font-size:14px}.mutinfo summary::-webkit-details-marker{display:none}
.mutdlg{text-align:center}.mutdlg .k{letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--vc)}
.mutdlg h2{margin:6px 0 14px}
.mutlist{display:grid;gap:8px;text-align:left;max-height:50vh;overflow:auto}
.mutrow{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--vc) 40%,var(--line));background:radial-gradient(90% 140% at 0 50%,color-mix(in srgb,var(--vc) 18%,transparent),transparent 70%)}
.mutrow img{width:56px;height:56px}
.mutrow .nm{font-weight:600}
.dlg.mutpop{animation:mutpop .7s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 0 1px color-mix(in srgb,var(--vc,#9fffd0) 50%,transparent),0 0 60px color-mix(in srgb,var(--vc,#9fffd0) 35%,transparent)}
@keyframes mutpop{0%{transform:scale(.6) rotate(-3deg);opacity:0;filter:brightness(3)}60%{transform:scale(1.04) rotate(.5deg);opacity:1;filter:brightness(1.4)}100%{transform:none;filter:none}}

/* ===== Season 11: modules, hangar, voyages, auto-opener ===== */
.picon{flex:none}.picon path{fill:color-mix(in srgb,var(--pc) 22%,transparent);stroke:var(--pc);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.pchip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pc) 45%,var(--line));font-size:13px}
.shipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:18px}
.shipcard h2{display:flex;align-items:center;gap:6px}
.shipcv{width:100%;height:150px;display:block;margin:10px 0;border-radius:12px;background:radial-gradient(80% 100% at 50% 50%,rgba(40,60,120,.35),rgba(6,10,26,.6))}
.shipstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:12px}
.sst{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid color-mix(in srgb,var(--pc) 30%,var(--line));background:color-mix(in srgb,var(--pc) 7%,transparent)}
.sst div{display:flex;flex-direction:column;min-width:0}.sst b{font-size:13px}.sst span{font-size:11.5px;color:var(--dim,#9aa6c0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voyline{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.buildgrid{display:grid;gap:8px}
.bslot{display:grid;grid-template-columns:auto 1fr minmax(180px,240px);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.bslot span{display:flex;flex-direction:column}.bslot small{font-size:12px;color:var(--dim,#9aa6c0)}
@media (max-width:600px){.bslot{grid-template-columns:auto 1fr}.bslot select{grid-column:1/-1}}
.partgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.pgroup{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--pc) 30%,var(--line));flex-wrap:wrap}
.pgroup>div{flex:1;display:flex;flex-direction:column;min-width:120px}.pgroup span{font-size:12px;color:var(--dim,#9aa6c0)}.pgroup .pn{font-size:14px;color:var(--ink,#fff)}
.secgrid{display:grid;gap:8px}
.secrow{display:grid;grid-template-columns:minmax(200px,1.2fr) 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--sc) 28%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 9%,transparent),transparent 60%)}
.secrow>div:first-child{display:flex;flex-direction:column}.secrow .muted{font-size:12.5px}
.secmeta{display:flex;gap:10px;font-size:12.5px;color:var(--dim,#9aa6c0);white-space:nowrap}
@media (max-width:760px){.secrow{grid-template-columns:1fr}.secmeta{flex-wrap:wrap}}
.voylist{display:grid;gap:8px;max-height:65vh;overflow:auto}
.voyopt{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--sc) 35%,var(--line))}
.voyopt.locked{opacity:.5}.voyopt .vt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.voyopt .vt .muted{font-size:12.5px}
.swaprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.modpanel{margin-bottom:18px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.modc{padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.modc.none{opacity:.55}
.bonusdrops{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px;width:100%}
.bdrop{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--bc);background:radial-gradient(120% 140% at 0 50%,color-mix(in srgb,var(--bc) 22%,transparent),rgba(8,12,30,.85));text-align:left;animation:bdrop .8s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 0 28px color-mix(in srgb,var(--bc) 30%,transparent)}
.bdrop.mod{flex-direction:column;align-items:flex-start;gap:2px}.bdrop div{display:flex;flex-direction:column}
.bdrop .bk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bc)}.bdrop b{font-size:15px}.bdrop span:last-child{font-size:12.5px;opacity:.85}
@keyframes bdrop{0%{transform:translateY(14px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.bonusnote{font-size:12.5px;color:var(--dim,#9aa6c0);margin-top:10px}
.autopanel{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(6,10,26,.45)}
.autopanel summary{cursor:pointer;list-style:none;font-size:14px}.autopanel summary::-webkit-details-marker{display:none}
.autogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;margin-top:12px}
.autogrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--dim,#9aa6c0)}.autogrid label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink,#e8ecf6);font-size:13.5px}
.autogrid input[type=number],.autogrid select{width:100%}
#autohud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid rgba(120,220,255,.45);background:rgba(8,14,36,.94);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(80,200,255,.18);max-width:calc(100vw - 24px)}
#autohud>span:nth-child(2){display:flex;flex-direction:column;min-width:0}#autohud small{font-size:12px;color:var(--dim,#9aa6c0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
#autohud .spin{display:inline-block;animation:spin 1.2s linear infinite;color:var(--cyan);font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:560px){#autohud{bottom:10px;gap:8px;padding:8px 10px}#autohud small{max-width:40vw}}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let s=seed||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}
const hex=c=>{c=c.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); const p=parseInt(c,16); return [p>>16,(p>>8)&255,p&255];};
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex(a),B=hex(b); return toHex(A.map((v,i)=>v+(B[i]-v)*t));};
const rgba=(c,a)=>{const A=hex(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`;};
const lum=c=>{const A=hex(c); return (0.299*A[0]+0.587*A[1]+0.114*A[2])/255;};
const TAU=Math.PI*2;

function pick(it){ if(it.art&&M[it.art]) return {m:it.art,v:it.artv||''}; const n=it.name.toLowerCase(); for(const r of RULES) if(r[0].test(n)) return r[1]==='_base'?null:{m:r[1],v:r[2]||''}; return null; }
const motifCache={}; const motifOf=it=>motifCache[it.id]!==undefined?motifCache[it.id]:(motifCache[it.id]=pick(it));

// ---------- drawing kit ----------
function kit(ctx,it,S,t,sil){
  const R=S*0.36, c1=it.c1||'#334', c2=it.c2||'#9ab', rnd=rng(hash(it.id)+7), ri=CR.RIDX[it.rarity];
  const light=mix(c2,'#ffffff',0.35), dark=mix(c1,'#000000',0.35);
  const K={ctx,it,S,R,t,sil,c1,c2,light,dark,rnd,ri,lw:Math.max(1,S/170)};
  K.F=c=>sil?SIL:c;
  K.body=(cx=0,cy=0,r=R)=>{ if(sil) return SIL; const g=ctx.createRadialGradient(cx-r*0.4,cy-r*0.45,r*0.05,cx,cy,r*1.15); g.addColorStop(0,light); g.addColorStop(0.42,c2); g.addColorStop(1,dark); return g; };
  K.metal=(x0=-R,y0=-R,x1=R,y1=R,tint=c2)=>{ if(sil) return SIL; const g=ctx.createLinearGradient(x0,y0,x1,y1); const m=mix(tint,'#c9d1e0',0.35);
    g.addColorStop(0,mix(m,'#ffffff',0.5)); g.addColorStop(0.3,m); g.addColorStop(0.5,mix(m,'#000000',0.45)); g.addColorStop(0.7,mix(m,'#ffffff',0.25)); g.addColorStop(1,mix(m,'#000000',0.55)); return g; };
  K.glassFill=()=>sil?SIL:'rgba(190,220,255,0.07)';
  K.edge=(a=0.45,w)=>{ ctx.lineWidth=w||K.lw; ctx.strokeStyle=sil?rgba(CR.RARITIES[ri].color,0.55):rgba(light,a); ctx.stroke(); };
  K.glow=(x,y,r,c=c2,a=0.6)=>{ if(sil) return; const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba(c,a)); g.addColorStop(1,rgba(c,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); };
  K.spec=(x,y,rx,ry,rot=-0.6,a=0.35)=>{ if(sil) return; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,TAU); ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill(); };
  K.shadeOver=()=>{ if(sil) return; const g=ctx.createLinearGradient(-R,-R,R*0.9,R*1.1); g.addColorStop(0,'rgba(255,255,255,0.10)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.45)'); ctx.fillStyle=g; ctx.fill(); };
  K.blob=(n,r,jit,ry=1,rot=0)=>{ const p=[]; for(let i=0;i<n;i++){const a=i/n*TAU+rot, rr=r*(1-jit/2+rnd()*jit); p.push([Math.cos(a)*rr,Math.sin(a)*rr*ry]);}
    ctx.beginPath(); for(let i=0;i<=n;i++){ const a=p[i%n], b=p[(i+1)%n], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; i?ctx.quadraticCurveTo(a[0],a[1],mx,my):ctx.moveTo(mx,my);} ctx.closePath(); };
  K.poly=pts=>{ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); };
  K.line=(pts,c,w,a=1)=>{ if(sil) return; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.strokeStyle=rgba(c,a); ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); };
  K.dot=(x,y,r,c,a=1)=>{ if(sil) return; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=rgba(c,a); ctx.fill(); };
  K.yaw=0.8+0.2*Math.abs(Math.cos(t));   // gentle turntable squeeze
  return K;
}

const M={};
// Vessels
function contents(K,v,clipPath,top,bot,w){
  const {ctx,R,t,c1,c2,light,rnd,sil}=K; if(sil) return;
  ctx.save(); clipPath(); ctx.clip();
  if(v==='aurora'){ ctx.fillStyle='#050a18'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<4;i++){ ctx.beginPath(); for(let x=-w;x<=w;x+=w/12){ const y=top+(bot-top)*(0.3+0.12*i)+Math.sin(x/w*3+t*1.5+i)*R*0.08; x===-w?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.lineTo(w,top); ctx.lineTo(-w,top); ctx.closePath(); const g=ctx.createLinearGradient(0,top,0,bot); g.addColorStop(0,rgba(i%2?c2:'#7cffb0',0)); g.addColorStop(0.7,rgba(i%2?c2:'#7cffb0',0.45)); g.addColorStop(1,rgba(c2,0)); ctx.fillStyle=g; ctx.fill(); } for(let i=0;i<10;i++) K.dot((rnd()-0.5)*w*1.8,top+rnd()*(bot-top)*0.4,R*0.012,'#ffffff',0.8); }
  else if(v==='sunset'){ const g=ctx.createLinearGradient(0,top,0,bot); g.addColorStop(0,mix(c1,'#1a1040',0.4)); g.addColorStop(0.55,c2); g.addColorStop(0.75,'#ffcf8a'); g.addColorStop(1,dark2(c1)); ctx.fillStyle=g; ctx.fillRect(-w,top,w*2,bot-top); K.glow(w*0.15,top+(bot-top)*0.7,R*0.35,'#fff0c0',0.9); ctx.fillStyle=dark2(c1); ctx.fillRect(-w,top+(bot-top)*0.78,w*2,bot); }
  else if(v==='lightning'){ ctx.fillStyle='rgba(20,24,60,0.6)'; ctx.fillRect(-w,top,w*2,bot-top); const pts=[[0,top]]; let x=0; for(let y=top;y<bot;y+=(bot-top)/7){ x+=(rnd()-0.5)*w*0.9; pts.push([x,y]);} K.line(pts,'#ffffff',K.lw*2.4); K.line(pts,c2,K.lw*7,0.35); }
  else if(v==='hail'){ for(let i=0;i<16;i++){ const x=(rnd()-0.5)*w*1.6, y=top+((rnd()+t*0.15)%1)*(bot-top); const s=R*(0.03+rnd()*0.04); K.poly([[x,y-s],[x+s*0.7,y],[x,y+s],[x-s*0.7,y]]); ctx.fillStyle=rgba(light,0.85); ctx.fill(); } }
  else if(v==='fleet'){ ctx.fillStyle='rgba(10,16,40,0.6)'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<5;i++){ const x=(rnd()-0.5)*w*1.3, y=top+(0.2+rnd()*0.6)*(bot-top), s=R*(0.05+rnd()*0.05); K.poly([[x+s*1.6,y],[x-s,y-s*0.5],[x-s*0.6,y],[x-s,y+s*0.5]]); ctx.fillStyle=rgba(light,0.9); ctx.fill(); K.line([[x-s,y],[x-s*2.4,y]],c2,K.lw,0.5);} }
  else if(v==='dust'){ for(let i=0;i<70;i++){ const y=bot-Math.pow(rnd(),1.8)*(bot-top)*0.8; K.dot((rnd()-0.5)*w*1.8+Math.sin(t+i)*R*0.01,y,R*(0.008+rnd()*0.018),i%3?c2:light,0.85);} }
  else if(v==='foam'){ for(let i=0;i<26;i++){ const x=(rnd()-0.5)*w*1.7, y=top+rnd()*(bot-top), r=R*(0.02+rnd()*0.07); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.strokeStyle=rgba(light,0.6); ctx.lineWidth=K.lw; ctx.stroke(); } }
  else if(v==='mat'){ const g=ctx.createLinearGradient(0,top,0,bot); g.addColorStop(0,rgba(c1,0.2)); g.addColorStop(1,rgba(c1,0.9)); ctx.fillStyle=g; ctx.fillRect(-w,top+(bot-top)*0.5,w*2,bot); for(let i=0;i<40;i++){ const x=(rnd()-0.5)*w*1.8, y=top+(bot-top)*(0.45+rnd()*0.5); K.line([[x,y],[x+(rnd()-0.5)*R*0.05,y-R*0.08]],c2,K.lw,0.7);} }
  else if(v==='lights'){ ctx.fillStyle='rgba(4,10,24,0.7)'; ctx.fillRect(-w,top,w*2,bot-top); const n=9; let px=0,py=bot; for(let i=0;i<n;i++){ const x=Math.sin(i*1.3+t)*w*0.5, y=bot-(i+0.5)/n*(bot-top); K.line([[px,py],[x,y]],c2,K.lw,0.35); K.glow(x,y,R*0.08,c2,0.9); K.dot(x,y,R*0.018,'#ffffff'); px=x;py=y; } }
  else if(v==='static'){ ctx.fillStyle='#0a0e18'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<220;i++){ const g=Math.floor(rnd()*255); ctx.fillStyle=`rgba(${g},${g},${g},${0.3+rnd()*0.5})`; ctx.fillRect((rnd()-0.5)*w*2,top+rnd()*(bot-top),R*0.02,R*0.012);} for(let i=0;i<3;i++){ const y=top+((t*0.3+i/3)%1)*(bot-top); ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(-w,y,w*2,R*0.03);} }
  else if(v==='molecule'){ ctx.fillStyle=rgba(c2,0.12); ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<6;i++){ const x=(rnd()-0.5)*w*1.4, y=top+(0.15+rnd()*0.7)*(bot-top), a=rnd()*3+t*(0.3+rnd()*0.4), d=R*0.09; K.line([[x-Math.cos(a)*d,y-Math.sin(a)*d],[x+Math.cos(a)*d,y+Math.sin(a)*d]],light,K.lw*1.5,0.7); K.dot(x-Math.cos(a)*d,y-Math.sin(a)*d,R*0.045,c2); K.dot(x+Math.cos(a)*d,y+Math.sin(a)*d,R*0.045,light);} }
  else if(v==='crystals'){ ctx.fillStyle=rgba(c2,0.2); ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<14;i++){ const x=(rnd()-0.5)*w*1.6, y=top+((rnd()+t*0.05)%1)*(bot-top), s=R*(0.03+rnd()*0.04); ctx.save(); ctx.translate(x,y); ctx.rotate(rnd()*3+t); ctx.fillStyle=rgba('#7ab0ff',0.85); ctx.fillRect(-s/2,-s/2,s,s); ctx.restore(); } }
  else if(v==='metal'){ ctx.fillStyle='rgba(40,44,56,0.5)'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<16;i++){ const x=(rnd()-0.5)*w*1.6, y=top+rnd()*(bot-top), r=R*(0.025+rnd()*0.05); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); const g=ctx.createRadialGradient(x-r*0.4,y-r*0.4,0,x,y,r); g.addColorStop(0,'#ffffff'); g.addColorStop(0.4,'#b8bcc8'); g.addColorStop(1,'#3a3e48'); ctx.fillStyle=g; ctx.fill(); } }
  else if(v==='puff'){ ctx.fillStyle=rgba(c2,0.12); ctx.fillRect(-w,top,w*2,bot-top); const cy=top+(bot-top)*0.45+Math.sin(t)*R*0.05; for(const [dx,dy,r] of [[-0.35,0.05,0.42],[0,-0.12,0.5],[0.35,0.05,0.4],[0,0.15,0.45]]){ ctx.beginPath(); ctx.arc(dx*w*1.4,cy+dy*R,r*w,0,TAU); ctx.fillStyle='rgba(240,245,255,0.85)'; ctx.fill(); } K.dot(-w*0.2,cy,R*0.03,'#1a2040'); K.dot(w*0.2,cy,R*0.03,'#1a2040'); }
  else if(v==='nebula'){ ctx.fillStyle='#070a1c'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<5;i++) K.glow((rnd()-0.5)*w*1.4,top+rnd()*(bot-top),R*(0.2+rnd()*0.25),i%2?c2:'#ff7ac0',0.55); for(let i=0;i<14;i++) K.dot((rnd()-0.5)*w*1.8,top+rnd()*(bot-top),R*0.012,'#ffffff',0.9); }
  else if(v==='leaf'){ ctx.fillStyle='rgba(200,240,255,0.18)'; ctx.fillRect(-w,top,w*2,bot-top); ctx.save(); ctx.translate(0,top+(bot-top)*0.5); ctx.rotate(Math.sin(t)*0.4); ctx.beginPath(); ctx.moveTo(0,R*0.25); ctx.quadraticCurveTo(R*0.22,0,0,-R*0.25); ctx.quadraticCurveTo(-R*0.22,0,0,R*0.25); ctx.fillStyle='#5ad07a'; ctx.fill(); ctx.restore(); }
  else if(v==='sparse'){ ctx.fillStyle='rgba(255,230,190,0.06)'; ctx.fillRect(-w,top,w*2,bot-top); for(let i=0;i<10;i++) K.dot((rnd()-0.5)*w*1.6,top+rnd()*(bot-top),R*0.012,'#e0c090',0.8); }
  else if(v==='neon'){ ctx.fillStyle='rgba(30,0,10,0.4)'; ctx.fillRect(-w,top,w*2,bot-top); const pts=[]; for(let i=0;i<=16;i++){ const y=top+(bot-top)*(0.1+i/16*0.8); pts.push([Math.sin(i*1.3)*w*0.55,y]); } K.line(pts,'#ff3a5a',K.lw*7,0.3); K.line(pts,'#ffb0c0',K.lw*2); }
  else { // gas / liquid
    const g=ctx.createLinearGradient(0,top,0,bot); g.addColorStop(0,rgba(c2,0.25)); g.addColorStop(1,rgba(c2,0.75)); ctx.fillStyle=g; ctx.fillRect(-w,top,w*2,bot-top);
    for(let i=0;i<5;i++){ ctx.beginPath(); const y=top+(0.15+i*0.17)*(bot-top); for(let x=-w;x<=w;x+=w/10){ const yy=y+Math.sin(x/w*4+t*1.2+i*1.7)*R*0.04; x===-w?ctx.moveTo(x,yy):ctx.lineTo(x,yy);} ctx.strokeStyle=rgba(light,0.28); ctx.lineWidth=R*0.035; ctx.stroke(); } }
  ctx.restore();
}

function glassFinish(K,path){ const {ctx,R,sil}=K; path(); K.edge(0.5,K.lw*1.3); if(sil) return; ctx.save(); path(); ctx.clip(); const g=ctx.createLinearGradient(-R,0,R,0); g.addColorStop(0,'rgba(255,255,255,0.0)'); g.addColorStop(0.18,'rgba(255,255,255,0.22)'); g.addColorStop(0.3,'rgba(255,255,255,0.0)'); g.addColorStop(0.85,'rgba(255,255,255,0.08)'); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(-R*1.5,-R*1.5,R*3,R*3); ctx.restore(); }
