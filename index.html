M.bottle=(K,v)=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); const w=R*0.55, p=()=>{ ctx.beginPath(); ctx.moveTo(-R*0.17,-R*1.0); ctx.lineTo(-R*0.17,-R*0.6); ctx.bezierCurveTo(-w,-R*0.45,-w,-R*0.35,-w,-R*0.1); ctx.lineTo(-w,R*0.85); ctx.quadraticCurveTo(-w,R*1.0,-w*0.8,R*1.0); ctx.lineTo(w*0.8,R*1.0); ctx.quadraticCurveTo(w,R*1.0,w,R*0.85); ctx.lineTo(w,-R*0.1); ctx.bezierCurveTo(w,-R*0.35,w,-R*0.45,R*0.17,-R*0.6); ctx.lineTo(R*0.17,-R*1.0); ctx.closePath(); };
  p(); ctx.fillStyle=K.glassFill(); ctx.fill(); contents(K,v,p,-R*0.35,R,w); glassFinish(K,p); ctx.beginPath(); ctx.roundRect(-R*0.2,-R*1.18,R*0.4,R*0.22,R*0.05); ctx.fillStyle=K.F('#8a6a4a'); ctx.fill(); };

M.flask=(K,v)=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); const p=()=>{ ctx.beginPath(); ctx.moveTo(-R*0.18,-R*1.0); ctx.lineTo(-R*0.18,-R*0.35); ctx.lineTo(-R*0.85,R*0.85); ctx.quadraticCurveTo(-R*0.9,R*1.0,-R*0.7,R*1.0); ctx.lineTo(R*0.7,R*1.0); ctx.quadraticCurveTo(R*0.9,R*1.0,R*0.85,R*0.85); ctx.lineTo(R*0.18,-R*0.35); ctx.lineTo(R*0.18,-R*1.0); ctx.closePath(); };
  p(); ctx.fillStyle=K.glassFill(); ctx.fill(); contents(K,v,p,-R*0.1,R,R*0.9); glassFinish(K,p); K.line([[-R*0.24,-R*1.0],[R*0.24,-R*1.0]],'#c0d0f0',K.lw*3,0.7); };
M.ampoule=(K,v)=>{ const {ctx,R}=K; ctx.rotate(0.35); ctx.scale(K.yaw,1); const w=R*0.36, p=()=>{ ctx.beginPath(); ctx.moveTo(0,-R*1.2); ctx.quadraticCurveTo(R*0.06,-R*0.85,R*0.08,-R*0.75); ctx.quadraticCurveTo(w,-R*0.65,w,-R*0.4); ctx.lineTo(w,R*0.8); ctx.quadraticCurveTo(w,R*1.05,0,R*1.05); ctx.quadraticCurveTo(-w,R*1.05,-w,R*0.8); ctx.lineTo(-w,-R*0.4); ctx.quadraticCurveTo(-w,-R*0.65,-R*0.08,-R*0.75); ctx.quadraticCurveTo(-R*0.06,-R*0.85,0,-R*1.2); ctx.closePath(); };

M.canister=(K,v)=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); const w=R*0.62, p=()=>{ ctx.beginPath(); ctx.rect(-w,-R*0.75,w*2,R*1.5); };
  p(); ctx.fillStyle=K.glassFill(); ctx.fill(); contents(K,v,p,-R*0.75,R*0.75,w); glassFinish(K,p);
  for(const y of [-1,1]){ ctx.beginPath(); ctx.roundRect(-w*1.12,y*R*0.75-R*0.13,w*2.24,R*0.26,R*0.06); ctx.fillStyle=K.metal(-w,0,w,0,'#7a88aa'); ctx.fill(); K.edge(0.3);}
  for(const x of [-0.7,0,0.7]){ ctx.fillStyle=K.F('#59658a'); ctx.fillRect(x*w-R*0.03,-R*0.62,R*0.06,R*1.24); } K.dot(w*0.95,-R*0.45,R*0.04,'#7cff9a',0.9); };
M.vial=(K,v)=>{ const {ctx,R}=K; if(!K.fixedVessel){ const h=hash(K.it.id)%5; if(h===1){ K.fixedVessel=1; return M.ampoule(K,v);} if(h===2){ K.fixedVessel=1; return M.flask(K,v);} if(h===3){ K.fixedVessel=1; return M.canister(K,v);} if(h===4&&v!=='lights'){ K.fixedVessel=1; return M.bottle(K,v);} } ctx.rotate(-0.2+((K.rnd()-0.5)*0.4)); ctx.scale(K.yaw,1); const w=R*(0.3+K.rnd()*0.12), h=R*1.0, p=()=>{ ctx.beginPath(); ctx.moveTo(-w,-h*0.85); ctx.lineTo(-w,h*0.75); ctx.arc(0,h*0.75,w,Math.PI,0,true); ctx.lineTo(w,-h*0.85); ctx.closePath(); };

M.fuse=K=>{ const {ctx,R}=K; ctx.rotate(-0.5); ctx.scale(K.yaw,1); const p=()=>{ ctx.beginPath(); ctx.rect(-R*0.6,-R*0.25,R*1.2,R*0.5); }; p(); ctx.fillStyle=K.glassFill(); ctx.fill();
  if(!K.sil){ const pts=[]; for(let i=0;i<=12;i++) pts.push([-R*0.6+i*R*0.1,Math.sin(i*1.4)*R*0.1]); K.line(pts.slice(0,6),'#3a2a20',K.lw*2); K.line(pts.slice(7),'#3a2a20',K.lw*2); K.glow(0,0,R*0.15,'#ff8a3a',0.5);} glassFinish(K,p);

M.hourglass=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); const p=()=>{ ctx.beginPath(); ctx.moveTo(-R*0.6,-R*0.85); ctx.bezierCurveTo(-R*0.6,-R*0.2,-R*0.06,-R*0.15,-R*0.06,0); ctx.bezierCurveTo(-R*0.06,R*0.15,-R*0.6,R*0.2,-R*0.6,R*0.85); ctx.lineTo(R*0.6,R*0.85); ctx.bezierCurveTo(R*0.6,R*0.2,R*0.06,R*0.15,R*0.06,0); ctx.bezierCurveTo(R*0.06,-R*0.15,R*0.6,-R*0.2,R*0.6,-R*0.85); ctx.closePath(); };
  p(); ctx.fillStyle=K.glassFill(); ctx.fill(); if(!K.sil){ ctx.save(); p(); ctx.clip(); const f=(Math.sin(t*0.5)+1)/2; ctx.fillStyle=rgba(c2,0.85); ctx.beginPath(); ctx.moveTo(-R*0.6,-R*0.85*f*0.6-R*0.1); ctx.lineTo(R*0.6,-R*0.85*f*0.6-R*0.1); ctx.lineTo(0,0); ctx.fill(); ctx.beginPath(); ctx.moveTo(-R*0.6,R*0.85); ctx.lineTo(R*0.6,R*0.85); ctx.lineTo(0,R*0.85-R*0.5*(1-f)-R*0.1); ctx.fill(); ctx.fillRect(-R*0.012,0,R*0.024,R*0.8); ctx.restore(); }
  glassFinish(K,p); for(const y of[-1,1]){ ctx.beginPath(); ctx.roundRect(-R*0.78,y*R*0.9-R*0.08,R*1.56,R*0.16,R*0.04); ctx.fillStyle=K.metal(0,0,R,0,K.c2); ctx.fill(); } for(const x of[-1,1]){ ctx.fillStyle=K.F(mix(K.c1,'#806040',0.5)); ctx.fillRect(x*R*0.7-R*0.035,-R*0.85,R*0.07,R*1.7);} };
M.rainup=K=>{ const {ctx,R,t,c2,rnd}=K; ctx.scale(K.yaw,1); K.blob(10,R*0.75,0.25,0.45,0); ctx.translate(0,0); ctx.fillStyle=K.body(0,-R*0.4,R*0.8); ctx.save(); ctx.translate(0,-R*0.45); K.blob(10,R*0.75,0.25,0.45,0); ctx.fill(); ctx.restore();
  for(let i=0;i<12;i++){ const x=(rnd()-0.5)*R*1.3, y=R*0.9-((rnd()+t*0.25)%1)*R*1.2; ctx.beginPath(); ctx.moveTo(x,y-R*0.08); ctx.quadraticCurveTo(x+R*0.05,y+R*0.04,x,y+R*0.06); ctx.quadraticCurveTo(x-R*0.05,y+R*0.04,x,y-R*0.08); ctx.fillStyle=K.F(rgba(c2,0.85)); ctx.fill(); } };
// Botanical
M.flower=(K,v)=>{ const {ctx,R,t,rnd}=K; ctx.scale(K.yaw,1); const hue=hash(K.it.id)%360, c2=`hsl(${hue},70%,62%)`, c1=`hsl(${(hue+330)%360},55%,25%)`, light=`hsl(${hue},85%,85%)`, tip=(hash(K.it.id)>>8)%3;
  if(!K.sil) K.line([[0,R*0.1],[R*0.05,R*0.6],[-R*0.02,R*1.05]],'#3a6a4a',K.lw*3);
  const layers=v==='rose'?4:v==='lotus'?2:1, n=v==='orchid'?5:v==='lotus'?8:v==='rose'?5:5+Math.floor(rnd()*4);
  for(let L=0;L<layers;L++){ const sc=1-L*0.2; for(let i=0;i<n;i++){ const a=i/n*TAU+L*0.5+t*0.15+(v==='lotus'?-Math.PI/2:0); ctx.save(); ctx.rotate(a); ctx.beginPath();
      const len=R*0.75*sc*(v==='orchid'&&i===0?1.25:1), wid=R*(v==='lotus'?0.18:v==='star'?0.14:0.28)*sc;
      ctx.moveTo(0,0); if(tip===1){ ctx.bezierCurveTo(wid*1.3,-len*0.4,wid*1.2,-len,0,-len*0.85); ctx.lineTo(0,-len*0.85); ctx.bezierCurveTo(-wid*1.2,-len,-wid*1.3,-len*0.4,0,0); } else if(tip===2){ ctx.quadraticCurveTo(wid*1.4,-len*0.6,0,-len); ctx.quadraticCurveTo(-wid*1.4,-len*0.6,0,0); } else { ctx.bezierCurveTo(wid,-len*0.3,wid*1.1,-len*0.8,0,-len); ctx.bezierCurveTo(-wid*1.1,-len*0.8,-wid,-len*0.3,0,0); }
      if(K.sil){ ctx.fillStyle=SIL; } else { const g=ctx.createLinearGradient(0,0,0,-len); g.addColorStop(0,c1); g.addColorStop(0.6,c2); g.addColorStop(1,light); ctx.fillStyle=g; }
      ctx.fill(); K.edge(0.25); ctx.restore(); } }
  K.glow(0,0,R*0.3,'#fff3c0',0.7); for(let i=0;i<8;i++){ const a=i/8*TAU; K.dot(Math.cos(a)*R*0.1,Math.sin(a)*R*0.1,R*0.03,'#ffe08a'); } };
M.thistle=K=>{ const {ctx,R,c2,rnd}=K; ctx.scale(K.yaw,1); K.line([[0,R*0.2],[0,R*1.05]],'#3a5a40',K.lw*3); ctx.beginPath(); ctx.ellipse(0,R*0.15,R*0.35,R*0.3,0,0,TAU); ctx.fillStyle=K.body(0,R*0.15,R*0.35); ctx.fill();
  for(let i=0;i<22;i++){ const a=-Math.PI*0.95+i/21*Math.PI*0.9; K.line([[Math.cos(a)*R*0.2,R*0.05+Math.sin(a)*R*0.15],[Math.cos(a)*R*0.75,Math.sin(a)*R*0.8]],c2,K.lw*1.5,0.9); K.dot(Math.cos(a)*R*0.75,Math.sin(a)*R*0.8,R*0.025,'#ffffff',0.8); }
  for(let i=0;i<10;i++){ const a=Math.PI*0.1+i/9*Math.PI*0.8; K.poly([[Math.cos(a)*R*0.3,R*0.15+Math.sin(a)*R*0.25],[Math.cos(a)*R*0.55,R*0.2+Math.sin(a)*R*0.5],[Math.cos(a+0.15)*R*0.3,R*0.15+Math.sin(a+0.15)*R*0.25]]); ctx.fillStyle=K.F(mix(K.c1,'#2a4a30',0.6)); ctx.fill(); } };
M.fern=K=>{ const {ctx,R,c2,t}=K; ctx.scale(K.yaw,1); ctx.rotate(-0.25+Math.sin(t)*0.05); const spine=[]; for(let i=0;i<=20;i++){ const y=R*1.0-i*R*0.1, x=Math.sin(i*0.12)*R*0.25; spine.push([x,y]); }
  for(let i=2;i<20;i++){ const [x,y]=spine[i], s=(1-i/22)*R*0.6; for(const d of[-1,1]){ ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+d*s*0.6,y-s*0.5,x+d*s,y-s*0.15); ctx.quadraticCurveTo(x+d*s*0.5,y-s*0.05,x,y); ctx.fillStyle=K.F(mix(K.c1,c2,0.3+i/30)); ctx.fill(); } }
  K.line(spine,mix(K.c1,'#000000',0.2),K.lw*2.2); if(K.sil){ ctx.beginPath(); ctx.ellipse(0,0,R*0.5,R*0.9,0,0,TAU); ctx.fillStyle=SIL; ctx.fill(); } };
M.leaf=(K,v)=>{ const {ctx,R,c2,light}=K; ctx.rotate(-0.6); ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(0,R*1.05); ctx.bezierCurveTo(R*0.8,R*0.3,R*0.6,-R*0.7,0,-R*1.05); ctx.bezierCurveTo(-R*0.6,-R*0.7,-R*0.8,R*0.3,0,R*1.05);
  ctx.fillStyle=v==='mirror'?K.metal(-R,0,R,0,c2):K.body(); ctx.fill(); K.edge(0.5); K.line([[0,R*1.05],[0,-R*0.95]],light,K.lw*1.5,0.6); for(let i=1;i<7;i++){ const y=R*0.8-i*R*0.25; K.line([[0,y],[R*0.45,y-R*0.25]],light,K.lw,0.4); K.line([[0,y],[-R*0.45,y-R*0.25]],light,K.lw,0.4);} };
M.moss=K=>{ const {ctx,R,c2,rnd}=K; ctx.scale(K.yaw,1); K.blob(9,R*0.75,0.2,0.55,0); ctx.save(); ctx.translate(0,R*0.35); K.blob(9,R*0.8,0.2,0.5,0); ctx.fillStyle=K.body(0,0,R*0.8); ctx.fill(); ctx.restore();
  for(let i=0;i<60;i++){ const a=rnd()*Math.PI, r=rnd()*R*0.75, x=Math.cos(a)*r*1.0, y=R*0.35-Math.sin(a)*r*0.6; K.line([[x,y],[x+(rnd()-0.5)*R*0.06,y-R*(0.06+rnd()*0.12)]],rnd()>0.5?c2:K.light,K.lw,0.8); K.dot(x,y-R*0.15,R*0.012,'#ffffff',rnd()>0.85?0.9:0); } };
M.cactus=K=>{ const {ctx,R,c2}=K; ctx.scale(K.yaw,1); const seg=(x,y,w,h)=>{ ctx.beginPath(); ctx.roundRect(x-w,y-h,w*2,h*2,w); ctx.fillStyle=K.body(x,y,Math.max(w,h)); ctx.fill(); K.edge(0.3); if(!K.sil) for(let i=-2;i<=2;i++) K.line([[x+i*w*0.38,y-h*0.85],[x+i*w*0.38,y+h*0.85]],'#000000',K.lw,0.2); };
  seg(0,0,R*0.35,R*0.95); seg(-R*0.55,-R*0.1,R*0.18,R*0.4); seg(R*0.55,R*0.15,R*0.16,R*0.32); K.glow(0,-R*0.95,R*0.3,'#ff9a5a',0.8); K.dot(0,-R*0.95,R*0.1,'#ffb07a'); };
M.acorn=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(-R*0.6,-R*0.15); ctx.bezierCurveTo(-R*0.65,R*0.6,-R*0.2,R*1.0,0,R*1.05); ctx.bezierCurveTo(R*0.2,R*1.0,R*0.65,R*0.6,R*0.6,-R*0.15); ctx.closePath(); ctx.fillStyle=K.body(0,R*0.4,R*0.8); ctx.fill(); K.edge(0.35);
  ctx.beginPath(); ctx.ellipse(0,-R*0.3,R*0.75,R*0.38,0,Math.PI,0); ctx.lineTo(R*0.75,-R*0.12); ctx.quadraticCurveTo(0,R*0.05,-R*0.75,-R*0.12); ctx.closePath(); ctx.fillStyle=K.F(mix(K.c1,'#3a2a18',0.6)); ctx.fill();
  if(!K.sil) for(let i=0;i<5;i++) for(let j=0;j<9;j++) K.dot(-R*0.6+j*R*0.15+(i%2)*R*0.07,-R*0.55+i*R*0.1,R*0.035,'#000000',0.25); K.line([[0,-R*0.68],[R*0.1,-R*1.0]],'#4a3420',K.lw*3); };
M.gourd=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.arc(0,R*0.35,R*0.62,0,TAU); ctx.moveTo(R*0.35,-R*0.35); ctx.arc(0,-R*0.35,R*0.35,0,TAU); ctx.fillStyle=K.body(0,0,R); ctx.fill(); K.edge(0.3);
  if(!K.sil) for(let i=-2;i<=2;i++) K.line([[i*R*0.2,-R*0.25],[i*R*0.32,R*0.95]],'#000000',K.lw,0.15); K.line([[0,-R*0.7],[-R*0.12,-R*1.05]],'#4a3a20',K.lw*3); K.glow(0,R*0.35,R*0.3,K.c2,0.4); };
M.roots=K=>{ const {ctx,R,rnd}=K; ctx.scale(K.yaw,1); for(let i=0;i<9;i++){ const pts=[[0,-R*0.2]]; let x=0,y=-R*0.2; const a=(i/8-0.5)*2.4; for(let j=0;j<6;j++){ x+=Math.sin(a+j*0.3*(rnd()-0.5))*R*0.15; y+=Math.cos(a)*R*0.15+R*0.03; pts.push([x,y]); }
    if(K.sil){ ctx.beginPath(); pts.forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.strokeStyle=SIL; ctx.lineWidth=R*0.12; ctx.stroke(); } else { K.line(pts,K.c1,R*0.1); K.line(pts,K.c2,R*0.04,0.6); } }

M.reed=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); for(let i=-1;i<=1;i++){ ctx.save(); ctx.rotate(i*0.18+Math.sin(t+i)*0.03); ctx.beginPath(); ctx.roundRect(-R*0.07,-R*1.05,R*0.14,R*2.1,R*0.07); ctx.fillStyle=K.F(rgba(c2,0.35)); ctx.fill(); K.edge(0.7);
  for(let k=0;k<4;k++) K.line([[-R*0.08,-R*0.7+k*R*0.5],[R*0.08,-R*0.7+k*R*0.5]],K.light,K.lw*1.5,0.7); ctx.restore(); } };
M.kelp=K=>{ const {ctx,R,t,c2,c1}=K; ctx.scale(K.yaw,1); for(let s=0;s<3;s++){ ctx.beginPath(); const x0=(s-1)*R*0.35; for(let i=0;i<=24;i++){ const y=R*1.05-i*R*0.088, x=x0+Math.sin(i*0.4+t*1.4+s)*R*0.18; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.strokeStyle=K.F(mix(c1,c2,0.4+s*0.2)); ctx.lineWidth=R*0.16; ctx.lineCap='round'; ctx.stroke();
  for(let i=4;i<24;i+=5){ const y=R*1.05-i*R*0.088, x=x0+Math.sin(i*0.4+t*1.4+s)*R*0.18; K.dot(x+R*0.1,y,R*0.05,K.light,0.8);} } };
M.vine=K=>{ const {ctx,R,c2}=K; ctx.scale(K.yaw,1); const pts=[]; for(let i=0;i<=40;i++){ const a=i*0.33, r=R*0.9*(1-i/48); pts.push([Math.cos(a)*r,Math.sin(a)*r*0.9]); }
  if(K.sil){ ctx.beginPath(); ctx.arc(0,0,R*0.9,0,TAU); ctx.fillStyle=SIL; ctx.fill(); return; } K.line(pts,K.c1,R*0.08); K.line(pts,c2,R*0.03,0.6);
  for(let i=3;i<40;i+=4){ const [x,y]=pts[i]; ctx.save(); ctx.translate(x,y); ctx.rotate(i); ctx.beginPath(); ctx.ellipse(R*0.08,0,R*0.1,R*0.05,0,0,TAU); ctx.fillStyle=mix(K.c1,c2,0.6); ctx.fill(); ctx.restore(); } K.singularityDot=1; ctx.beginPath(); ctx.arc(0,0,R*0.1,0,TAU); ctx.fillStyle='#000'; ctx.fill(); K.glow(0,0,R*0.25,c2,0.6); };
M.bonsai=K=>{ const {ctx,R,c2,rnd}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.roundRect(-R*0.6,R*0.62,R*1.2,R*0.35,R*0.06); ctx.fillStyle=K.metal(0,R*0.6,0,R,'#6a5a8a'); ctx.fill();
  K.line([[0,R*0.65],[-R*0.1,R*0.3],[R*0.15,0],[-R*0.05,-R*0.3]],mix(K.c1,'#5a4030',0.5),R*0.1); for(const [x,y,r] of [[-R*0.35,-R*0.35,R*0.32],[R*0.3,-R*0.15,R*0.3],[0,-R*0.65,R*0.33],[R*0.45,-R*0.55,R*0.2]]){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU+rnd(); ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r*0.75);} ctx.closePath(); ctx.fillStyle=K.F(rgba(c2,0.55)); ctx.fill(); K.edge(0.8); } };
M.coral=K=>{ const {ctx,R,c2,rnd}=K; ctx.scale(K.yaw,1); const br=(x,y,a,len,d)=>{ if(d>4||len<R*0.08) return; const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len; if(K.sil){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=SIL;ctx.lineWidth=R*0.13/(d*0.4+1);ctx.lineCap='round';ctx.stroke();} else { K.line([[x,y],[x2,y2]],mix(K.c1,c2,d/5),R*0.12/(d*0.35+1)); }
  if(d===4) K.glow(x2,y2,R*0.08,c2,0.7); br(x2,y2,a-0.4-rnd()*0.3,len*0.72,d+1); br(x2,y2,a+0.4+rnd()*0.3,len*0.72,d+1); }; br(0,R*1.0,-Math.PI/2,R*0.55,0); };
M.lichen=K=>{ const {ctx,R,rnd}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.roundRect(-R*0.85,-R*0.65,R*1.7,R*1.3,R*0.08); ctx.fillStyle=K.metal(-R,-R,R,R,'#7a7f8a'); ctx.fill(); K.edge(0.3);
  for(let i=0;i<14;i++){ const x=(rnd()-0.5)*R*1.4, y=(rnd()-0.5)*R*1.0, r=R*(0.08+rnd()*0.18); ctx.save(); ctx.translate(x,y); K.blob(10,r,0.5,1,0); ctx.fillStyle=K.F(rgba(rnd()>0.5?K.c2:K.light,0.75)); ctx.fill(); ctx.restore(); }
  for(let i=0;i<4;i++) K.dot(-R*0.7+i*R*0.47,-R*0.5,R*0.04,'#222a3a'); };
M.fruit=K=>{ const {ctx,R,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(0,-R*0.65); ctx.bezierCurveTo(R*0.95,-R*0.95,R*1.0,R*0.7,0,R*0.95); ctx.bezierCurveTo(-R*1.0,R*0.7,-R*0.95,-R*0.95,0,-R*0.65); ctx.fillStyle=K.body(0,0,R); ctx.fill(); K.edge(0.3);
  K.glow(0,R*0.1,R*0.6,'#fff2b0',0.55); K.line([[0,-R*0.65],[R*0.05,-R*1.0]],'#4a3a20',K.lw*3); ctx.save(); ctx.translate(R*0.2,-R*0.9); ctx.rotate(0.5); ctx.beginPath(); ctx.ellipse(R*0.15,0,R*0.2,R*0.08,0,0,TAU); ctx.fillStyle=K.F('#3a7a4a'); ctx.fill(); ctx.restore(); K.spec(-R*0.35,-R*0.3,R*0.15,R*0.08); };
M.seed=K=>{ const {ctx,R,c2,rnd}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(0,-R*1.0); ctx.bezierCurveTo(R*0.7,-R*0.6,R*0.65,R*0.7,0,R*0.95); ctx.bezierCurveTo(-R*0.65,R*0.7,-R*0.7,-R*0.6,0,-R*1.0); ctx.fillStyle=K.body(); ctx.fill(); K.edge(0.35);
  K.line([[0,-R*0.95],[0,R*0.9]],'#000000',K.lw*2,0.25); if(!K.sil){ ctx.save(); ctx.beginPath(); ctx.ellipse(0,R*0.1,R*0.18,R*0.4,0,0,TAU); ctx.clip(); K.glow(0,R*0.1,R*0.4,c2,0.9); ctx.restore(); } for(let i=0;i<5;i++){ const a=rnd()*TAU; K.dot(Math.cos(a)*R*0.35,Math.sin(a)*R*0.6,R*0.02,'#ffffff',0.6);} };
M.bladder=K=>{ const {ctx,R,rnd,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.arc(0,R*0.1,R*0.8,0,TAU); ctx.fillStyle=K.F(rgba(c2,0.22)); ctx.fill(); K.edge(0.55); if(!K.sil){ for(let i=0;i<12;i++){ const a=rnd()*TAU, r=rnd()*R*0.6; K.dot(Math.cos(a)*r,R*0.1+Math.sin(a)*r,R*(0.04+rnd()*0.05),K.light,0.8);} for(let i=0;i<5;i++) K.line([[Math.cos(i)*R*0.8,R*0.1+Math.sin(i)*R*0.8],[Math.cos(i+0.6)*R*0.3,R*0.1+Math.sin(i+0.6)*R*0.3]],K.light,K.lw,0.3); }
  K.line([[0,-R*0.7],[R*0.05,-R*1.05]],mix(K.c1,'#4a3a20',0.5),K.lw*3); K.spec(-R*0.35,-R*0.3,R*0.2,R*0.08); };
// Fauna
M.skull=(K)=>{ const {ctx,R,rnd}=K; ctx.scale(K.yaw,1); const long=0.8+rnd()*0.5; ctx.beginPath(); ctx.ellipse(-R*0.15,-R*0.15,R*0.65,R*0.55,0,0,TAU); ctx.moveTo(R*0.35,-R*0.2); ctx.quadraticCurveTo(R*(0.6+long*0.5),-R*0.05,R*(0.6+long*0.45),R*0.25); ctx.lineTo(R*0.2,R*0.45); ctx.lineTo(-R*0.45,R*0.35); ctx.closePath();
  ctx.fillStyle=K.F(K.sil?SIL:(()=>{const g=ctx.createRadialGradient(-R*0.4,-R*0.5,R*0.05,0,0,R*1.2); g.addColorStop(0,'#f2ecdc'); g.addColorStop(0.6,mix('#cfc4a8',K.c2,0.25)); g.addColorStop(1,mix('#6a604a',K.c1,0.3)); return g;})()); ctx.fill(); K.edge(0.3);
  if(!K.sil){ ctx.beginPath(); ctx.ellipse(R*0.05,-R*0.12,R*0.17,R*0.13,0.2,0,TAU); ctx.fillStyle='#1a1610'; ctx.fill(); K.glow(R*0.05,-R*0.12,R*0.18,K.c2,0.6); for(let i=0;i<7;i++){ K.poly([[R*0.2+i*R*0.09*long,R*0.27],[R*0.24+i*R*0.09*long,R*0.42],[R*0.28+i*R*0.09*long,R*0.27]]); ctx.fillStyle='#eae2cc'; ctx.fill(); } K.line([[-R*0.6,-R*0.3],[-R*0.25,-R*0.55],[R*0.1,-R*0.6]],'#000000',K.lw,0.25); } };
M.tooth=K=>{ const {ctx,R}=K; ctx.rotate(-0.25); ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(-R*0.35,-R*0.55); ctx.bezierCurveTo(-R*0.45,R*0.1,-R*0.15,R*0.7,R*0.05,R*1.1); ctx.bezierCurveTo(R*0.12,R*0.6,R*0.4,R*0.0,R*0.35,-R*0.55); ctx.closePath();
  ctx.fillStyle=K.F(K.sil?SIL:(()=>{const g=ctx.createLinearGradient(-R*0.4,0,R*0.4,0); g.addColorStop(0,'#fffaf0'); g.addColorStop(0.5,mix('#e8dcc0',K.c2,0.2)); g.addColorStop(1,'#a89878'); return g;})()); ctx.fill(); K.edge(0.3);
  ctx.beginPath(); ctx.moveTo(-R*0.38,-R*0.55); ctx.bezierCurveTo(-R*0.45,-R*0.8,-R*0.2,-R*1.05,-R*0.05,-R*0.8); ctx.bezierCurveTo(R*0.1,-R*1.05,R*0.4,-R*0.85,R*0.38,-R*0.55); ctx.closePath(); ctx.fillStyle=K.F(mix(K.c1,'#5a4a3a',0.4)); ctx.fill(); if(!K.sil) for(let i=0;i<5;i++) K.line([[-R*0.2+i*R*0.1,-R*0.4],[-R*0.12+i*R*0.06,R*0.5]],'#000000',K.lw*0.8,0.08); };
M.spine=K=>{ const {ctx,R,t}=K; ctx.scale(K.yaw,1); for(let i=0;i<11;i++){ const a=-1.2+i*0.24, x=Math.sin(a+t*0.2)*R*0.55, y=-R*0.95+i*R*0.19, s=R*(0.13-Math.abs(i-5)*0.006);
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.cos(a)*0.6); ctx.beginPath(); ctx.ellipse(0,0,s*1.4,s*0.75,0,0,TAU); ctx.fillStyle=K.body(0,0,s*1.4); ctx.fill(); K.edge(0.3); K.line([[-s*2.3,-s*0.4],[-s*1.2,0]],K.light,K.lw*1.6,0.6); K.line([[s*2.3,-s*0.4],[s*1.2,0]],K.light,K.lw*1.6,0.6); ctx.restore(); } };
M.wing=K=>{ const {ctx,R,c2,t}=K; ctx.scale(K.yaw,1); ctx.rotate(Math.sin(t)*0.05); ctx.beginPath(); ctx.moveTo(-R*0.9,R*0.1); ctx.bezierCurveTo(-R*0.6,-R*0.9,R*0.6,-R*0.9,R*0.95,R*0.05); ctx.bezierCurveTo(R*0.5,R*0.15,R*0.2,R*0.7,0,R*0.85); ctx.bezierCurveTo(-R*0.2,R*0.7,-R*0.5,R*0.15,-R*0.9,R*0.1);
  ctx.fillStyle=K.F(rgba(c2,0.35)); ctx.fill(); K.edge(0.7); if(!K.sil) for(let i=0;i<7;i++){ const a=Math.PI+i/6*Math.PI; K.line([[0,R*0.8],[Math.cos(a)*R*0.9,R*0.05+Math.sin(a)*R*0.75]],K.light,K.lw*1.2,0.5);} };
M.scale=K=>{ const {ctx,R,c2}=K; ctx.rotate(0.2); ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(0,-R*0.95); ctx.bezierCurveTo(R*0.95,-R*0.75,R*0.85,R*0.65,0,R*0.95); ctx.bezierCurveTo(-R*0.85,R*0.65,-R*0.95,-R*0.75,0,-R*0.95); ctx.fillStyle=K.metal(-R,-R,R,R,c2); ctx.fill(); K.edge(0.5);
  if(!K.sil) for(let i=1;i<7;i++){ ctx.beginPath(); ctx.ellipse(0,R*0.95,R*0.13*i,R*0.27*i,0,Math.PI*1.1,Math.PI*1.9); ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=K.lw; ctx.stroke(); } };
M.beak=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); for(const d of[-1,1]){ ctx.beginPath(); ctx.moveTo(-R*0.7,d*R*0.05); ctx.bezierCurveTo(-R*0.6,d*R*0.7,R*0.4,d*R*0.65,R*0.95,d*R*0.05); ctx.bezierCurveTo(R*0.3,d*R*0.2,-R*0.2,d*R*0.15,-R*0.7,d*R*0.05); ctx.fillStyle=K.F(K.sil?SIL:(()=>{const g=ctx.createLinearGradient(-R,0,R,0); g.addColorStop(0,mix(K.c1,'#000000',0.4)); g.addColorStop(1,K.light); return g;})()); ctx.fill(); K.edge(0.4); } K.glow(R*0.95,0,R*0.18,K.c2,0.6); };
M.eye=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.arc(0,0,R*0.88,0,TAU); ctx.fillStyle=K.F(K.sil?SIL:(()=>{const g=ctx.createRadialGradient(-R*0.3,-R*0.3,R*0.1,0,0,R); g.addColorStop(0,'#f4f0ea'); g.addColorStop(1,'#8a8070'); return g;})()); ctx.fill(); K.edge(0.3);
  if(K.sil) return; const px=Math.sin(t)*R*0.12; ctx.beginPath(); ctx.arc(px,0,R*0.5,0,TAU); const g=ctx.createRadialGradient(px,0,R*0.05,px,0,R*0.5); g.addColorStop(0,K.light); g.addColorStop(0.5,c2); g.addColorStop(1,K.dark); ctx.fillStyle=g; ctx.fill();
  for(let i=0;i<24;i++){ const a=i/24*TAU; K.line([[px+Math.cos(a)*R*0.18,Math.sin(a)*R*0.18],[px+Math.cos(a)*R*0.48,Math.sin(a)*R*0.48]],K.dark,K.lw,0.4);} ctx.beginPath(); ctx.ellipse(px,0,R*0.07,R*0.3,0,0,TAU); ctx.fillStyle='#000'; ctx.fill(); K.spec(-R*0.3+px,-R*0.3,R*0.12,R*0.08,-0.6,0.6); };
M.earbone=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(-R*0.2,-R*0.9); ctx.bezierCurveTo(R*0.9,-R*1.0,R*1.0,R*0.3,R*0.3,R*0.85); ctx.bezierCurveTo(-R*0.3,R*1.1,-R*0.9,R*0.4,-R*0.5,R*0.0); ctx.bezierCurveTo(-R*0.2,-R*0.3,R*0.4,-R*0.1,R*0.2,R*0.35); ctx.bezierCurveTo(R*0.0,R*0.55,-R*0.3,R*0.35,-R*0.2,R*0.1);
  ctx.bezierCurveTo(R*0.1,-R*0.5,R*0.5,-R*0.4,R*0.3,-R*0.1); ctx.bezierCurveTo(R*0.6,-R*0.6,R*0.1,-R*0.75,-R*0.2,-R*0.9); ctx.fillStyle=K.F(K.sil?SIL:mix('#e8dcc4',K.c2,0.25)); ctx.fill(); K.edge(0.4); K.shadeOver(); };
M.jelly=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); const p=1+Math.sin(t*2)*0.05; ctx.beginPath(); ctx.moveTo(-R*0.75*p,-R*0.05); ctx.bezierCurveTo(-R*0.8*p,-R*1.0,R*0.8*p,-R*1.0,R*0.75*p,-R*0.05); for(let i=0;i<8;i++) ctx.quadraticCurveTo(R*(0.75-i*0.19)*p,R*0.08,R*(0.65-i*0.19)*p,-R*0.05); ctx.closePath();
  ctx.fillStyle=K.F(rgba(c2,0.3)); ctx.fill(); K.edge(0.7); if(K.sil){ ctx.fillRect(-R*0.5,0,R,R); return; } K.glow(0,-R*0.45,R*0.4,c2,0.6);
  for(let i=0;i<7;i++){ const x=-R*0.6+i*R*0.2, pts=[]; for(let j=0;j<=10;j++) pts.push([x+Math.sin(j*0.7+t*2+i)*R*0.06,R*0.02+j*R*0.1]); K.line(pts,K.light,K.lw*(i%2?1:2),0.55); } };
M.shrimp=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); for(let i=0;i<7;i++){ const a=-0.6+i*0.45, r=R*0.6, x=Math.cos(a)*r, y=Math.sin(a)*r*0.9, s=R*(0.3-i*0.025); ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2); ctx.beginPath(); ctx.ellipse(0,0,s,s*0.55,0,0,TAU); ctx.fillStyle=K.F(rgba(K.c2,0.55)); ctx.fill(); K.edge(0.75); ctx.restore(); }
  if(!K.sil) for(let i=0;i<3;i++) K.line([[R*0.5,-R*0.5],[R*1.0,-R*(0.9+i*0.08)+i*R*0.2]],K.light,K.lw,0.5); };
M.mite=K=>{ const {ctx,R}=K; ctx.scale(K.yaw,1); if(!K.sil) for(let i=0;i<4;i++) for(const d of[-1,1]) K.line([[d*R*0.4,-R*0.2+i*R*0.2],[d*R*0.8,-R*0.4+i*R*0.3],[d*R*0.95,-R*0.1+i*R*0.3]],K.c1,K.lw*2.5);
  ctx.beginPath(); ctx.ellipse(0,R*0.05,R*0.55,R*0.75,0,0,TAU); ctx.fillStyle=K.body(0,0,R*0.75); ctx.fill(); K.edge(0.4); if(!K.sil) for(let i=1;i<6;i++){ ctx.beginPath(); ctx.ellipse(0,-R*0.6+i*R*0.22,R*0.5*Math.sin(i/6*Math.PI)+R*0.05,R*0.06,0,0,Math.PI); ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=K.lw; ctx.stroke(); } K.spec(-R*0.2,-R*0.35,R*0.15,R*0.25,0,0.25); };
M.snail=K=>{ const {ctx,R,t}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.arc(0,0,R*0.9,0,TAU); ctx.fillStyle=K.body(); ctx.fill(); K.edge(0.3); if(K.sil) return; ctx.save(); ctx.rotate(t*0.15); ctx.beginPath(); for(let a=0;a<Math.PI*7;a+=0.08){ const r=R*0.04*Math.exp(0.17*a); a?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(0,0);} ctx.strokeStyle=rgba(K.dark,0.8); ctx.lineWidth=R*0.05; ctx.stroke(); ctx.restore(); K.spec(-R*0.4,-R*0.4,R*0.22,R*0.1); };
M.worms=K=>{ const {ctx,R,rnd}=K; ctx.scale(K.yaw,1); for(let i=0;i<5;i++){ const x=-R*0.6+i*R*0.3+(rnd()-0.5)*R*0.1, h=R*(0.9+rnd()*0.9); ctx.beginPath(); ctx.roundRect(x-R*0.11,R*0.95-h,R*0.22,h,R*0.1); ctx.fillStyle=K.body(x,R*0.95-h/2,h/2); ctx.fill(); K.edge(0.3);
  if(!K.sil){ for(let k=0;k<h/(R*0.12);k++) K.line([[x-R*0.11,R*0.9-k*R*0.12],[x+R*0.11,R*0.88-k*R*0.12]],'#000000',K.lw,0.25); K.glow(x,R*0.95-h,R*0.12,'#ff6a5a',0.8);} } };
M.molt=K=>{ const {ctx,R,c2}=K; ctx.scale(K.yaw,1); for(let i=0;i<8;i++){ const y=-R*0.85+i*R*0.24, w=R*(0.45-Math.abs(i-3)*0.05); ctx.beginPath(); ctx.ellipse(0,y,w,R*0.14,0,0,TAU); ctx.fillStyle=K.F(rgba(c2,0.35)); ctx.fill(); K.edge(0.6); if(!K.sil) for(const d of[-1,1]) K.line([[d*w,y],[d*(w+R*0.25),y+R*0.1]],K.light,K.lw,0.45); } };
M.eggs=K=>{ const {ctx,R,rnd,c2}=K; ctx.scale(K.yaw,1); for(let i=0;i<14;i++){ const a=rnd()*TAU, r=Math.sqrt(rnd())*R*0.7, x=Math.cos(a)*r, y=Math.sin(a)*r*0.8, s=R*(0.15+rnd()*0.1); ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fillStyle=K.F(rgba(c2,0.4)); ctx.fill(); K.edge(0.6); K.dot(x+s*0.2,y+s*0.1,s*0.35,K.dark,0.9); K.spec(x-s*0.35,y-s*0.35,s*0.25,s*0.12); } };
M.embryo=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.arc(0,0,R*0.92,0,TAU); ctx.fillStyle=K.F(rgba(c2,0.15)); ctx.fill(); K.edge(0.6); if(K.sil) return; K.glow(0,0,R*0.8,c2,0.35*(1+0.3*Math.sin(t*2)));

M.lure=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); K.line([[-R*0.8,R*1.0],[-R*0.7,R*0.0],[-R*0.2,-R*0.6],[R*0.3,-R*0.5]],K.c1,R*0.07); K.glow(R*0.35,-R*0.35,R*0.6*(1+0.15*Math.sin(t*3)),c2,0.75); ctx.beginPath(); ctx.arc(R*0.35,-R*0.35,R*0.22,0,TAU); ctx.fillStyle=K.F(K.light); ctx.fill(); K.dot(R*0.35,-R*0.35,R*0.1,'#ffffff'); };

M.wave=(K,v)=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); const scr=['#0a1024','#14081e','#061812','#1a1008'][hash(K.it.id)%4]; ctx.beginPath(); ctx.roundRect(-R,-R*0.62,R*2,R*1.24,R*0.12); ctx.fillStyle=K.F(scr); ctx.fill(); K.edge(0.4); if(K.sil) return;

M.metronome=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(-R*0.6,R*0.95); ctx.lineTo(-R*0.25,-R*0.95); ctx.lineTo(R*0.25,-R*0.95); ctx.lineTo(R*0.6,R*0.95); ctx.closePath(); ctx.fillStyle=K.metal(-R,0,R,0,K.c1); ctx.fill(); K.edge(0.3);

M.codex=K=>tablet(K,(w,h)=>{ const {rnd,c2}=K; for(let r=0;r<11;r++){ const y=-h*0.75+r*h*0.15; let x=-w*0.7; while(x<w*0.65){ const l=K.R*(0.04+rnd()*0.14); K.line([[x,y],[x+l,y]],c2,K.lw*1.6,0.75); if(rnd()>0.7) K.dot(x+l/2,y-K.R*0.04,K.R*0.015,c2,0.8); x+=l+K.R*0.05; } } K.glow(0,0,K.R*0.6,c2,0.15); });

M.cable=K=>{ const {ctx,R,rnd,t}=K; ctx.scale(K.yaw,1); const cols=['#d84a3a','#3a8ad8','#e8c040','#40c070',K.c2]; for(let i=0;i<5;i++){ const pts=[]; for(let j=0;j<=20;j++){ const u=j/20; pts.push([-R*0.95+u*R*1.9,Math.sin(u*4+i)*R*0.12+(i-2)*R*0.08+(u>0.7?(i-2)*(u-0.7)*R*1.4:0)]); }

M.ribbon=K=>{ const {ctx,R,t,c2,light}=K; ctx.scale(K.yaw,1); const N=40, top=[],bot=[]; for(let i=0;i<=N;i++){ const u=i/N, x=-R*0.95+u*R*1.9, y=Math.sin(u*TAU*1.2+t)*R*0.45, tw=(0.07+0.07*Math.cos(u*TAU*1.6+t*1.3))*R; top.push([x,y-tw]); bot.push([x,y+tw]); }

M.needle=K=>{ const {ctx,R}=K; ctx.rotate(0.7); ctx.scale(K.yaw,1); ctx.beginPath(); ctx.moveTo(0,-R*1.2); ctx.lineTo(R*0.09,-R*0.3); ctx.lineTo(R*0.07,R*1.1); ctx.lineTo(-R*0.07,R*1.1); ctx.lineTo(-R*0.09,-R*0.3); ctx.closePath(); ctx.fillStyle=K.metal(-R*0.1,0,R*0.1,0,K.c2); ctx.fill(); K.edge(0.6); for(let i=0;i<3;i++){ ctx.save(); ctx.translate((i-1)*R*0.3,R*(0.2+i*0.15)); ctx.rotate(0.2*(i-1)); ctx.beginPath(); ctx.moveTo(0,-R*0.5); ctx.lineTo(R*0.04,R*0.4); ctx.lineTo(-R*0.04,R*0.4); ctx.closePath(); ctx.fillStyle=K.metal(-R*0.05,0,R*0.05,0,K.c2); ctx.fill(); ctx.restore(); } };

M.comet=K=>{ const {ctx,R,t,c2,light,rnd}=K; ctx.rotate(-0.6+(rnd()-0.5)*0.4); const rev=/retrograde/i.test(K.it.name)?-1:1; if(!K.sil){ for(let i=0;i<3;i++){ const g=ctx.createLinearGradient(R*0.2*rev,0,rev*R*1.35,0); g.addColorStop(0,rgba(i===1?'#9ad8ff':c2,0.7)); g.addColorStop(1,rgba(c2,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-R*0.1*rev,-R*0.2); ctx.quadraticCurveTo(rev*R*0.6,-R*(0.3+i*0.12),rev*R*1.35,-R*(0.35+i*0.25)+R*0.3*i); ctx.lineTo(rev*R*1.35,R*(0.05+i*0.2)); ctx.quadraticCurveTo(rev*R*0.6,R*0.2,-R*0.1*rev,R*0.2); ctx.fill(); }

M.jet=K=>{ const {ctx,R,t,c2,light}=K; ctx.rotate(-0.5); if(!K.sil){ for(const d of[-1,1]){ for(let i=0;i<4;i++){ const y=d*R*(0.3+i*0.22+((t*0.3)%0.22)); K.glow(Math.sin(i*2.1)*R*0.08,y,R*(0.1+i*0.05),i%2?c2:light,0.7-i*0.12); } const g=ctx.createLinearGradient(0,0,0,d*R*1.2); g.addColorStop(0,rgba(c2,0.8)); g.addColorStop(1,rgba(c2,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-R*0.04,0); ctx.lineTo(-R*0.14,d*R*1.2); ctx.lineTo(R*0.14,d*R*1.2); ctx.lineTo(R*0.04,0); ctx.fill(); } }

M.cyclone=K=>{ const {ctx,R,t,c2,light}=K; ctx.scale(K.yaw,1); const hexa=/hexagon/i.test(K.it.name); ctx.beginPath(); ctx.arc(0,0,R*0.92,0,TAU); ctx.fillStyle=K.body(); ctx.fill(); if(K.sil) return; ctx.save(); ctx.clip();

M.fringes=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); ctx.beginPath(); ctx.roundRect(-R*0.95,-R*0.65,R*1.9,R*1.3,R*0.1); ctx.fillStyle=K.F('#060a18'); ctx.fill(); K.edge(0.4); if(K.sil) return; ctx.save(); ctx.clip();

M.warp=K=>{ const {ctx,R,t,c2}=K; ctx.scale(K.yaw,1); if(K.sil){ ctx.beginPath(); ctx.arc(0,0,R*0.95,0,TAU); ctx.fillStyle=SIL; ctx.fill(); return; } const f=(x,y)=>{ const d=Math.hypot(x,y)+0.001, s=1-0.55*Math.exp(-d*d/(R*R*0.18))*(0.8+0.2*Math.sin(t*2)); return [x*s,y*s]; };

// Stars
M.star=(K,v)=>{ const {ctx,R,t,c1,c2,light,rnd}=K;
  const core=(x,y,r,col)=>{ K.glow(x,y,r*2.6,col,0.55); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=K.sil?SIL:(()=>{const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.05,x,y,r); g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,mix(col,'#ffffff',0.4)); g.addColorStop(1,col); return g;})(); ctx.fill(); };

  if(v==='brown'){ ctx.beginPath(); ctx.arc(0,0,R*0.62,0,TAU); ctx.fillStyle=K.body(0,0,R*0.62); ctx.fill(); if(!K.sil){ ctx.save(); ctx.clip(); for(let i=0;i<8;i++){ ctx.fillStyle=rgba(i%2?'#5a2010':'#c06030',0.35); ctx.fillRect(-R,-R*0.62+i*R*0.16+Math.sin(t+i)*R*0.02,R*2,R*0.09);} ctx.restore(); K.glow(0,0,R*0.95,'#ff5a2a',0.25);} return; }
  if(v==='white'){ if(!K.sil){ ctx.save(); ctx.rotate(t*0.2); for(let i=0;i<4;i++){ ctx.rotate(Math.PI/4); const g=ctx.createLinearGradient(-R*1.2,0,R*1.2,0); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(220,235,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.fillRect(-R*1.2,-K.lw*0.7,R*2.4,K.lw*1.4);} ctx.restore(); } core(0,0,R*0.16,'#dfe9ff'); return; }
  if(v==='giant'){ K.glow(0,0,R*1.3,c2,0.5); ctx.beginPath(); for(let i=0;i<=40;i++){ const a=i/40*TAU, r=R*0.85*(1+0.05*Math.sin(a*7+t*2)); ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} ctx.fillStyle=K.body(0,0,R*0.85); ctx.fill(); if(!K.sil) for(let i=0;i<14;i++){ const a=rnd()*TAU,r=rnd()*R*0.65; K.dot(Math.cos(a)*r,Math.sin(a)*r,R*(0.04+rnd()*0.08),K.dark,0.35);} return; }
  if(v==='ember'){ K.blob(11,R*0.55,0.35,1,t*0.1); ctx.fillStyle=K.F(K.sil?SIL:'#1a0e0a'); ctx.fill(); if(!K.sil){ ctx.save(); ctx.clip(); for(let i=0;i<9;i++){ const pts=[[(rnd()-0.5)*R,(rnd()-0.5)*R]]; for(let j=0;j<3;j++) pts.push([pts[j][0]+(rnd()-0.5)*R*0.4,pts[j][1]+(rnd()-0.5)*R*0.4]); K.line(pts,c2,K.lw*2.2,0.6+0.4*Math.sin(t*3+i)); } ctx.restore(); K.glow(0,0,R*0.9,c2,0.35); for(let i=0;i<8;i++) K.dot(Math.sin(i*3+t)*R*0.6,-R*0.6-((t*0.3+i/8)%1)*R*0.5,R*0.02,c2,0.9); } return; }
  if(v==='flare'){ core(0,0,R*0.45,c2); if(!K.sil) for(let i=0;i<3;i++){ const a=-0.5+i*1.8+t*0.1; ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.5,Math.sin(a)*R*0.5,R*0.25,a+Math.PI*0.9,a+Math.PI*2.1); ctx.strokeStyle=rgba(light,0.85); ctx.lineWidth=R*0.06; ctx.stroke(); } return; }
  if(v==='spark'){ if(!K.sil){ ctx.save(); ctx.rotate(t*0.4); for(let i=0;i<12;i++){ ctx.rotate(TAU/12); const l=R*(i%3?0.6:1.1); const g=ctx.createLinearGradient(0,0,l,0); g.addColorStop(0,rgba('#ffffff',0.95)); g.addColorStop(1,rgba(c2,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,-R*0.03); ctx.lineTo(l,0); ctx.lineTo(0,R*0.03); ctx.fill(); } ctx.restore(); } core(0,0,R*0.12,c2); return; }
  if(v==='cradle'){ if(!K.sil){ ctx.save(); ctx.scale(1,0.3); for(let i=5;i>0;i--){ ctx.beginPath(); ctx.arc(0,0,R*(0.3+i*0.14),0,TAU); ctx.strokeStyle=rgba(i%2?c2:c1,0.5); ctx.lineWidth=R*0.08; ctx.stroke(); } ctx.restore(); } core(0,0,R*0.2,light); return; }
  // sun (default) with granulation and spots
  core(0,0,R*0.62,c2); if(!K.sil){ ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*0.62,0,TAU); ctx.clip(); for(let i=0;i<40;i++){ const a=rnd()*TAU, r=rnd()*R*0.6; K.dot(Math.cos(a+t*0.1)*r,Math.sin(a+t*0.1)*r,R*(0.03+rnd()*0.05),i%6?light:K.dark,i%6?0.12:0.45);} ctx.restore(); if(hash(K.it.id)%2){ ctx.save(); ctx.rotate(t*0.2); for(let i=0;i<10;i++){ ctx.rotate(TAU/10); K.line([[R*0.65,0],[R*(0.78+rnd()*0.2),0]],c2,K.lw*2,0.5);} ctx.restore(); } else { for(let i=0;i<3;i++){ const a=rnd()*TAU+t*0.1; ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.66,Math.sin(a)*R*0.66,R*(0.12+rnd()*0.1),a+Math.PI*0.9,a+Math.PI*2.1); ctx.strokeStyle=rgba(light,0.8); ctx.lineWidth=R*0.045; ctx.stroke(); } } } };
// Planets and moons
M.planet=(K,v)=>{ const {ctx,R,t,c1,c2,light,rnd,sil}=K; const pr=R*(0.78+rnd()*0.1);
  const sphere=(x,y,r,fill)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=sil?SIL:fill; ctx.fill(); };
  const terminator=(x,y,r,amt=0.75)=>{ if(sil) return; const g=ctx.createRadialGradient(x-r*0.45,y-r*0.45,r*0.1,x,y,r*1.15); g.addColorStop(0,'rgba(255,255,255,0.12)'); g.addColorStop(0.55,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${amt})`); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); };
  if(v==='twins'){ for(const [x,y,r,c] of [[-R*0.42,R*0.1,R*0.5,c2],[R*0.55,-R*0.3,R*0.35,c1]]){ sphere(x,y,r,K.body(x,y,r)); if(!sil){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip(); for(let i=0;i<5;i++) K.dot(x+(rnd()-0.5)*r,y+(rnd()-0.5)*r,r*(0.08+rnd()*0.12),K.dark,0.35); ctx.restore(); terminator(x,y,r);} } if(!sil) K.line([[-R*0.1,0],[R*0.3,-R*0.2]],c2,K.lw,0.3); return; }
  sphere(0,0,pr,K.body(0,0,pr)); if(sil) return; ctx.save(); ctx.beginPath(); ctx.arc(0,0,pr,0,TAU); ctx.clip(); const spin=t*pr*0.25;
  if(v==='twotone'){ ctx.fillStyle='#0b0b10'; ctx.beginPath(); ctx.ellipse(0,0,pr*Math.cos(t*0.5),pr,0,-Math.PI/2,Math.PI/2); ctx.fill(); ctx.fillRect(0,-pr,pr,pr*2); ctx.fillStyle='#f4f6fa'; ctx.fillRect(-pr,-pr,pr,pr*2); }
  else if(v==='ridge'){ ctx.fillStyle=rgba(K.dark,0.6); ctx.beginPath(); for(let x=-pr;x<=pr;x+=pr/14){ ctx.lineTo(x,-Math.abs(Math.sin(x*9/pr))*pr*0.08);} for(let x=pr;x>=-pr;x-=pr/14) ctx.lineTo(x,pr*0.07); ctx.fill(); K.line([[-pr,0],[pr,0]],light,K.lw*2,0.4); }
  else if(v==='geyser'){ for(let i=0;i<5;i++){ const x=(i-2)*pr*0.18, g=ctx.createLinearGradient(x,pr*0.6,x,pr*0.2); g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x-pr*0.02,pr*0.62); ctx.lineTo(x-pr*0.1,pr*0.15); ctx.lineTo(x+pr*0.1,pr*0.15); ctx.lineTo(x+pr*0.02,pr*0.62); ctx.fill(); } for(let i=0;i<4;i++) K.line([[-pr*0.5+i*pr*0.3,pr*0.1],[-pr*0.4+i*pr*0.3,pr*0.6]],'#3a8ac0',K.lw*1.5,0.6); }
  else if(v==='volcano'){ ctx.fillStyle=rgba('#e0c040',0.35); ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<14;i++){ const x=(rnd()-0.5)*pr*1.6+Math.sin(t*0.3)*pr*0.2, y=(rnd()-0.5)*pr*1.6; K.dot(x,y,pr*(0.05+rnd()*0.08),i%3?'#2a1a10':'#ff6a20',0.85); if(i%3===0) K.glow(x,y,pr*0.15,'#ff8a30',0.6); } }
  else if(v==='ocean'){ ctx.fillStyle=rgba('#1a5ab0',0.5); ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<6;i++){ ctx.beginPath(); ctx.ellipse(((i*0.7+t*0.08)%2-1)*pr*1.2,(rnd()-0.5)*pr*1.4,pr*0.35,pr*0.06,0.1,0,TAU); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill(); } ctx.fillStyle='rgba(240,248,255,0.55)'; ctx.fillRect(-pr,-pr,pr*2,pr*0.22); ctx.fillRect(-pr,pr*0.82,pr*2,pr*0.2); }
  else if(v==='lakes'){ ctx.fillStyle=rgba('#c07a20',0.4); ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<6;i++){ ctx.save(); ctx.translate((rnd()-0.5)*pr*1.2,-pr*0.4-rnd()*pr*0.4); K.blob(8,pr*(0.1+rnd()*0.12),0.6,0.7,0); ctx.fillStyle='rgba(10,10,20,0.8)'; ctx.fill(); ctx.restore(); } }
  else if(v==='glass'){ ctx.fillStyle=rgba(c2,0.25); ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<9;i++){ const a=rnd()*TAU; K.line([[0,0],[Math.cos(a)*pr,Math.sin(a)*pr]],'#ffffff',K.lw,0.35); } for(let i=0;i<5;i++) K.line([[-pr,(rnd()-0.5)*pr*1.6],[pr,(rnd()-0.5)*pr*1.6]],light,K.lw*0.8,0.2); }
  else if(v==='gem'){ for(let i=0;i<10;i++){ const x=(rnd()-0.5)*pr*1.6, y=(rnd()-0.5)*pr*1.6, s=pr*(0.08+rnd()*0.14); K.poly([[x,y-s],[x+s*0.7,y],[x,y+s],[x-s*0.7,y]]); ctx.fillStyle=rgba(['#ff5a8a','#5ab0ff','#7affb0','#ffd05a'][i%4],0.75); ctx.fill(); K.line([[x,y-s],[x,y+s]],'#ffffff',K.lw*0.8,0.5); } }
  else if(v==='spot'){ for(let i=0;i<9;i++){ ctx.fillStyle=rgba(i%2?'#e0b080':'#b07040',0.45); ctx.fillRect(-pr*2+((spin+i*20)%(pr*0.5)),-pr+i*pr*0.23,pr*4,pr*0.13);} ctx.save(); ctx.translate(pr*0.2,pr*0.25); ctx.rotate(-t*0.5); ctx.beginPath(); ctx.ellipse(0,0,pr*0.32,pr*0.16,0,0,TAU); ctx.fillStyle='#b03a20'; ctx.fill(); ctx.beginPath(); ctx.ellipse(0,0,pr*0.18,pr*0.08,0,0,TAU); ctx.fillStyle='#e07040'; ctx.fill(); ctx.restore(); }
  else if(v==='earth'){ ctx.fillStyle=rgba('#1a4a9a',0.6); ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<4;i++){ ctx.save(); ctx.translate(((i*0.55+t*0.06)%2-1)*pr*1.2,(rnd()-0.5)*pr); K.blob(9,pr*(0.2+rnd()*0.15),0.7,0.8,0); ctx.fillStyle='#3a8a4a'; ctx.fill(); ctx.restore(); } for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse((rnd()-0.5)*pr*1.4,(rnd()-0.5)*pr*1.4,pr*0.3,pr*0.05,0.2,0,TAU); ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill(); } }
  else if(v==='ice'){ ctx.fillStyle='rgba(220,240,255,0.35)'; ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<10;i++){ const x=(rnd()-0.5)*pr*2, y=(rnd()-0.5)*pr*2; K.line([[x,y],[x+(rnd()-0.5)*pr*0.8,y+(rnd()-0.5)*pr*0.8]],'#7ab0e0',K.lw*1.2,0.6);} }
  else if(v==='rogue'){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(-pr,-pr,pr*2,pr*2); for(let i=0;i<5;i++){ ctx.fillStyle=rgba(c2,0.2); ctx.fillRect(-pr,-pr+i*pr*0.4+pr*0.1,pr*2,pr*0.08);} }
  else if(v==='molten'){ for(let i=0;i<10;i++){ const pts=[[(rnd()-0.5)*pr*2,(rnd()-0.5)*pr*2]]; for(let j=0;j<4;j++) pts.push([pts[j][0]+(rnd()-0.5)*pr*0.5,pts[j][1]+(rnd()-0.5)*pr*0.5]); K.line(pts,'#ff8a2a',K.lw*2.5,0.8);} }
  else { // craters (default moon)
    const n=v==='craters'&&/saturated/i.test(K.it.name)?40:10+Math.floor(rnd()*10); for(let i=0;i<n;i++){ const x=(rnd()-0.5)*pr*1.9+Math.sin(t*0.3)*pr*0.1, y=(rnd()-0.5)*pr*1.9, r=pr*(0.04+rnd()*(n>30?0.1:0.16)); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fill(); ctx.beginPath(); ctx.arc(x-r*0.15,y-r*0.15,r*0.82,0,TAU); ctx.fillStyle=rgba(light,0.12); ctx.fill(); } }
  ctx.restore(); terminator(0,0,pr,v==='twotone'?0.3:0.75); ctx.beginPath(); ctx.arc(0,0,pr,0,TAU); ctx.strokeStyle=rgba(light,0.3); ctx.lineWidth=K.lw; ctx.stroke();
  if(v==='satellite'){ const a=t*1.2, x=Math.cos(a)*R*1.05, y=Math.sin(a)*R*0.35; if(Math.sin(a)>-0.2){ ctx.beginPath(); ctx.arc(x,y,R*0.12,0,TAU); ctx.fillStyle=K.body(x,y,R*0.12); ctx.fill(); } }
  if(v==='geyser') K.glow(0,-pr*0.95,pr*0.4,'#dff4ff',0.35); };
M.asteroid=K=>{ const {ctx,R,t,rnd}=K; ctx.scale(K.yaw,1); const potato=/potato/i.test(K.it.name), rubble=/rubble/i.test(K.it.name);
  if(rubble){ for(let i=0;i<9;i++){ const a=rnd()*TAU, r=rnd()*R*0.5; ctx.save(); ctx.translate(Math.cos(a)*r,Math.sin(a)*r*0.8); K.blob(7,R*(0.18+rnd()*0.15),0.5,0.85,rnd()*3); ctx.fillStyle=K.body(0,0,R*0.3); ctx.fill(); K.edge(0.2); ctx.restore(); } return; }
  ctx.rotate(t*0.15); K.blob(14,R*(potato?0.92:0.8),0.18,potato?0.58:0.75,0); ctx.fillStyle=K.body(); ctx.fill(); if(!K.sil){ ctx.save(); ctx.clip(); for(let i=0;i<12;i++){ const x=(rnd()-0.5)*R*1.6, y=(rnd()-0.5)*R, r=R*(0.04+rnd()*0.12); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill(); } ctx.restore(); K.shadeOver(); } K.edge(0.25);
  if(/trojan/i.test(K.it.name)&&!K.sil) for(let i=0;i<30;i++){ const a=rnd()*TAU; K.dot(Math.cos(a)*R*(1+rnd()*0.2),Math.sin(a)*R*0.6*(1+rnd()*0.2),R*0.012,'#c8b8a0',0.6); } };
// Rocks and minerals
M.nugget=K=>{ const {ctx,R,rnd,c2}=K; ctx.scale(K.yaw,1); const lumps=[]; for(let i=0;i<6;i++) lumps.push([(rnd()-0.5)*R*0.9,(rnd()-0.5)*R*0.6,R*(0.3+rnd()*0.25)]);
  for(const [x,y,r] of lumps){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=K.sil?SIL:(()=>{const g=ctx.createRadialGradient(x-r*0.4,y-r*0.4,r*0.05,x,y,r); const m=mix(c2,'#f0e0a0',0.25); g.addColorStop(0,'#ffffff'); g.addColorStop(0.25,m); g.addColorStop(0.75,mix(m,'#000000',0.4)); g.addColorStop(1,mix(m,'#000000',0.7)); return g;})(); ctx.fill(); } };
M.brick=K=>{ const {ctx,R,rnd}=K; const a=0.5, w=R*0.75, h=R*0.42, d=R*0.4; ctx.translate(0,R*0.1); K.poly([[-w,-h],[w,-h],[w+d,-h-d*0.6],[-w+d,-h-d*0.6]]); ctx.fillStyle=K.F(mix(K.c2,'#ffffff',0.1)); ctx.fill(); K.poly([[w,-h],[w+d,-h-d*0.6],[w+d,h-d*0.6],[w,h]]); ctx.fillStyle=K.F(K.dark); ctx.fill(); ctx.beginPath(); ctx.rect(-w,-h,w*2,h*2); ctx.fillStyle=K.body(0,0,w); ctx.fill(); K.edge(0.3);
  if(!K.sil){ for(let i=0;i<4;i++) K.line([[-w,-h+i*h*0.5+(rnd()-0.5)*h*0.1],[w,-h+i*h*0.5+(rnd()-0.5)*h*0.1]],'#000000',K.lw*1.5,0.2); for(let i=0;i<6;i++) K.line([[(rnd()-0.5)*w*2,-h-d*0.3],[(rnd()-0.5)*w*2+R*0.05,-h-d*0.55]],'#5aa060',K.lw*1.5,0.9); } };
M.core=K=>{ const {ctx,R,rnd}=K; ctx.rotate(-0.25); ctx.scale(K.yaw,1); const w=R*0.38; ctx.beginPath(); ctx.rect(-w,-R*0.9,w*2,R*1.8); ctx.fillStyle=K.body(0,0,R); ctx.fill(); if(!K.sil){ ctx.save(); ctx.clip(); let y=-R*0.9; while(y<R*0.9){ const h=R*(0.06+rnd()*0.22); ctx.fillStyle=rgba([K.c1,K.c2,K.light,'#ffffff',K.dark][Math.floor(rnd()*5)],0.5); ctx.fillRect(-w,y,w*2,h); y+=h; } ctx.restore(); }
  K.edge(0.3); for(const y of[-1,1]){ ctx.beginPath(); ctx.ellipse(0,y*R*0.9,w,R*0.1,0,0,TAU); ctx.fillStyle=K.F(y<0?K.light:K.dark); ctx.fill(); } };
M.plate=K=>{ const {ctx,R,rnd,c2}=K; ctx.rotate(-0.2+(rnd()-0.5)*0.3); ctx.scale(K.yaw,1); const n=7, pts=[]; for(let i=0;i<n;i++){ const a=i/n*TAU+rnd()*0.4; pts.push([Math.cos(a)*R*(0.75+rnd()*0.25),Math.sin(a)*R*(0.55+rnd()*0.2)]); }
  K.poly(pts); ctx.fillStyle=/tile|panel|shielding|patch/i.test(K.it.name)?K.metal(-R,-R,R,R,K.c2):K.body(); ctx.fill(); K.edge(0.4); if(K.sil) return; ctx.save(); K.poly(pts); ctx.clip();
  if(/scorched|crust/i.test(K.it.name)){ for(let i=0;i<8;i++){ ctx.beginPath(); ctx.arc((rnd()-0.5)*R*1.6,(rnd()-0.5)*R,R*(0.15+rnd()*0.3),0,TAU); ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill(); } }
  else { for(let i=0;i<4;i++) K.line([[-R,-R*0.4+i*R*0.27],[R,-R*0.4+i*R*0.27]],'#000000',K.lw*1.5,0.3); for(let i=0;i<10;i++) K.dot(-R*0.75+i*R*0.17,-R*0.35,R*0.025,'#ffffff',0.4); if(/patch/i.test(K.it.name)){ ctx.beginPath(); ctx.arc(R*0.1,R*0.1,R*0.25,0,TAU); ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=K.lw*2; ctx.stroke(); } if(/reactor|shielding/i.test(K.it.name)) K.glow(0,0,R*0.4,'#a0ff5a',0.4); }
  ctx.restore(); };
M.pile=K=>{ const {ctx,R,rnd}=K; ctx.scale(K.yaw,1); const n=/soil/i.test(K.it.name)?0:40; ctx.beginPath(); ctx.moveTo(-R*0.95,R*0.7); ctx.quadraticCurveTo(-R*0.4,-R*0.3,0,-R*0.35); ctx.quadraticCurveTo(R*0.4,-R*0.3,R*0.95,R*0.7); ctx.closePath(); ctx.fillStyle=K.body(0,R*0.2,R); ctx.fill();
  if(!K.sil) for(let i=0;i<70;i++){ const x=(rnd()-0.5)*R*1.7, y=R*0.7-rnd()*R*(1.0-Math.abs(x)/R*0.9); K.dot(x,y,R*(0.015+rnd()*0.04),rnd()>0.5?K.light:K.dark,0.7); } for(let i=0;i<5;i++){ ctx.save(); ctx.translate((rnd()-0.5)*R*1.6,R*(0.65+rnd()*0.15)); K.blob(6,R*(0.06+rnd()*0.06),0.5,0.8,0); ctx.fillStyle=K.body(0,0,R*0.1); ctx.fill(); ctx.restore(); } };
M.grains=K=>{ const {ctx,R,rnd,c2}=K; const n=5+Math.floor(rnd()*6); for(let i=0;i<n;i++){ const a=i/n*TAU+rnd(), r=i?R*(0.35+rnd()*0.3):0, x=Math.cos(a)*r, y=Math.sin(a)*r*0.8, s=R*(i?0.12+rnd()*0.12:0.3);
  ctx.save(); ctx.translate(x,y); K.blob(7,s,0.35,0.85,rnd()*3); ctx.fillStyle=K.sil?SIL:(()=>{const g=ctx.createRadialGradient(-s*0.4,-s*0.4,s*0.05,0,0,s); g.addColorStop(0,'#ffffff'); g.addColorStop(0.3,c2); g.addColorStop(1,K.dark); return g;})(); ctx.fill(); ctx.restore(); } };
M.magnet=K=>{ const {ctx,R,rnd,t}=K; ctx.scale(K.yaw,1); K.blob(10,R*0.5,0.3,0.85,0); ctx.fillStyle=K.metal(-R*0.5,-R*0.5,R*0.5,R*0.5,'#40444c'); ctx.fill(); K.edge(0.3);
  if(!K.sil) for(let i=0;i<14;i++){ const a=i/14*TAU; ctx.beginPath(); for(let k=0;k<=12;k++){ const u=k/12, r=R*(0.5+u*0.45), aa=a+Math.sin(u*Math.PI)*0.25; k?ctx.lineTo(Math.cos(aa)*r,Math.sin(aa)*r):ctx.moveTo(Math.cos(aa)*r,Math.sin(aa)*r);} ctx.strokeStyle='rgba(180,190,210,0.5)'; ctx.lineWidth=K.lw*0.8; ctx.setLineDash([K.lw*1.5,K.lw*2]); ctx.stroke(); ctx.setLineDash([]); } };
M.snowflake=K=>{ const {ctx,R,t,c2,rnd}=K; ctx.rotate(t*0.15); const arms=6, br=2+Math.floor(rnd()*3); if(K.sil){ ctx.beginPath(); ctx.arc(0,0,R*0.9,0,TAU); ctx.fillStyle=SIL; ctx.fill(); return; } K.glow(0,0,R*0.6,c2,0.35);
  for(let i=0;i<arms;i++){ ctx.save(); ctx.rotate(i/arms*TAU); K.line([[0,0],[0,-R*0.95]],K.light,K.lw*3); for(let b=1;b<=br;b++){ const y=-R*0.95*b/(br+1), l=R*0.32*(1-b/(br+2)); K.line([[0,y],[l,y-l*0.8]],K.light,K.lw*2); K.line([[0,y],[-l,y-l*0.8]],K.light,K.lw*2); } ctx.restore(); } ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; ctx.lineTo(Math.cos(a)*R*0.18,Math.sin(a)*R*0.18);} ctx.closePath(); ctx.fillStyle=rgba(c2,0.6); ctx.fill(); };
M.lattice=K=>{ const {ctx,R,t,c2}=K; const morse=/morse/i.test(K.it.name); const pts=[]; for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){ const a=t*0.5, X=x*Math.cos(a)-z*Math.sin(a), Z=x*Math.sin(a)+z*Math.cos(a); const b=0.5, Y=y*Math.cos(b)-Z*Math.sin(b), Z2=y*Math.sin(b)+Z*Math.cos(b); pts.push({x:X*R*0.5,y:Y*R*0.5,z:Z2,i:[x,y,z]}); }
  if(K.sil){ ctx.beginPath(); ctx.arc(0,0,R*0.95,0,TAU); ctx.fillStyle=SIL; ctx.fill(); return; } for(const p of pts) for(const q of pts){ const d=Math.abs(p.i[0]-q.i[0])+Math.abs(p.i[1]-q.i[1])+Math.abs(p.i[2]-q.i[2]); if(d===1&&p.i<q.i) K.line([[p.x,p.y],[q.x,q.y]],c2,K.lw*1.3,0.35+0.25*(p.z+q.z+2)/4); }
  pts.sort((a,b)=>a.z-b.z).forEach((p,i)=>{ const r=R*(0.05+0.03*(p.z+1)); if(morse&&i%3===0){ ctx.fillStyle=rgba(K.light,0.9); ctx.fillRect(p.x-r*1.6,p.y-r*0.5,r*3.2,r); } else { K.glow(p.x,p.y,r*2.5,c2,0.4); K.dot(p.x,p.y,r,K.light); } }); };
M.gem=K=>{ const {ctx,R,t,c2,light,rnd}=K; ctx.scale(K.yaw,1); const cut=Math.floor(rnd()*3); const w=R*0.8, top=-R*0.35, crown=-R*0.7, bot=R*0.85;
  const n=cut===0?8:cut===1?6:10, pts=[]; for(let i=0;i<=n;i++){ const x=-w+i/n*w*2; pts.push(x); }
  ctx.beginPath(); ctx.moveTo(-w,top); ctx.lineTo(-w*0.6,crown); ctx.lineTo(w*0.6,crown); ctx.lineTo(w,top); ctx.lineTo(0,bot); ctx.closePath(); ctx.fillStyle=K.sil?SIL:(()=>{const g=ctx.createLinearGradient(-w,crown,w,bot); g.addColorStop(0,light); g.addColorStop(0.5,c2); g.addColorStop(1,K.dark); return g;})(); ctx.fill(); K.edge(0.7);

// ===== Cinematic crate: a lit 3D crate that drops in, unlatches, vents and blows its lid; the relic later rises out of it =====
const DR={};
const mixC=(a,b,t)=>{ const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16); const r=(A>>16)+((B>>16)-(A>>16))*t, g=((A>>8)&255)+(((B>>8)&255)-((A>>8)&255))*t, bl=(A&255)+((B&255)-(A&255))*t; return `rgb(${r|0},${g|0},${bl|0})`; };
const mixHex=(a,b,t)=>{ const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16); const ch=k=>Math.round(((A>>k)&255)+(((B>>k)&255)-((A>>k)&255))*t).toString(16).padStart(2,'0'); return '#'+ch(16)+ch(8)+ch(0); };
const shadeHex=(hex,k)=>{ const A=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v*k))); return `rgb(${f(A>>16)},${f((A>>8)&255)},${f(A&255)})`; };
const easeOutBack=p=>{ const c=1.9; return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
const BW=1.0, BD=0.72, BY0=-0.62, BY1=0.28, LY1=0.6;   // crate half-width, half-depth, body bottom/top, lid top
function camRot(p,cam){ const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw); const x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy; const cp=Math.cos(cam.pitch),spp=Math.sin(cam.pitch); return {x,y:p.y*cp-z*spp,z:p.y*spp+z*cp}; }
function proj(p,cam){ const c=camRot(p,cam), zc=cam.dist-c.z, s=cam.f/zc*cam.zoom; return {x:cam.cx+cam.sx+c.x*s, y:cam.cy+cam.sy-c.y*s, z:zc, s, c}; }
function boxFaces(x0,x1,y0,y1,z0,z1,xf,tag){ const P=(x,y,z)=>xf({x,y,z});
  return [['front',[P(x0,y1,z1),P(x1,y1,z1),P(x1,y0,z1),P(x0,y0,z1)],x1-x0,y1-y0],['back',[P(x1,y1,z0),P(x0,y1,z0),P(x0,y0,z0),P(x1,y0,z0)],x1-x0,y1-y0],
    ['right',[P(x1,y1,z1),P(x1,y1,z0),P(x1,y0,z0),P(x1,y0,z1)],z1-z0,y1-y0],['left',[P(x0,y1,z0),P(x0,y1,z1),P(x0,y0,z1),P(x0,y0,z0)],z1-z0,y1-y0],
    ['top',[P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],x1-x0,z1-z0],['bottom',[P(x0,y0,z1),P(x1,y0,z1),P(x1,y0,z0),P(x0,y0,z0)],x1-x0,z1-z0]].map(([k,q,fw,fh])=>({k,q,fw,fh,tag})); }
const cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}), norm=v=>{ const l=Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/l,y:v.y/l,z:v.z/l}; };
const LDIR=norm({x:-0.45,y:0.85,z:0.55});

DR.scene=function(cs){ const W=innerWidth,H=innerHeight; const st=document.getElementById('stage'); const c=document.createElement('canvas'); c.className='fx cine'; c.style.zIndex=2; const dp=Math.min(2,devicePixelRatio||1); c.width=W*dp; c.height=H*dp; st.appendChild(c); const x=c.getContext('2d'); x.scale(dp,dp);
  const em=document.createElement('canvas'); em.width=256; em.height=222; CR.drawCrate(em.getContext('2d'),cs,256,222,0.6);
  const small=Math.min(W*1.45,H); // portrait phones get a closer camera
  const S={cs,W,H,c,x,em,dark:cs.theme[0],lightC:cs.theme[1],cam:{yaw:-0.62,pitch:0.4,dist:5.4,f:small*0.9,zoom:1,cx:W/2,cy:H*0.56,sx:0,sy:0},
    lift:0,lidA:0,seam:0,rays:0,rayC:cs.theme[1],wob:0,tremble:0,latch:[0,0,0],parts:[],dim:1,alpha:1,item:null,itemY:0,itemS:0,itemGlow:0,bolts:0,rainbow:false,spot:0,t:0,shake:0};

DR.shake=(S,amt)=>{ S.shake=Math.max(S.shake,amt); };
function xform(S){ const wob=S.wob, lift=S.lift; const cw=Math.cos(wob), sw=Math.sin(wob);
  return p=>({x:p.x*cw-(p.y-BY0)*sw, y:BY0+(p.y-BY0)*cw+p.x*sw+lift, z:p.z}); }
function lidX(S){ const base=xform(S), a=S.lidA, ca=Math.cos(a), sa=Math.sin(a); // hinge along the back top edge of the body
  return p=>{ const ry=p.y-BY1, rz=p.z+BD; return base({x:p.x, y:BY1+ry*ca+rz*sa, z:-BD-ry*sa+rz*ca}); }; }
function faceVis(f,cam){ const q=f.q.map(p=>camRot(p,cam)); const n=norm(cross(sub(q[3],q[0]),sub(q[1],q[0]))); const ctr={x:(q[0].x+q[2].x)/2,y:(q[0].y+q[2].y)/2,z:(q[0].z+q[2].z)/2};

// Draw a face, then its details in face-local units (0..fw across, 0..fh down) through an affine map.
function drawFace(S,f,info){ const {x,cam}=S, P=f.q.map(p=>proj(p,cam)); const lit=0.3+0.7*Math.max(0,info.n.x*LDIR.x+info.n.y*LDIR.y+info.n.z*LDIR.z);

  const interior=(f.tag==='body'&&f.k==='top')||(f.tag==='lid'&&f.k==='bottom');
  const metal=mixHex(S.dark,'#8a93a6',0.42);
  if(interior){ x.fillStyle='#04050a'; x.fill(); } else { const g=x.createLinearGradient(P[0].x,P[0].y,P[3].x,P[3].y); g.addColorStop(0,shadeHex(metal,lit*1.15)); g.addColorStop(1,shadeHex(metal,lit*0.8)); x.fillStyle=g; x.fill(); }
  x.clip(); const a=P[1].x-P[0].x,b=P[1].y-P[0].y,c2=P[3].x-P[0].x,d=P[3].y-P[0].y; x.transform(a,b,c2,d,P[0].x,P[0].y); x.scale(1/f.fw,1/f.fh);

  if(interior){ const g=x.createRadialGradient(fw/2,fh/2,0,fw/2,fh/2,fw*0.7); g.addColorStop(0,CR.rgba(S.rayC,0.9*S.rays)); g.addColorStop(1,CR.rgba(S.rayC,0.05*S.rays)); x.fillStyle=g; x.fillRect(0,0,fw,fh);
    x.strokeStyle=Dk(0.6); x.lineWidth=0.05; x.strokeRect(0.04,0.04,fw-0.08,fh-0.08); x.restore(); return; }
  // bevelled border and inset panel
  x.lineWidth=0.035; x.strokeStyle=L(0.35); x.strokeRect(0.02,0.02,fw-0.04,fh-0.04); x.strokeStyle=Dk(0.45); x.lineWidth=0.025; x.strokeRect(0.12,0.12,fw-0.24,fh-0.24);

async function ascendCinematic(dustN,count){ const stage=$('#stage'); stage.className='on ascstage'; stage.innerHTML=`<canvas class="fx" id="ascfx"></canvas><div class="asctext"><div class="k">Ascension</div><div class="n">${ROMAN(count)}</div><div class="d">+${CR.fmt(dustN)} Stardust</div></div><button class="btn ghost skip" id="ascskip">Continue</button>`;
  CR.sfx.rise(2.4); setTimeout(()=>CR.sfx.boom(),2300); setTimeout(()=>CR.sfx.reveal(9),2400);
  const cv=$('#ascfx'), W=innerWidth,H=innerHeight,dp=devicePixelRatio; cv.width=W*dp; cv.height=H*dp; const x=cv.getContext('2d'); x.scale(dp,dp);
  const ps=[...Array(260)].map(()=>({x:Math.random()*W,y:H+Math.random()*H,v:1+Math.random()*4,s:0.5+Math.random()*2.2,h:40+Math.random()*30}));
  let done=false; const finish=()=>{ if(done) return; done=true; CR.closeStage(); go('dashboard'); toast(`Ascension ${ROMAN(count)} complete. ${CR.fmt(dustN)} Stardust gained.`,'good'); };
  $('#ascskip').onclick=finish; const t0=performance.now();
  (function f(now){ if(done||!cv.isConnected) return; const t=Math.max(0,(now-t0)/1000); x.fillStyle='rgba(255,250,235,0.08)'; x.fillRect(0,0,W,H); x.fillStyle=`rgba(255,250,240,${Math.min(0.9,t*0.25)})`; x.fillRect(0,0,W,H);
    for(const p of ps){ p.y-=p.v*(1+t*0.8); if(p.y<-10){p.y=H+10;p.x=Math.random()*W;} x.fillStyle=`hsla(${p.h},100%,${55+Math.min(t*8,30)}%,0.9)`; x.fillRect(p.x,p.y,p.s,p.s*4); }
    const g=x.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,60+t*220); g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(1,'rgba(255,220,150,0)'); x.fillStyle=g; x.beginPath(); x.arc(W/2,H*0.45,60+t*220,0,7); x.fill();
    if(t<6.5) requestAnimationFrame(f); else finish(); })(t0);
  if(S.settings.reduced||S.settings.skip) finish(); }

const MAPPOS={};
V.starmap=()=>{ const R=CR.regions(), here=[...R].reverse().find(r=>r.open), sel=R.find(r=>r.name===st.region)||here||R[0];
  const W=1000,H=620,cx=500,cy=320; const n=R.filter(r=>!r.hub).length, P=[]; // nodes along an outward spiral, evenly spaced by arc length, so any number of regions fits
  { const r0=118, r1=292, turns=n>15?2.05:1.45, th1=turns*Math.PI*2, pt=th=>{ const r=r0+(r1-r0)*th/th1; return [cx+Math.cos(th-2.4)*r*1.52, cy+Math.sin(th-2.4)*r*0.92]; };
    let len=0, prev=pt(0); const samp=[[0,0]]; for(let i=1;i<=600;i++){ const th=th1*i/600, p=pt(th); len+=Math.hypot(p[0]-prev[0],p[1]-prev[1]); samp.push([th,len]); prev=p; }
    for(let k=0;k<n;k++){ const target=len*k/Math.max(1,n-1); const s=samp.find(x=>x[1]>=target)||samp[samp.length-1]; const p=pt(s[0]); P.push([Math.round(p[0]),Math.round(p[1])]); } }
  let k=0; R.forEach(r=>{ MAPPOS[r.name]=r.hub?[cx,cy+5]:P[Math.min(k++,P.length-1)]; });
  const rnd=(s=>()=>{s=(s*16807)%2147483647;return s/2147483647;})(7);
  const stars=[...Array(160)].map(()=>`<circle cx="${(rnd()*W).toFixed(1)}" cy="${(rnd()*H).toFixed(1)}" r="${(rnd()*1.3+0.2).toFixed(2)}" opacity="${(0.25+rnd()*0.6).toFixed(2)}"/>`).join('');
  const route=R.filter(r=>!r.hub); const path=route.map((r,i)=>{ if(!i) return ''; const [x1,y1]=MAPPOS[route[i-1].name], [x2,y2]=MAPPOS[r.name]; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="route ${r.open?'open':''}"/>`; }).join('');
  const nodes=R.map(r=>{ const [x,y]=MAPPOS[r.name], isHere=r===here, isSel=r===sel, fresh=r.open&&!S.regionsSeen?.[r.name];
    return `<g class="node ${r.open?'open':'locked'} ${isSel?'sel':''}" data-a="region" data-v="${esc(r.name)}" style="--nc:${r.color}" tabindex="0" role="button" aria-label="${esc(r.name)}${r.open?'':' (locked)'}">
      <circle class="halo" cx="${x}" cy="${y}" r="${r.hub?46:30}"/><circle class="core" cx="${x}" cy="${y}" r="${r.hub?16:10}"/>${isHere?`<circle class="here" cx="${x}" cy="${y}" r="20"/>`:''}
      <text x="${x}" y="${y+(r.hub?40:30)}" class="lbl">${esc(r.name)}</text><text x="${x}" y="${y+(r.hub?55:45)}" class="sub">${r.open?`${Math.round(r.frac*100)}% charted`:`Level ${r.level}`}</text>${fresh?`<text x="${x}" y="${y-22}" class="newtag">NEW</text>`:''}</g>`; }).join('');
  const cols=sel.cols.map(id=>{ const p=CR.colProgress(id); return `<div class="mcol"><div class="spread"><span>${esc(CR.colById[id].name)}</span><span class="muted tab">${p.have}/${p.total}</span></div><div class="bar"><i style="width:${p.frac*100}%"></i></div></div>`; }).join('');
  return `<div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" class="starmap" role="img" aria-label="Star map">
    <defs><radialGradient id="gal" cx="50%" cy="52%" r="60%"><stop offset="0" stop-color="#fff2d0" stop-opacity=".35"/><stop offset=".15" stop-color="#a08aff" stop-opacity=".22"/><stop offset=".5" stop-color="#3a3a9a" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#gal)"/><g filter="url(#blur)" opacity=".5"><path d="M500 320 C 650 220, 820 300, 900 460" stroke="#7a6aff" stroke-width="40" fill="none"/><path d="M500 320 C 350 420, 180 340, 100 180" stroke="#4ad0ff" stroke-width="40" fill="none"/></g>
    <g fill="#dfe6ff">${stars}</g>${path}${nodes}</svg>
   <aside class="panel mapinfo" style="--nc:${sel.color}"><div class="kicker">${sel.open?(sel===here?'You are here':'Charted'):'Uncharted'}</div><h2>${esc(sel.name)}</h2>
    ${sel.open?`<div class="spread" style="margin:8px 0 4px"><span class="muted">Region charted</span><b>${Math.round(sel.frac*100)}%</b></div><div class="bar" style="height:6px"><i style="width:${sel.frac*100}%"></i></div>`:`<p class="muted" style="margin-top:6px">${sel.reqs}</p>`}
    <h4>Crates</h4><div class="mcrates">${sel.crates.map(c=>{ const ok=CR.level().level>=c.level&&CR.reqStatus(c).ok; return `<button class="mcrate ${ok?'':'locked'}" data-a="crate" data-v="${c.id}" style="--t1:${c.theme[0]};--t2:${c.theme[1]}"><canvas data-crate="${c.id}"></canvas><span><b>${esc(c.name)}</b><small>${c.free?'Free':cr(c.cost)}${ok?'':` · Level ${c.level}`}</small></span></button>`; }).join('')}</div>
    ${cols?`<h4>Collections found here</h4>${cols}`:''}
   </aside></div>`;
};

async function fuseCinematic(res,xs){ const stage=$('#stage'); stage.className='on'; stage.innerHTML='<div class="title">FUSION CHAMBER</div><canvas class="fx" id="fusefx"></canvas>';
  const cv=$('#fusefx'), W=innerWidth,H=innerHeight,dp=devicePixelRatio; cv.width=W*dp; cv.height=H*dp; const x=cv.getContext('2d'); x.scale(dp,dp);
  const ims=xs.map(i=>{ const m=new Image(); m.src=CR.thumbX(i); return m; }); const skip=S.settings.skip||S.settings.reduced; CR.sfx.charge(skip?0.2:2); CR.sfx.rumble(skip?0.2:2);
  const t0=performance.now(), dur=skip?200:2200;
  await new Promise(done=>{ (function f(now){ const p=Math.max(0,Math.min(1,(now-t0)/dur)), e=p*p; x.clearRect(0,0,W,H); const cx=W/2,cy=H*0.45;
    const g=x.createRadialGradient(cx,cy,0,cx,cy,80+e*220); g.addColorStop(0,`rgba(255,240,200,${0.2+e*0.8})`); g.addColorStop(1,'rgba(160,110,255,0)'); x.fillStyle=g; x.beginPath(); x.arc(cx,cy,80+e*220,0,7); x.fill();
    ims.forEach((m,i)=>{ const a=i/ims.length*Math.PI*2+e*Math.PI*6, r=230*(1-e), s=120*(1-e*0.6); x.save(); x.globalAlpha=1-e*0.3; x.drawImage(m,cx+Math.cos(a)*r-s/2,cy+Math.sin(a)*r*0.6-s/2,s,s); x.restore(); });
    for(let k=0;k<30;k++){ const a=Math.random()*7, r=Math.random()*260*(1-e); x.fillStyle='rgba(220,200,255,0.8)'; x.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2,2); }
    p<1?requestAnimationFrame(f):done(); })(t0); });
  if(res.nothing){ CR.sfx.error(); x.clearRect(0,0,W,H); stage.insertAdjacentHTML('beforeend',`<div class="reveal enter" style="--rc:#7a86a8"><div class="rt2">NO REACTION</div><div class="rn">The relics resist each other</div><p class="rdesc">Nothing was used up. Try a different combination, or follow a hint in the recipe book.</p><div class="acts"><button class="btn primary" id="fok">Back to the chamber</button></div></div>`); $('#fok').onclick=()=>{CR.closeStage(); render();}; return; }
  CR.sfx.boom(); const d=CR.byId[res.recipe.out], ri=CR.RIDX[d.rarity], rr=R(d.rarity); CR.flash&&CR.flash(null,rr.color); stage.innerHTML=''; stage.className='on'; CR.sfx.reveal(ri);
  const el=document.createElement('div'); el.className='reveal enter big'; el.style.setProperty('--rc',rr.color);
  el.innerHTML=`<div class="glowbg"></div><div class="rays"></div><canvas id="fusecv"></canvas>${res.isNew?'<div class="vbanner v-shiny">NEW FUSION DISCOVERED</div>':''}<div class="rt2">${rr.sym} ${rr.name.toUpperCase()}</div><div class="rn">${esc(d.name)}</div><p class="rdesc">${esc(d.desc)}</p><div class="rv">${cr(d.value)}</div>${res.first?`<div class="firstreg">Added to the Fusion Codex. Discovery bonus +${CR.fmt(res.bonus)} Credits</div>`:''}<div class="acts"><button class="btn primary" id="fok">Keep</button><button class="btn ghost" id="finsp">Inspect</button></div>`;
  stage.appendChild(el); itemCanvas($('#fusecv'),d.id,{speed:0.8}); $('#fok').onclick=()=>{CR.closeStage(); render();}; $('#finsp').onclick=()=>{CR.closeStage(); render(); inspect(d.id,res.inst.u);}; }

function mutationReveal(list){ const best=[...list].sort((a,b)=>CR.VARIANTS.findIndex(v=>v.id===b.to)-CR.VARIANTS.findIndex(v=>v.id===a.to))[0], v=CR.VARIANT_BY[best.to], ri=CR.VARIANTS.indexOf(v);

V.merge=()=>{

  const vrank=id=>id?CR.VARIANTS.findIndex(v=>v.id===id):-1;
  const card=g=>{ const d=CR.byId[g.d], rr=R(d.rarity), n=g.items.length, times=Math.floor(n/CR.MERGE_N), ng=CR.GRADES[g.g+1], cur=CR.GRADES[g.g], mch=CR.mutationTable(g.g+1).filter(r=>vrank(r.v.id)>vrank(g.vr)).reduce((s,r)=>s+r.p,0);

      <div class="spread"><b>${esc((cur.name?cur.name+' ':'')+(g.vr?CR.VARIANT_BY[g.vr].name+' ':'')+d.name)}${g.mut?' <span class="badge mutb">Mutated</span>':''}</b>${cur.stars?`<span class="gradestars g${g.g}">${cur.stars}</span>`:''}</div>
      <div class="row" style="gap:8px;margin:4px 0 8px"><span class="rtag" style="--rc:${rr.color}">${rr.sym} ${rr.name}</span><span class="muted" style="font-size:13px">${n} merge-ready ${n===1?'copy':'copies'}</span></div>
      <div class="mergeflow"><span>${CR.MERGE_N} × ${cr(d.value*CR.MERGE_N**g.g)}</span><span class="arrow">→</span><span><b>${ng.name}</b> <span class="gradestars g${g.g+1}">${ng.stars}</span> worth ${cr(d.value*CR.MERGE_N**(g.g+1))}</span></div>

      <div class="row" style="margin-top:10px">${times?`<button class="btn primary sm" data-a="merge" data-v="${g.d}:${g.g}:1:${g.mk}">Merge 3 into 1</button>${times>1?`<button class="btn sm" data-a="merge" data-v="${g.d}:${g.g}:${times}:${g.mk}">Merge all (${times})</button>`:''}`:`<span class="muted" style="font-size:13px">Need ${CR.MERGE_N-n} more</span>`}</div>
    </div></section>`; };
  return `<p class="muted" style="margin-bottom:6px;max-width:74ch">Merge ${CR.MERGE_N} copies of the same relic at the same grade into one of the next grade: Polished, then Pristine, then Radiant. The new copy is worth exactly what the three were together, and its museum perk gets stronger (1.5×, 2× and 3×).</p>

   <p class="muted" style="font-size:13px;margin:10px 0">A mutation turns the new relic into a variant, at far better odds than a crate. It’s a full variant: it sells for the variant’s value and gets its museum perk and income boost. A relic that is already a variant can only mutate into a rarer one.</p>

function invList(){ const f=st.inv; let L=S.inv.slice(); const cnt={}; S.inv.forEach(x=>cnt[x.d]=(cnt[x.d]||0)+1);
  if(f.q){ const q=f.q.toLowerCase(); L=L.filter(x=>CR.byId[x.d].name.toLowerCase().includes(q)); }
  if(f.rar) L=L.filter(x=>CR.byId[x.d].rarity===f.rar); if(f.col) L=L.filter(x=>CR.byId[x.d].collection===f.col);
  if(f.dupes) L=L.filter(x=>cnt[x.d]>1); if(f.vars) L=L.filter(x=>x.vr);
  const s={rarity:(a,b)=>CR.RIDX[CR.byId[b.d].rarity]-CR.RIDX[CR.byId[a.d].rarity]||CR.instValue(b)-CR.instValue(a),value:(a,b)=>CR.instValue(b)-CR.instValue(a),date:(a,b)=>b.t-a.t,name:(a,b)=>CR.byId[a.d].name.localeCompare(CR.byId[b.d].name)}[f.sort];
  const G=[]; if(S.settings.unstack) L.forEach(x=>G.push([x])); else { const m=new Map(); L.forEach(x=>{ const k=CR.stackKey(x); if(!m.has(k)){ m.set(k,[]); G.push(m.get(k)); } m.get(k).push(x); }); }
  G.forEach(g=>g.sort((a,b)=>b.t-a.t)); // newest copy leads the stack
  return {L:L.sort(s),G:G.sort((a,b)=>s(a[0],b[0])),cnt}; }
CR.stackKey=x=>x.d+'|'+(x.g||0)+'|'+CR.mergeKey(x);
const stackOf=x=>{ const k=CR.stackKey(x); return S.inv.filter(i=>CR.stackKey(i)===k).sort((a,b)=>b.t-a.t); };

   <div class="row" style="margin-bottom:16px"><input type="search" id="invq" placeholder="Search relics" value="${esc(f.q)}" aria-label="Search inventory" style="flex:1;min-width:180px">

   <div class="row" style="margin-bottom:16px;gap:6px"><button class="chip" aria-pressed="${!f.rar}" data-a="rar" data-v="">All</button>${CR.RARITIES.map(r=>`<button class="chip" style="--rc:${r.color}" aria-pressed="${f.rar===r.id}" data-a="rar" data-v="${r.id}">${r.sym} ${r.name}</button>`).join('')}</div>
   ${G.length?`<div class="tiles">${G.map(g=>{const n=g.length, sellIds=g.filter(CR.sellable).map(i=>i.u), x=g.find(CR.sellable)||g[0], d=CR.byId[x.d],rr=R(d.rarity),ok=sellIds.length>0,disp=g.some(i=>CR.isDisplayed(i.u)),lk=g.some(i=>i.lk),nw=g.some(i=>i.nw),nSel=g.filter(i=>f.sel.has(i.u)).length;
     return `<button class="tile r${CR.RIDX[d.rarity]} ${x.vr?'var v-'+x.vr:''} ${n>1?'stack':''} ${n>2?'stack3':''} ${nSel?'sel':''} ${f.select&&!ok?'dim':''}" style="--rc:${rr.color}" data-a="${f.select?'selstack':'inspect'}" data-v="${x.u}" aria-label="${esc(CR.instName(x))}${n>1?`, stack of ${n}`:''}"><div class="badges"><span>${nw?'<span class="badge new">New</span> ':''}${x.g?`<span class="badge grade g${x.g}" title="${CR.GRADES[x.g].name}">${CR.GRADES[x.g].stars}</span>`:''}${x.mut?' <span class="badge mutb" title="Mutated during a merge">🧬</span>':''}</span><span>${lk?'<span class="badge" title="Locked">🔒</span>':''}${disp?'<span class="badge">On display</span>':''}</span></div>${f.select?'<span class="check"></span>':''}${n>1?`<span class="stackcount" title="${n} copies">×${CR.fmt(n)}</span>`:''}${x.vr?`<span class="vribbon v-${x.vr}">${CR.VARIANT_BY[x.vr].sym} ${CR.VARIANT_BY[x.vr].name}</span>`:''}<img src="${CR.thumbX(x)}" alt="" loading="lazy"><div class="nm">${esc(CR.instName(x))}</div><div class="meta"><span class="rtag" style="--rc:${rr.color}">${rr.sym} ${rr.name}</span><span class="val" ${n>1?`title="${CR.fmt(CR.instValue(x)*n)} for all ${n}"`:''}>${CR.fmt(CR.instValue(x))}${n>1?'<small> ea</small>':''}</span></div>${f.select&&n>1&&ok?`<span class="stepper"><span class="stp" data-a="selminus" data-v="${x.u}" role="button" aria-label="Select one fewer">−</span><b>${nSel} / ${sellIds.length}</b><span class="stp" data-a="selplus" data-v="${x.u}" role="button" aria-label="Select one more">+</span></span>`:''}</button>`;}).join('')}</div>`:'<div class="empty">No items match these filters.</div>'}`;
};

  <section class="panel"><h2 style="margin-bottom:6px">Sound</h2>${tog('sfx','Sound effects','Reel ticks, reveals and interface sounds.')}${tog('music','Ambient hum','A quiet station drone in the background.')}<label class="spread" style="padding:12px 0;border-top:1px solid var(--line)"><span>Master volume</span><input type="range" min="0" max="1" step="0.05" value="${s.volume}" data-set="volume"></label></section>
